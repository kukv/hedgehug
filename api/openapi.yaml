components:
  schemas:
    AffectedWrite:
      additionalProperties: false
      properties:
        commit:
          type:
            - string
            - "null"
        tasks:
          description: The task and the tasks under it, as they are now
          items:
            $ref: "#/components/schemas/TaskView"
          type:
            - array
            - "null"
        ulids:
          description: The tasks purged
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - commit
      type: object
    CommentEditInputBody:
      additionalProperties: false
      properties:
        body:
          description: The comment in Markdown
          minLength: 1
          type: string
      required:
        - body
      type: object
    CommentInputBody:
      additionalProperties: false
      properties:
        body:
          description: The comment in Markdown
          minLength: 1
          type: string
      required:
        - body
      type: object
    CommentView:
      additionalProperties: false
      properties:
        author:
          type: string
        body:
          type: string
        created:
          format: date-time
          type: string
        ulid:
          type: string
      required:
        - ulid
        - author
        - created
        - body
      type: object
    CommentWrite:
      additionalProperties: false
      properties:
        comment:
          $ref: "#/components/schemas/CommentView"
          description: The comment as written; for a removal, as it was
        commit:
          description: The commit made; null when nothing changed
          type:
            - string
            - "null"
      required:
        - comment
        - commit
      type: object
    Count:
      additionalProperties: false
      properties:
        done:
          format: int64
          type: integer
        total:
          format: int64
          type: integer
      required:
        - done
        - total
      type: object
    CreateInputBody:
      additionalProperties: false
      properties:
        assignees:
          items:
            type: string
          type:
            - array
            - "null"
        kind:
          description: project for hh add --kind project
          type: string
        labels:
          items:
            type: string
          type:
            - array
            - "null"
        parent:
          description: "The parent: an ID or a ULID"
          type: string
        props:
          additionalProperties: {}
          description: Property name to value
          type: object
        status:
          type: string
        title:
          minLength: 1
          type: string
        workspace:
          description: The workspace, by name or prefix
          type: string
      required:
        - title
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    GroupView:
      additionalProperties: false
      properties:
        key:
          description: The value of the group; empty for the tasks with none
          type: string
        ulids:
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - key
        - ulids
      type: object
    HealthOutputBody:
      additionalProperties: false
      properties:
        pid:
          description: The process of the server
          format: int64
          type: integer
        version:
          description: The version of hedgehug
          type: string
      required:
        - version
        - pid
      type: object
    IndexProblem:
      additionalProperties: false
      properties:
        code:
          type: string
        field:
          type: string
        message:
          type: string
      required:
        - code
        - field
        - message
      type: object
    ListOutputBody:
      additionalProperties: false
      properties:
        cycle:
          description: The tasks in a parent cycle, with tree
          items:
            $ref: "#/components/schemas/TaskView"
          type:
            - array
            - "null"
        groups:
          description: "The groups, when the query has group:"
          items:
            $ref: "#/components/schemas/GroupView"
          type:
            - array
            - "null"
        roots:
          description: The roots of the tree, with tree
          items:
            $ref: "#/components/schemas/TaskView"
          type: array
        tasks:
          description: The tasks found, without tree
          items:
            $ref: "#/components/schemas/TaskView"
          type: array
      type: object
    LogView:
      additionalProperties: false
      properties:
        author:
          $ref: "#/components/schemas/LogViewAuthorStruct"
        date:
          format: date-time
          type: string
        hash:
          type: string
        id:
          type:
            - string
            - "null"
        op:
          type:
            - string
            - "null"
        subject:
          type: string
        task:
          type:
            - string
            - "null"
      required:
        - hash
        - date
        - author
        - op
        - task
        - id
        - subject
      type: object
    LogViewAuthorStruct:
      additionalProperties: false
      properties:
        email:
          type: string
        name:
          type: string
      required:
        - name
        - email
      type: object
    MoveInputBody:
      additionalProperties: false
      properties:
        after:
          description: Put it after this sibling
          type: string
        before:
          description: Put it before this sibling
          type: string
        parent:
          description: "The new parent: an ID or a ULID"
          type: string
        root:
          description: Move to the top, with no parent
          type: boolean
        workspace:
          description: Move to another workspace
          type: string
      type: object
    Notification:
      additionalProperties: false
      properties:
        author:
          type: string
        commit:
          type: string
        detail: {}
        id:
          type: string
        kind:
          type: string
        path:
          type: string
        read:
          type: boolean
        store:
          type: string
        task:
          $ref: "#/components/schemas/Ref"
        time:
          format: date-time
          type: string
        to:
          type: string
        ulid:
          type: string
      required:
        - read
        - store
        - task
        - ulid
        - kind
        - commit
        - author
        - to
        - time
      type: object
    NotificationPatchInputBody:
      additionalProperties: false
      properties:
        read:
          description: true marks it read; items cannot be marked unread
          type: boolean
      required:
        - read
      type: object
    PatchInputBody:
      additionalProperties: false
      properties:
        assignees:
          description: Replaces the assignees
          items:
            type: string
          type: array
        blocked_by:
          description: "Replaces the blockers: IDs or ULIDs"
          items:
            type: string
          type: array
        body:
          description: The body in Markdown
          type: string
        kind:
          type: string
        labels:
          description: Replaces the labels
          items:
            type: string
          type: array
        props:
          additionalProperties: {}
          description: Property name to value; null clears it, a list replaces a multiple value
          type: object
        repos:
          description: Replaces the repos
          items:
            type: string
          type: array
        status:
          type: string
        title:
          type: string
        watchers:
          description: Replaces the watchers
          items:
            type: string
          type: array
      type: object
    Problem:
      additionalProperties: false
      properties:
        args:
          additionalProperties: {}
          description: The arguments of the error, by name
          type: object
        detail:
          description: The message in English, as the CLI prints it
          type: string
        errors:
          description: What was wrong in the request, for request.invalid
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        status:
          format: int64
          type: integer
        title:
          description: The text of the HTTP status
          type: string
        type:
          description: What went wrong, such as task.not_found
          type: string
      required:
        - type
        - title
        - status
      type: object
    Ref:
      additionalProperties: false
      properties:
        id:
          type: string
        title:
          type: string
        ulid:
          type: string
      required:
        - ulid
        - id
        - title
      type: object
    ShowView:
      additionalProperties: false
      properties:
        assignees:
          items:
            type: string
          type:
            - array
            - "null"
        blocked_by:
          items:
            $ref: "#/components/schemas/Ref"
          type:
            - array
            - "null"
        body:
          type: string
        broken:
          type: string
        checklist:
          $ref: "#/components/schemas/Count"
        children:
          items:
            $ref: "#/components/schemas/TaskView"
          type:
            - array
            - "null"
        comments:
          items:
            $ref: "#/components/schemas/CommentView"
          type:
            - array
            - "null"
        context:
          type: boolean
        created:
          format: date-time
          type: string
        deleted_at:
          format: date-time
          type:
            - string
            - "null"
        former_ids:
          items:
            type: string
          type:
            - array
            - "null"
        history:
          items:
            $ref: "#/components/schemas/LogView"
          type:
            - array
            - "null"
        id:
          type: string
        in_cycle:
          type: boolean
        kind:
          type: string
        labels:
          items:
            type: string
          type:
            - array
            - "null"
        parent:
          type:
            - string
            - "null"
        problems:
          items:
            $ref: "#/components/schemas/IndexProblem"
          type:
            - array
            - "null"
        progress:
          $ref: "#/components/schemas/Count"
        props:
          additionalProperties: {}
          type: object
        rank:
          type: string
        referenced_by:
          items:
            $ref: "#/components/schemas/Ref"
          type:
            - array
            - "null"
        repos:
          items:
            type: string
          type:
            - array
            - "null"
        reverse:
          additionalProperties:
            items:
              $ref: "#/components/schemas/Ref"
            type:
              - array
              - "null"
          type: object
        status:
          type: string
        title:
          type: string
        ulid:
          type: string
        updated:
          format: date-time
          type: string
        watchers:
          items:
            type: string
          type:
            - array
            - "null"
        workspace:
          $ref: "#/components/schemas/WorkspaceRef"
      required:
        - body
        - watchers
        - repos
        - comments
        - reverse
        - referenced_by
        - history
        - ulid
        - id
        - workspace
        - kind
        - title
        - parent
        - rank
        - status
        - assignees
        - labels
        - blocked_by
        - props
        - created
        - updated
        - deleted_at
        - problems
      type: object
    TaskView:
      additionalProperties: false
      properties:
        assignees:
          items:
            type: string
          type:
            - array
            - "null"
        blocked_by:
          items:
            $ref: "#/components/schemas/Ref"
          type:
            - array
            - "null"
        broken:
          type: string
        checklist:
          $ref: "#/components/schemas/Count"
        children:
          items:
            $ref: "#/components/schemas/TaskView"
          type:
            - array
            - "null"
        context:
          type: boolean
        created:
          format: date-time
          type: string
        deleted_at:
          format: date-time
          type:
            - string
            - "null"
        former_ids:
          items:
            type: string
          type:
            - array
            - "null"
        id:
          type: string
        in_cycle:
          type: boolean
        kind:
          type: string
        labels:
          items:
            type: string
          type:
            - array
            - "null"
        parent:
          type:
            - string
            - "null"
        problems:
          items:
            $ref: "#/components/schemas/IndexProblem"
          type:
            - array
            - "null"
        progress:
          $ref: "#/components/schemas/Count"
        props:
          additionalProperties: {}
          type: object
        rank:
          type: string
        status:
          type: string
        title:
          type: string
        ulid:
          type: string
        updated:
          format: date-time
          type: string
        workspace:
          $ref: "#/components/schemas/WorkspaceRef"
      required:
        - ulid
        - id
        - workspace
        - kind
        - title
        - parent
        - rank
        - status
        - assignees
        - labels
        - blocked_by
        - props
        - created
        - updated
        - deleted_at
        - problems
      type: object
    TaskWrite:
      additionalProperties: false
      properties:
        commit:
          description: The commit made; null when nothing changed
          type:
            - string
            - "null"
        note:
          description: What restore at a commit has to say, as hh restore --at prints it
          type: string
        task:
          $ref: "#/components/schemas/TaskView"
      required:
        - task
        - commit
      type: object
    UndoKept:
      additionalProperties: false
      properties:
        author:
          type: string
        field:
          type: string
        path:
          type: string
        task:
          description: The ID of the task; empty for other files
          type: string
      required:
        - path
        - field
        - author
      type: object
    UndoWrite:
      additionalProperties: false
      properties:
        commit:
          type:
            - string
            - "null"
        kept:
          description: What others changed after it, which undo kept
          items:
            $ref: "#/components/schemas/UndoKept"
          type:
            - array
            - "null"
        undone:
          $ref: "#/components/schemas/LogView"
          description: The commit taken back
      required:
        - undone
        - commit
        - kept
      type: object
    WorkspaceRef:
      additionalProperties: false
      properties:
        id_prefix:
          type: string
        name:
          type: string
        ulid:
          type: string
      required:
        - ulid
        - name
        - id_prefix
      type: object
  securitySchemes:
    bearer:
      scheme: bearer
      type: http
info:
  title: Hedgehug
  version: "1"
openapi: 3.1.0
paths:
  /api/activity:
    get:
      operationId: list-activity
      parameters:
        - description: The store; without it, the one hedgehug picks as the CLI does
          explode: false
          in: query
          name: store
          schema:
            description: The store; without it, the one hedgehug picks as the CLI does
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            default: 100
            format: int64
            maximum: 1000
            minimum: 1
            type: integer
        - description: Only the commits of this account (its ID)
          explode: false
          in: query
          name: author
          schema:
            description: Only the commits of this account (its ID)
            type: string
        - description: "only: the merges and repairs of syncs; exclude: all but them"
          explode: false
          in: query
          name: sync
          schema:
            description: "only: the merges and repairs of syncs; exclude: all but them"
            enum:
              - only
              - exclude
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/LogView"
                type:
                  - array
                  - "null"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: List the commits of the store, newest first, as hh log
      tags:
        - activity
  /api/health:
    get:
      operationId: get-health
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Check that the server is up
      tags:
        - server
  /api/notifications:
    get:
      operationId: list-notifications
      parameters:
        - description: Include the items read
          explode: false
          in: query
          name: all
          schema:
            description: Include the items read
            type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Notification"
                type:
                  - array
                  - "null"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: List the inbox of every store, newest first, as hh inbox
      tags:
        - notifications
  /api/notifications/{id}:
    patch:
      operationId: update-notification
      parameters:
        - description: The ULID of the item
          in: path
          name: id
          required: true
          schema:
            description: The ULID of the item
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationPatchInputBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Mark an item read, as hh inbox read
      tags:
        - notifications
  /api/notifications/{id}/revert:
    post:
      operationId: revert-notification
      parameters:
        - description: The ULID of the item
          in: path
          name: id
          required: true
          schema:
            description: The ULID of the item
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskWrite"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Write my overwritten value back, as hh inbox revert
      tags:
        - notifications
  /api/tasks:
    get:
      operationId: list-tasks
      parameters:
        - description: The store; without it, the one hedgehug picks as the CLI does
          explode: false
          in: query
          name: store
          schema:
            description: The store; without it, the one hedgehug picks as the CLI does
            type: string
        - description: The query, as hh ls takes it; empty for every task
          explode: false
          in: query
          name: q
          schema:
            description: The query, as hh ls takes it; empty for every task
            type: string
        - description: Return the tasks as a tree, as hh ls --tree
          explode: false
          in: query
          name: tree
          schema:
            description: Return the tasks as a tree, as hh ls --tree
            type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: List the tasks a query finds
      tags:
        - tasks
    post:
      operationId: create-task
      parameters:
        - description: The store; without it, the one hedgehug picks as the CLI does
          explode: false
          in: query
          name: store
          schema:
            description: The store; without it, the one hedgehug picks as the CLI does
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskWrite"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Add a task, as hh add
      tags:
        - tasks
  /api/tasks/{id}:
    delete:
      operationId: delete-task
      parameters:
        - description: The store; without it, the one hedgehug picks as the CLI does
          explode: false
          in: query
          name: store
          schema:
            description: The store; without it, the one hedgehug picks as the CLI does
            type: string
        - description: The ID, a former ID, or the ULID of the task
          in: path
          name: id
          required: true
          schema:
            description: The ID, a former ID, or the ULID of the task
            type: string
        - description: Remove the files for good; the task must be deleted already
          explode: false
          in: query
          name: purge
          schema:
            description: Remove the files for good; the task must be deleted already
            type: boolean
        - description: "With purge: the ULIDs the user agreed to purge, comma-separated, as purge.unconfirmed listed them"
          explode: false
          in: query
          name: confirm
          schema:
            description: "With purge: the ULIDs the user agreed to purge, comma-separated, as purge.unconfirmed listed them"
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AffectedWrite"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Delete a task and the tasks under it (hh rm), or purge them (hh purge)
      tags:
        - tasks
    get:
      operationId: get-task
      parameters:
        - description: The store; without it, the one hedgehug picks as the CLI does
          explode: false
          in: query
          name: store
          schema:
            description: The store; without it, the one hedgehug picks as the CLI does
            type: string
        - description: The ID, a former ID, or the ULID of the task
          in: path
          name: id
          required: true
          schema:
            description: The ID, a former ID, or the ULID of the task
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShowView"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Show a task, as hh show
      tags:
        - tasks
    patch:
      operationId: update-task
      parameters:
        - description: The store; without it, the one hedgehug picks as the CLI does
          explode: false
          in: query
          name: store
          schema:
            description: The store; without it, the one hedgehug picks as the CLI does
            type: string
        - description: The ID, a former ID, or the ULID of the task
          in: path
          name: id
          required: true
          schema:
            description: The ID, a former ID, or the ULID of the task
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskWrite"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Change the fields sent, in one commit, as hh set and hh edit
      tags:
        - tasks
  /api/tasks/{id}/comments:
    post:
      operationId: add-comment
      parameters:
        - description: The store; without it, the one hedgehug picks as the CLI does
          explode: false
          in: query
          name: store
          schema:
            description: The store; without it, the one hedgehug picks as the CLI does
            type: string
        - description: The ID, a former ID, or the ULID of the task
          in: path
          name: id
          required: true
          schema:
            description: The ID, a former ID, or the ULID of the task
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentWrite"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Add a comment, as hh comment add
      tags:
        - comments
  /api/tasks/{id}/comments/{cid}:
    delete:
      operationId: remove-comment
      parameters:
        - description: The store; without it, the one hedgehug picks as the CLI does
          explode: false
          in: query
          name: store
          schema:
            description: The store; without it, the one hedgehug picks as the CLI does
            type: string
        - description: The ID, a former ID, or the ULID of the task
          in: path
          name: id
          required: true
          schema:
            description: The ID, a former ID, or the ULID of the task
            type: string
        - description: The ULID of the comment
          in: path
          name: cid
