components:
  schemas:
    AccountBody:
      additionalProperties: false
      properties:
        id:
          type: string
        login:
          type: string
        method:
          enum:
            - device
            - gh
            - env
            - keychain
          type: string
        name:
          type: string
      required:
        - id
        - name
        - login
        - method
      type: object
    AccountRow:
      additionalProperties: false
      properties:
        id:
          type: string
        login:
          type: string
        method:
          enum:
            - device
            - gh
            - env
            - keychain
          type: string
        name:
          type: string
        reason:
          type: string
        status:
          enum:
            - ok
            - auth_error
          type: string
      required:
        - id
        - name
        - login
        - method
        - status
        - reason
      type: object
    CreateItem:
      additionalProperties: false
      properties:
        kind:
          enum:
            - Epic
            - Story
            - Task
            - Bug
            - Step
          type: string
        parent:
          description: 空は親を選んでいない
          type: string
        project:
          description: 空はプロジェクトを選んでいない
          type: string
        title:
          type: string
      required:
        - project
        - kind
        - title
      type: object
    CreateProject:
      additionalProperties: false
      properties:
        end:
          pattern: ^(\d{4}-\d{2}-\d{2})?$
          type: string
        owner:
          type: string
        start:
          pattern: ^(\d{4}-\d{2}-\d{2})?$
          type: string
        status:
          enum:
            - Todo
            - InProgress
            - Done
            - Pending
            - Cancel
            - ""
          type: string
        title:
          description: 1 行。改行は入れられない
          pattern: ^[^\r\n]*$
          type: string
      required:
        - title
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          example: Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          nullable: true
          type: array
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          example: https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          example: 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          example: Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          example: https://example.com/errors/example
          format: uri
          type: string
      type: object
    ImpactOutputBody:
      additionalProperties: false
      properties:
        lines:
          items:
            type: string
          nullable: true
          type: array
      required:
        - lines
      type: object
    Item:
      additionalProperties: false
      properties:
        createdAt:
          type: string
        createdBy:
          type: string
        id:
          type: string
        kind:
          enum:
            - Epic
            - Story
            - Task
            - Bug
            - Step
          type: string
        number:
          format: int64
          type: integer
        parent:
          description: 親の内部 ID。Epic は null
          nullable: true
          type: string
        project:
          type: string
        rank:
          type: string
        title:
          type: string
        watchers:
          items:
            type: string
          nullable: true
          type: array
        workspace:
          type: string
      required:
        - id
        - workspace
        - project
        - parent
        - number
        - kind
        - rank
        - title
        - watchers
        - createdAt
        - createdBy
      type: object
    ListOutputBody:
      additionalProperties: false
      properties:
        accounts:
          items:
            $ref: "#/components/schemas/AccountRow"
          nullable: true
          type: array
      required:
        - accounts
      type: object
    Project:
      additionalProperties: false
      properties:
        end:
          type: string
        id:
          type: string
        number:
          format: int64
          type: integer
        owner:
          description: ログイン名。空は「なし」
          type: string
        rank:
          type: string
        start:
          description: YYYY-MM-DD。空は「なし」
          type: string
        status:
          enum:
            - Todo
            - InProgress
            - Done
            - Pending
            - Cancel
          type: string
        title:
          type: string
        workspace:
          type: string
      required:
        - id
        - workspace
        - number
        - rank
        - title
        - owner
        - status
        - start
        - end
      type: object
    SignInCode:
      additionalProperties: false
      properties:
        expires_in:
          description: 秒
          format: int64
          type: integer
        id:
          type: string
        interval:
          description: 秒
          format: int64
          type: integer
        user_code:
          type: string
        verification_uri:
          type: string
      required:
        - id
        - user_code
        - verification_uri
        - expires_in
        - interval
      type: object
    SignInInputBody:
      additionalProperties: false
      properties:
        account:
          description: 編集・再認証するアカウントの ID。登録では空
          type: string
        login:
          type: string
        name:
          type: string
      required:
        - name
        - login
      type: object
    SignInResult:
      additionalProperties: false
      properties:
        account:
          $ref: "#/components/schemas/AccountBody"
        interval:
          description: 次に問い合わせるまでの秒
          format: int64
          type: integer
        message:
          type: string
        state:
          enum:
            - waiting
            - expired
            - denied
            - mismatch
            - failed
            - done
          type: string
      required:
        - state
        - message
        - interval
      type: object
    SystemInfo:
      additionalProperties: false
      properties:
        version:
          description: hedgehug の版
          type: string
      required:
        - version
      type: object
    ValuesBody:
      additionalProperties: false
      properties:
        login:
          type: string
        method:
          description: デバイスフローはサインインの API で登録・保存する
          enum:
            - gh
            - env
            - keychain
          type: string
        name:
          type: string
      required:
        - name
        - login
        - method
      type: object
info:
  title: hedgehug
  version: dev
openapi: 3.0.3
paths:
  /api/accounts:
    get:
      operationId: list-accounts
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: 登録したアカウントを、状態を付けて返す
    post:
      operationId: add-account
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValuesBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountBody"
          description: Created
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: GitHub で確かめてからアカウントを登録する
  /api/accounts/{id}:
    delete:
      operationId: delete-account
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: アカウントを削除し、割り当てた Store を「なし」にする
    put:
      operationId: edit-account
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValuesBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountBody"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: 新しい値を GitHub で確かめてから、アカウントの値を入れ替える
  /api/accounts/{id}/delete-impact:
    get:
      operationId: account-delete-impact
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImpactOutputBody"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: 「アカウントを削除」の確認の本文の行
  /api/accounts/{id}/edit-impact:
    get:
      operationId: account-edit-impact
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - explode: false
          in: query
          name: login
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImpactOutputBody"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: ログイン名を変えるときの「アカウントを変更」の確認の本文の行(空なら確認を出さない)
  /api/accounts/{id}/reauth:
    post:
      operationId: reauth-account
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountBody"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: gh CLI・環境変数・OS のキーチェーンのアカウントの認証の確認をやり直す
  /api/sign-ins:
    post:
      operationId: start-sign-in
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInCode"
          description: Created
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: デバイスフローのサインインを始め、GitHub で入力するコードを返す
  /api/sign-ins/{id}:
    delete:
      operationId: cancel-sign-in
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: サインインをやめる(何も登録しない)
    get:
      operationId: poll-sign-in
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInResult"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: サインインが許可されたかを GitHub に 1 回聞く
  /api/stores/{store}/items:
    post:
      operationId: create-item
      parameters:
        - in: path
          name: store
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateItem"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: アイテムを作成
  /api/stores/{store}/items/{item}:
    get:
      operationId: get-item
      parameters:
        - in: path
          name: store
          required: true
          schema:
            type: string
        - in: path
          name: item
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: アイテムを返す
  /api/stores/{store}/projects/{project}:
    get:
      operationId: get-project
      parameters:
        - in: path
          name: store
          required: true
          schema:
            type: string
        - in: path
          name: project
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: プロジェクトを返す
  /api/stores/{store}/projects/{project}/items:
    get:
      operationId: list-project-items
      parameters:
        - in: path
          name: store
          required: true
          schema:
            type: string
        - in: path
          name: project
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Item"
                nullable: true
                type: array
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: プロジェクトのすべてのアイテムを番号の順で返す
  /api/stores/{store}/workspaces/{workspace}/projects:
    get:
      operationId: list-projects
      parameters:
        - in: path
          name: store
          required: true
          schema:
            type: string
        - in: path
          name: workspace
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Project"
                nullable: true
                type: array
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: ワークスペースのプロジェクトを並び順で返す
    post:
      operationId: create-project
      parameters:
        - in: path
          name: store
          required: true
          schema:
            type: string
        - in: path
          name: workspace
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProject"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: プロジェクトを作成
  /api/system:
    get:
      operationId: get-system
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemInfo"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: サーバーの版を返す
