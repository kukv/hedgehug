components:
  schemas:
    AccountBody:
      additionalProperties: false
      properties:
        id:
          type: string
        login:
          type: string
        method:
          enum:
            - device
            - gh
            - env
            - keychain
          type: string
        name:
          type: string
      required:
        - id
        - name
        - login
        - method
      type: object
    AccountRow:
      additionalProperties: false
      properties:
        id:
          type: string
        login:
          type: string
        method:
          enum:
            - device
            - gh
            - env
            - keychain
          type: string
        name:
          type: string
        reason:
          type: string
        status:
          enum:
            - ok
            - auth_error
          type: string
      required:
        - id
        - name
        - login
        - method
        - status
        - reason
      type: object
    AddStep:
      additionalProperties: false
      properties:
        title:
          type: string
      required:
        - title
      type: object
    AddWorkspaceProperty:
      additionalProperties: false
      properties:
        key:
          type: string
        kinds:
          description: 使う種類。空ならすべて
          items:
            type: string
          type: array
        name:
          description: 1 行。改行は入れられない
          pattern: ^[^\r\n]*$
          type: string
        type:
          enum:
            - text
            - number
            - date
            - single
            - multi
            - user
            - check
            - url
          type: string
      required:
        - name
        - key
        - type
        - kinds
      type: object
    AddWorkspaceValue:
      additionalProperties: false
      properties:
        name:
          description: 1 行。改行は入れられない
          pattern: ^[^\r\n]*$
          type: string
      required:
        - name
      type: object
    ApplyAutomationIgnoringWorkflow:
      additionalProperties: false
      properties:
        status:
          description: 変えるステータスの ID(通知の Status)
          type: string
      required:
        - status
      type: object
    AutomationRule:
      additionalProperties: false
      properties:
        action:
          enum:
            - status
            - assignee
          type: string
        allMerged:
          description: きっかけが pr_merged のときの条件
          type: boolean
        enabled:
          type: boolean
        id:
          type: string
        name:
          type: string
        trigger:
          enum:
            - pr_open
            - review_requested
            - pr_merged
            - issue_closed
            - status
            - steps_done
          type: string
        triggerStatus:
          description: きっかけが status のときのステータスの ID。ほかは空
          type: string
        value:
          description: ステータスの ID、ログイン名、または @none(未割り当て)
          type: string
      required:
        - id
        - enabled
        - name
        - trigger
        - triggerStatus
        - allMerged
        - action
        - value
      type: object
    AutomationRuleInput:
      additionalProperties: false
      properties:
        action:
          enum:
            - status
            - assignee
          type: string
        allMerged:
          description: きっかけが pr_merged のときの条件
          type: boolean
        name:
          type: string
        trigger:
          enum:
            - pr_open
            - review_requested
            - pr_merged
            - issue_closed
            - status
            - steps_done
          type: string
        triggerStatus:
          description: きっかけが status のときのステータスの ID。ほかは空
          type: string
        value:
          description: ステータスの ID、ログイン名、または @none(未割り当て)
          type: string
      required:
        - name
        - trigger
        - triggerStatus
        - allMerged
        - action
        - value
      type: object
    AutomationRun:
      additionalProperties: false
      properties:
        at:
          format: date-time
          type: string
        display:
          type: string
        item:
          type: string
        text:
          type: string
      required:
        - at
        - item
        - display
        - text
      type: object
    ChangeWorkspacePrefix:
      additionalProperties: false
      properties:
        prefix:
          type: string
      required:
        - prefix
      type: object
    CheckStep:
      additionalProperties: false
      properties:
        done:
          type: boolean
      required:
        - done
      type: object
    CreateItem:
      additionalProperties: false
      properties:
        description:
          description: もとになるアイテムの説明(Markdown)。空は説明なし。子の説明はテンプレートのものを使う
          type: string
        kind:
          enum:
            - Epic
            - Story
            - Task
            - Bug
            - Step
          type: string
        parent:
          description: 空は親を選んでいない
          type: string
        project:
          description: 空はプロジェクトを選んでいない
          type: string
        template:
          description: 一緒に作るテンプレートの内部 ID。空は「なし」
          type: string
        title:
          type: string
        values:
          additionalProperties: {}
          description: プロパティの値(キーはプロパティの内部 ID。組み込みはキー)
          type: object
      required:
        - project
        - kind
        - title
      type: object
    CreateProject:
      additionalProperties: false
      properties:
        end:
          pattern: ^(\d{4}-\d{2}-\d{2})?$
          type: string
        owner:
          type: string
        start:
          pattern: ^(\d{4}-\d{2}-\d{2})?$
          type: string
        status:
          enum:
            - Todo
            - InProgress
            - Done
            - Pending
            - Cancel
            - ""
          type: string
        title:
          description: 1 行。改行は入れられない
          pattern: ^[^\r\n]*$
          type: string
      required:
        - title
      type: object
    CreateWorkspace:
      additionalProperties: false
      properties:
        name:
          description: 1 行。改行は入れられない
          pattern: ^[^\r\n]*$
          type: string
        prefix:
          type: string
      required:
        - name
        - prefix
      type: object
    DescribeBody:
      additionalProperties: false
      properties:
        base:
          description: 編集を始めたときの説明。保存するときの共通の祖先になる
          type: string
        text:
          description: 入力した説明。空白だけは空として保存する(説明を消す)
          type: string
      required:
        - base
        - text
      type: object
    DescribeResult:
      additionalProperties: false
      properties:
        conflict:
          description: 同じ箇所が同時に編集されて、両方の版を残したとき true
          type: boolean
        text:
          description: 保存したあとの説明
          type: string
      required:
        - text
        - conflict
      type: object
    DescriptionText:
      additionalProperties: false
      properties:
        text:
          description: 説明の本文(Markdown)。説明がなければ空
          type: string
      required:
        - text
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          example: Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          nullable: true
          type: array
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          example: https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          example: 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          example: Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          example: https://example.com/errors/example
          format: uri
          type: string
      type: object
    ImpactOutputBody:
      additionalProperties: false
      properties:
        lines:
          items:
            type: string
          nullable: true
          type: array
      required:
        - lines
      type: object
    Item:
      additionalProperties: false
      properties:
        assignee:
          description: ログイン名。空は未割り当て
          type: string
        choices:
          additionalProperties:
            items:
              type: string
            nullable: true
            type: array
          description: 選択式の追加プロパティの値(プロパティの内部 ID → 値の内部 ID)
          type: object
        createdAt:
          type: string
        createdBy:
          type: string
        end:
          type: string
        estimate:
          description: 時間
          format: double
          nullable: true
          type: number
        fields:
          additionalProperties: {}
          description: 追加プロパティの値(プロパティの内部 ID → 値)。型は設定で読む
          type: object
        id:
          type: string
        kind:
          enum:
            - Epic
            - Story
            - Task
            - Bug
            - Step
          type: string
        number:
          format: int64
          type: integer
        parent:
          description: 親の内部 ID。Epic は null
          nullable: true
          type: string
        points:
          format: double
          nullable: true
          type: number
        priority:
          type: string
        project:
          type: string
        rank:
          type: string
        start:
          description: YYYY-MM-DD。空は値なし
          type: string
        status:
          description: ステータスの内部 ID。空は値なし
          type: string
        systems:
          items:
            type: string
          type: array
        title:
          type: string
        watchers:
          items:
            type: string
          nullable: true
          type: array
        workspace:
          type: string
      required:
        - id
        - workspace
        - project
        - parent
        - number
        - kind
        - rank
        - title
        - watchers
        - createdAt
        - createdBy
        - status
        - priority
        - assignee
        - start
        - end
        - points
        - estimate
        - systems
        - choices
        - fields
      type: object
    ListOutputBody:
      additionalProperties: false
      properties:
        accounts:
          items:
            $ref: "#/components/schemas/AccountRow"
          nullable: true
          type: array
      required:
        - accounts
      type: object
    Me:
      additionalProperties: false
      properties:
        login:
          type: string
      required:
        - login
      type: object
    Member:
      additionalProperties: false
      properties:
        login:
          type: string
        name:
          type: string
      required:
        - login
        - name
      type: object
    MoveWorkspaceItem:
      additionalProperties: false
      properties:
        direction:
          enum:
            - up
            - down
          type: string
      required:
        - direction
      type: object
    NextNumber:
      additionalProperties: false
      properties:
        number:
          format: int64
          type: integer
      required:
        - number
      type: object
    Project:
      additionalProperties: false
      properties:
        end:
          type: string
        id:
          type: string
        number:
          format: int64
          type: integer
        owner:
          description: ログイン名。空は「なし」
          type: string
        rank:
          type: string
        start:
          description: YYYY-MM-DD。空は「なし」
          type: string
        status:
          enum:
            - Todo
            - InProgress
            - Done
            - Pending
            - Cancel
          type: string
        title:
          type: string
        workspace:
          type: string
      required:
        - id
        - workspace
        - number
        - rank
        - title
        - owner
        - status
        - start
        - end
      type: object
    RenameItem:
      additionalProperties: false
      properties:
        title:
          type: string
      required:
        - title
      type: object
    RenameWorkspace:
      additionalProperties: false
      properties:
        name:
          description: 1 行。改行は入れられない
          pattern: ^[^\r\n]*$
          type: string
      required:
        - name
      type: object
    RenameWorkspaceProperty:
      additionalProperties: false
      properties:
        name:
          description: 1 行。改行は入れられない
          pattern: ^[^\r\n]*$
          type: string
      required:
        - name
      type: object
    RenameWorkspaceValue:
      additionalProperties: false
      properties:
        name:
          description: 1 行。改行は入れられない
          pattern: ^[^\r\n]*$
          type: string
      required:
        - name
      type: object
    SaveItemAsTemplate:
      additionalProperties: false
      properties:
        name:
          type: string
        structure:
          description: 子と Step を含める
          type: boolean
        title:
          type: string
      required:
        - name
        - title
        - structure
      type: object
    SetAutomationRuleEnabled:
      additionalProperties: false
      properties:
        enabled:
          type: boolean
      required:
        - enabled
      type: object
    SetItemProperty:
      additionalProperties: false
      properties:
        value:
          description: 新しい値。null と空の文字列は値を空にする
      required:
        - value
      type: object
    SetWorkspacePropertyHidden:
      additionalProperties: false
      properties:
        hidden:
          type: boolean
      required:
        - hidden
      type: object
    SetWorkspacePropertyKinds:
      additionalProperties: false
      properties:
        kinds:
          items:
            type: string
          type: array
      required:
        - kinds
      type: object
    SetWorkspaceStatusCategory:
      additionalProperties: false
      properties:
        category:
          enum:
            - todo
            - doing
            - done
            - canceled
          type: string
      required:
        - category
      type: object
    SetWorkspaceTemplateDefault:
      additionalProperties: false
      properties:
        template:
          description: テンプレートの ID。空なら「なし」
          type: string
      required:
        - template
      type: object
    SetWorkspaceTransition:
      additionalProperties: false
      properties:
        allowed:
          type: boolean
      required:
        - allowed
      type: object
    SetWorkspaceValueColor:
      additionalProperties: false
      properties:
        color:
          enum:
            - gray
            - slate
            - brown
            - red
            - rose
            - pink
            - magenta
            - purple
            - indigo
            - blue
            - sky
            - cyan
            - teal
            - green
            - olive
            - amber
            - yellow
            - orange
          type: string
      required:
        - color
      type: object
    SetWorkspaceValueRef:
      additionalProperties: false
      properties:
        value:
          type: string
      required:
        - value
      type: object
    SignInCode:
      additionalProperties: false
      properties:
        expires_in:
          description: 秒
          format: int64
          type: integer
        id:
          type: string
        interval:
          description: 秒
          format: int64
          type: integer
        user_code:
          type: string
        verification_uri:
          type: string
      required:
        - id
        - user_code
        - verification_uri
        - expires_in
        - interval
      type: object
    SignInInputBody:
      additionalProperties: false
      properties:
        account:
          description: 編集・再認証するアカウントの ID。登録では空
          type: string
        login:
          type: string
        name:
          type: string
      required:
        - name
        - login
      type: object
    SignInResult:
      additionalProperties: false
      properties:
        account:
          $ref: "#/components/schemas/AccountBody"
        interval:
          description: 次に問い合わせるまでの秒
          format: int64
          type: integer
        message:
          type: string
        state:
          enum:
            - waiting
            - expired
            - denied
            - mismatch
            - failed
            - done
          type: string
      required:
        - state
        - message
        - interval
      type: object
    StoreInfo:
      additionalProperties: false
      properties:
        color:
          description: 画面のトークン --t-<色> の名前
          type: string
        id:
          type: string
        name:
          type: string
        readOnly:
          type: boolean
      required:
        - id
        - name
        - color
        - readOnly
      type: object
    SyncAllResult:
      additionalProperties: false
      properties:
        lines:
          items:
            type: string
          type: array
        result:
          enum:
            - synced
            - failed
            - nothing
          type: string
      required:
        - result
        - lines
      type: object
    SyncHold:
      additionalProperties: false
      properties:
        hold:
          type: boolean
        tab:
          maxLength: 64
          minLength: 1
          type: string
      required:
        - tab
        - hold
      type: object
    SyncNetwork:
      additionalProperties: false
      properties:
        online:
          type: boolean
        tab:
          maxLength: 64
          minLength: 1
          type: string
      required:
        - tab
        - online
      type: object
    SyncStatusList:
      additionalProperties: false
      properties:
        auto:
          description: 「裏で自動的に同期する」がオンか(オフラインの帯の文を選ぶ)
          type: boolean
        stores:
          items:
            $ref: "#/components/schemas/SyncStoreStatus"
          type: array
      required:
        - auto
        - stores
      type: object
    SyncStoreResult:
      additionalProperties: false
      properties:
        message:
          type: string
        mirrorWarning:
          description: ミラーに送れなかったときの警告のトースト。なければ空
          type: string
        result:
          description: synced はトースト、skipped は案内、failed はエラーのトースト
          enum:
            - synced
            - skipped
            - failed
          type: string
      required:
        - result
        - message
        - mirrorWarning
      type: object
    SyncStoreStatus:
      additionalProperties: false
      properties:
        error:
          description: 同期エラーなら短い理由(06 の表の文言)。なければ空
          type: string
        hidden:
          type: boolean
        lastSuccess:
          description: 最後に成功した同期の時刻(RFC 3339、UTC)。なければ空
          type: string
        name:
          type: string
        readOnly:
          type: boolean
        store:
          type: string
        unsent:
          description: 未送信の保存の数
          format: int64
          type: integer
      required:
        - store
        - name
        - hidden
        - readOnly
        - error
        - unsent
        - lastSuccess
      type: object
    SystemInfo:
      additionalProperties: false
      properties:
        version:
          description: hedgehug の版
          type: string
      required:
        - version
      type: object
    ValuesBody:
      additionalProperties: false
      properties:
        login:
          type: string
        method:
          description: デバイスフローはサインインの API で登録・保存する
          enum:
            - gh
            - env
            - keychain
          type: string
        name:
          type: string
      required:
        - name
        - login
        - method
      type: object
    WorkspaceAutomation:
      additionalProperties: false
      properties:
        recent:
          items:
            $ref: "#/components/schemas/AutomationRun"
          nullable: true
          type: array
        rules:
          items:
            $ref: "#/components/schemas/AutomationRule"
          nullable: true
          type: array
      required:
        - rules
        - recent
      type: object
    WorkspaceDetail:
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        oldPrefixes:
          items:
            type: string
          type: array
        prefix:
          type: string
        settings:
          $ref: "#/components/schemas/WorkspaceSettings"
      required:
        - oldPrefixes
        - settings
        - id
        - name
        - prefix
      type: object
    WorkspaceProperty:
      additionalProperties: false
      properties:
        builtin:
          type: boolean
        choices:
          description: 選択肢(単一選択・複数選択だけ。ほかは空)
          items:
            $ref: "#/components/schemas/WorkspaceValue"
          type: array
        hidden:
          type: boolean
        id:
          type: string
        key:
          type: string
        kinds:
          items:
            type: string
          type: array
        name:
          type: string
        type:
          type: string
      required:
        - id
        - key
        - name
        - type
        - builtin
        - kinds
        - hidden
        - choices
      type: object
    WorkspaceSettings:
      additionalProperties: false
      properties:
        categoryDefaults:
          additionalProperties:
            type: string
          type: object
        initialPriority:
          type: string
        initialStatus:
          type: string
        priorities:
          items:
            $ref: "#/components/schemas/WorkspaceValue"
          type: array
        properties:
          items:
            $ref: "#/components/schemas/WorkspaceProperty"
          type: array
        statuses:
          items:
            $ref: "#/components/schemas/WorkspaceValue"
          type: array
        systems:
          items:
            $ref: "#/components/schemas/WorkspaceValue"
          type: array
        templateDefaults:
          additionalProperties:
            type: string
          description: 種類 → 既定のテンプレート ID。なしの種類は入れない
          type: object
        templates:
          items:
            $ref: "#/components/schemas/WorkspaceTemplate"
          type: array
        workflow:
          additionalProperties:
            items:
              type: string
            nullable: true
            type: array
          description: From のステータス ID → 許可する To(ステータスの並び)。制限のない From は入れない
          type: object
      required:
        - properties
        - statuses
        - priorities
        - systems
        - initialStatus
        - initialPriority
        - categoryDefaults
        - workflow
        - templates
        - templateDefaults
      type: object
    WorkspaceSummary:
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        prefix:
          type: string
      required:
        - id
        - name
        - prefix
      type: object
    WorkspaceTemplate:
      additionalProperties: false
      properties:
        children:
          items:
            $ref: "#/components/schemas/WorkspaceTemplateChild"
          type: array
        description:
          type: string
        id:
          type: string
        kind:
          enum:
            - Epic
            - Story
            - Task
            - Bug
            - Step
          type: string
        name:
          type: string
        steps:
          items:
            $ref: "#/components/schemas/WorkspaceTemplateStep"
          type: array
        title:
          type: string
        values:
          additionalProperties: {}
          description: プロパティの ID → 値。null は指定しない
          type: object
      required:
        - id
        - name
        - kind
        - title
        - description
        - values
        - children
        - steps
      type: object
    WorkspaceTemplateChild:
      additionalProperties: false
      properties:
        description:
          type: string
        id:
          description: 新しく足すときは空
          type: string
        kind:
          enum:
            - Story
            - Task
            - Bug
          type: string
        steps:
          items:
            $ref: "#/components/schemas/WorkspaceTemplateStep"
          type: array
        title:
          type: string
        values:
          additionalProperties: {}
          description: プロパティの ID → 値。null は指定しない
          type: object
      required:
        - id
        - kind
        - title
        - description
        - values
        - steps
      type: object
    WorkspaceTemplateInput:
      additionalProperties: false
      properties:
        children:
          items:
            $ref: "#/components/schemas/WorkspaceTemplateChild"
          type: array
        description:
          type: string
        kind:
          enum:
            - Epic
            - Story
            - Task
            - Bug
            - Step
          type: string
        name:
          type: string
        steps:
          items:
            $ref: "#/components/schemas/WorkspaceTemplateStep"
          type: array
        title:
          type: string
        values:
          additionalProperties: {}
          description: プロパティの ID → 値。null は指定しない
          type: object
      required:
        - name
        - kind
        - title
        - description
        - values
        - children
        - steps
      type: object
    WorkspaceTemplateStep:
      additionalProperties: false
      properties:
        assignee:
          description: "@parent(親と同じ)・@none(未割り当て)・メンバーのログイン名"
          type: string
        id:
          description: 新しく足すときは空
          type: string
        title:
          type: string
      required:
        - id
        - title
        - assignee
      type: object
    WorkspaceUsage:
      additionalProperties: false
      properties:
        firstNumbers:
          description: 番号の小さい方から 3 つ
          items:
            format: int64
            type: integer
          type: array
        items:
          format: int64
          type: integer
        properties:
          additionalProperties:
            format: int64
            type: integer
          description: 追加プロパティの ID ごとの、値の入っているアイテムの数
          type: object
        values:
          additionalProperties:
            format: int64
            type: integer
          description: 値の ID ごとの、その値を持つアイテムの数
          type: object
      required:
        - items
        - firstNumbers
        - values
        - properties
      type: object
    WorkspaceValue:
      additionalProperties: false
      properties:
        category:
          description: ステータスの分類(todo・doing・done・canceled)
          enum:
            - todo
            - doing
            - done
            - canceled
          type: string
        color:
          enum:
            - gray
            - slate
            - brown
            - red
            - rose
            - pink
            - magenta
            - purple
            - indigo
            - blue
            - sky
            - cyan
            - teal
            - green
            - olive
            - amber
            - yellow
            - orange
          type: string
        id:
          type: string
        name:
          type: string
      required:
        - id
        - name
        - color
      type: object
