components:
  schemas:
    AccountBody:
      additionalProperties: false
      properties:
        id:
          type: string
        login:
          type: string
        method:
          enum:
            - device
            - gh
            - env
            - keychain
          type: string
        name:
          type: string
      required:
        - id
        - name
        - login
        - method
      type: object
    AccountRow:
      additionalProperties: false
      properties:
        id:
          type: string
        login:
          type: string
        method:
          enum:
            - device
            - gh
            - env
            - keychain
          type: string
        name:
          type: string
        reason:
          type: string
        status:
          enum:
            - ok
            - auth_error
          type: string
      required:
        - id
        - name
        - login
        - method
        - status
        - reason
      type: object
    AddStep:
      additionalProperties: false
      properties:
        title:
          type: string
      required:
        - title
      type: object
    AddWorkspaceProperty:
      additionalProperties: false
      properties:
        key:
          type: string
        kinds:
          description: 使う種類。空ならすべて
          items:
            type: string
          type: array
        name:
          description: 1 行。改行は入れられない
          pattern: ^[^\r\n]*$
          type: string
        type:
          enum:
            - text
            - number
            - date
            - single
            - multi
            - user
            - check
            - url
          type: string
      required:
        - name
        - key
        - type
        - kinds
      type: object
    AddWorkspaceValue:
      additionalProperties: false
      properties:
        name:
          description: 1 行。改行は入れられない
          pattern: ^[^\r\n]*$
          type: string
      required:
        - name
      type: object
    ApplyAutomationIgnoringWorkflow:
      additionalProperties: false
      properties:
        status:
          description: 変えるステータスの ID(通知の Status)
          type: string
      required:
        - status
      type: object
    AutomationRule:
      additionalProperties: false
      properties:
        action:
          enum:
            - status
            - assignee
          type: string
        allMerged:
          description: きっかけが pr_merged のときの条件
          type: boolean
        enabled:
          type: boolean
        id:
          type: string
        name:
          type: string
        trigger:
          enum:
            - pr_open
            - review_requested
            - pr_merged
            - issue_closed
            - status
            - steps_done
          type: string
        triggerStatus:
          description: きっかけが status のときのステータスの ID。ほかは空
          type: string
        value:
          description: ステータスの ID、ログイン名、または @none(未割り当て)
          type: string
      required:
        - id
        - enabled
        - name
        - trigger
        - triggerStatus
        - allMerged
        - action
        - value
      type: object
    AutomationRuleInput:
      additionalProperties: false
      properties:
        action:
          enum:
            - status
            - assignee
          type: string
        allMerged:
          description: きっかけが pr_merged のときの条件
          type: boolean
        name:
          type: string
        trigger:
          enum:
            - pr_open
            - review_requested
            - pr_merged
            - issue_closed
            - status
            - steps_done
          type: string
        triggerStatus:
          description: きっかけが status のときのステータスの ID。ほかは空
          type: string
        value:
          description: ステータスの ID、ログイン名、または @none(未割り当て)
          type: string
      required:
        - name
        - trigger
        - triggerStatus
        - allMerged
        - action
        - value
      type: object
    AutomationRun:
      additionalProperties: false
      properties:
        at:
          format: date-time
          type: string
        display:
          type: string
        item:
          type: string
        text:
          type: string
      required:
        - at
        - item
        - display
        - text
      type: object
    ChangeWorkspacePrefix:
      additionalProperties: false
      properties:
        prefix:
          type: string
      required:
        - prefix
      type: object
    CheckStep:
      additionalProperties: false
      properties:
        done:
          type: boolean
      required:
        - done
      type: object
    Comment:
      additionalProperties: false
      properties:
        at:
          description: 投稿した時刻(RFC 3339)
          type: string
        body:
          type: string
        by:
          description: 投稿者のログイン名
          type: string
        byName:
          description: 投稿者の表示名。メンバーにいなければ「不明なユーザー」
          type: string
        edited:
          type: boolean
        id:
          type: string
      required:
        - id
        - by
        - byName
        - at
        - body
        - edited
      type: object
    CommentText:
      additionalProperties: false
      properties:
        body:
          type: string
      required:
        - body
      type: object
    CreateItem:
      additionalProperties: false
      properties:
        description:
          description: もとになるアイテムの説明(Markdown)。空は説明なし。子の説明はテンプレートのものを使う
          type: string
        kind:
          enum:
            - Epic
            - Story
            - Task
            - Bug
            - Step
          type: string
        parent:
          description: 空は親を選んでいない
          type: string
        project:
          description: 空はプロジェクトを選んでいない
          type: string
        template:
          description: 一緒に作るテンプレートの内部 ID。空は「なし」
          type: string
        title:
          type: string
        values:
          additionalProperties: {}
          description: プロパティの値(キーはプロパティの内部 ID。組み込みはキー)
          type: object
      required:
        - project
        - kind
        - title
      type: object
    CreateProject:
      additionalProperties: false
      properties:
        end:
          pattern: ^(\d{4}-\d{2}-\d{2})?$
          type: string
        owner:
          type: string
        start:
          pattern: ^(\d{4}-\d{2}-\d{2})?$
          type: string
        status:
          enum:
            - Todo
            - InProgress
            - Done
            - Pending
            - Cancel
            - ""
          type: string
        title:
          description: 1 行。改行は入れられない
          pattern: ^[^\r\n]*$
          type: string
      required:
        - title
      type: object
    CreateWorkspace:
      additionalProperties: false
      properties:
        name:
          description: 1 行。改行は入れられない
          pattern: ^[^\r\n]*$
          type: string
        prefix:
          type: string
      required:
        - name
        - prefix
      type: object
    DescribeBody:
      additionalProperties: false
      properties:
        base:
          description: 編集を始めたときの説明。保存するときの共通の祖先になる
          type: string
        text:
          description: 入力した説明。空白だけは空として保存する(説明を消す)
          type: string
      required:
        - base
        - text
      type: object
    DescribeResult:
      additionalProperties: false
      properties:
        conflict:
          description: 同じ箇所が同時に編集されて、両方の版を残したとき true
          type: boolean
        text:
          description: 保存したあとの説明
          type: string
      required:
        - text
        - conflict
      type: object
    DescriptionText:
      additionalProperties: false
      properties:
        text:
          description: 説明の本文(Markdown)。説明がなければ空
          type: string
      required:
        - text
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          example: Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          nullable: true
          type: array
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          example: https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          example: 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          example: Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          example: https://example.com/errors/example
          format: uri
          type: string
      type: object
    HistoryRow:
      additionalProperties: false
      properties:
        at:
          description: 時刻(ミリ秒までの RFC 3339)
          type: string
        text:
          description: 変更の文(作成・タイトルを「…」に変更 など)
          type: string
        who:
          description: 操作した人の表示(メンバーの名前・自動化・GitHub・同期・不明なユーザー)
          type: string
      required:
        - who
        - text
        - at
      type: object
    ImpactOutputBody:
      additionalProperties: false
      properties:
        lines:
          items:
            type: string
          nullable: true
          type: array
      required:
        - lines
      type: object
    Item:
      additionalProperties: false
      properties:
        assignee:
          description: ログイン名。空は未割り当て
          type: string
        blocked:
          description: ブロック中か。ブロックしている相手に、完了・中止でないものがある
          type: boolean
        choices:
          additionalProperties:
            items:
              type: string
            nullable: true
            type: array
          description: 選択式の追加プロパティの値(プロパティの内部 ID → 値の内部 ID)
          type: object
        createdAt:
          type: string
        createdBy:
          type: string
        end:
          type: string
        estimate:
          description: 時間
          format: double
          nullable: true
          type: number
        fields:
          additionalProperties: {}
          description: 追加プロパティの値(プロパティの内部 ID → 値)。型は設定で読む
          type: object
        id:
          type: string
        kind:
          enum:
            - Epic
            - Story
            - Task
            - Bug
            - Step
          type: string
        number:
          format: int64
          type: integer
        parent:
          description: 親の内部 ID。Epic は null
          nullable: true
          type: string
        points:
          format: double
          nullable: true
          type: number
        priority:
          type: string
        project:
          type: string
        rank:
          type: string
        start:
          description: YYYY-MM-DD。空は値なし
          type: string
        status:
          description: ステータスの内部 ID。空は値なし
          type: string
        systems:
          items:
            type: string
          type: array
        title:
          type: string
        watchers:
          items:
            type: string
          nullable: true
          type: array
        workspace:
          type: string
      required:
        - id
        - workspace
        - project
        - parent
        - number
        - kind
        - rank
        - title
        - watchers
        - blocked
        - createdAt
        - createdBy
        - status
        - priority
        - assignee
        - start
        - end
        - points
        - estimate
        - systems
        - choices
        - fields
      type: object
    ListOutputBody:
      additionalProperties: false
      properties:
        accounts:
          items:
            $ref: "#/components/schemas/AccountRow"
          nullable: true
          type: array
      required:
        - accounts
      type: object
    Me:
      additionalProperties: false
      properties:
        login:
          type: string
      required:
        - login
      type: object
    Member:
      additionalProperties: false
      properties:
        login:
          type: string
        name:
          type: string
      required:
        - login
        - name
      type: object
    MoveWorkspaceItem:
      additionalProperties: false
      properties:
        direction:
          enum:
            - up
            - down
          type: string
      required:
        - direction
      type: object
    NextNumber:
      additionalProperties: false
      properties:
        number:
          format: int64
          type: integer
      required:
        - number
      type: object
    Project:
      additionalProperties: false
      properties:
        end:
          type: string
        id:
          type: string
        number:
          format: int64
          type: integer
        owner:
          description: ログイン名。空は「なし」
          type: string
        rank:
          type: string
        repos:
          description: 結びつけた GitHub のリポジトリ(owner/name)。大文字小文字を区別しない辞書順
          items:
            type: string
          nullable: true
          type: array
        start:
          description: YYYY-MM-DD。空は「なし」
          type: string
        status:
          enum:
            - Todo
            - InProgress
            - Done
            - Pending
            - Cancel
          type: string
        title:
          type: string
        workspace:
          type: string
      required:
        - id
        - workspace
        - number
        - rank
        - title
        - owner
        - status
        - start
        - end
        - repos
      type: object
    ProjectRepo:
      additionalProperties: false
      properties:
        repo:
          description: owner/name。前後の空白は除く
          type: string
      required:
        - repo
      type: object
    RelationCandidate:
      additionalProperties: false
      properties:
        disabledReason:
          description: 選べない理由。選べるなら空
          type: string
        display:
          type: string
        id:
          description: 相手の内部 ID
          type: string
        title:
          type: string
        workspaceName:
          description: 別のワークスペースの候補だけ。同じなら空
          type: string
      required:
        - id
        - display
        - title
        - workspaceName
        - disabledReason
      type: object
    RelationInput:
      additionalProperties: false
      properties:
        label:
          type: string
        other:
          description: 相手の内部 ID
          type: string
      required:
        - label
        - other
      type: object
    RelationRow:
      additionalProperties: false
      properties:
        display:
          description: 相手の画面の ID(HH-3)
          type: string
        id:
          description: 相手の内部 ID
          type: string
        label:
          description: 表記(blocks・blocked by・causes・caused by・duplicates・duplicated by・relates to・clones・cloned by)
          type: string
        statusColor:
          description: ステータスの色の名前。値がなければ空
          type: string
        statusName:
          description: 相手のステータスの名前。値がなければ空
          type: string
        title:
          type: string
        workspaceName:
          description: 相手が別のワークスペースのときだけ。同じなら空
          type: string
      required:
        - label
        - id
        - display
        - title
        - workspaceName
        - statusName
        - statusColor
      type: object
    RenameItem:
      additionalProperties: false
      properties:
        title:
          type: string
      required:
        - title
      type: object
    RenameProject:
      additionalProperties: false
      properties:
        title:
          description: 1 行。改行は入れられない
          pattern: ^[^\r\n]*$
          type: string
      required:
        - title
      type: object
    RenameWorkspace:
      additionalProperties: false
      properties:
        name:
          description: 1 行。改行は入れられない
          pattern: ^[^\r\n]*$
          type: string
      required:
        - name
      type: object
    RenameWorkspaceProperty:
      additionalProperties: false
      properties:
        name:
          description: 1 行。改行は入れられない
          pattern: ^[^\r\n]*$
          type: string
      required:
        - name
      type: object
    RenameWorkspaceValue:
      additionalProperties: false
      properties:
        name:
          description: 1 行。改行は入れられない
          pattern: ^[^\r\n]*$
          type: string
      required:
        - name
      type: object
    SaveItemAsTemplate:
      additionalProperties: false
      properties:
        name:
          type: string
        structure:
          description: 子と Step を含める
          type: boolean
        title:
          type: string
      required:
        - name
        - title
        - structure
      type: object
    SetAutomationRuleEnabled:
      additionalProperties: false
      properties:
        enabled:
          type: boolean
      required:
        - enabled
      type: object
    SetItemProperty:
      additionalProperties: false
      properties:
        value:
          description: 新しい値。null と空の文字列は値を空にする
      required:
        - value
      type: object
    SetProjectDate:
      additionalProperties: false
      properties:
        field:
          enum:
            - start
            - end
          type: string
        value:
          description: YYYY-MM-DD。空は「なし」
          pattern: ^(\d{4}-\d{2}-\d{2})?$
          type: string
      required:
        - field
        - value
      type: object
    SetProjectOwner:
      additionalProperties: false
      properties:
        owner:
          description: ログイン名。空は「なし」。メンバーでなければ 404
          type: string
      required:
        - owner
      type: object
    SetProjectStatus:
      additionalProperties: false
      properties:
        status:
          enum:
            - Todo
            - InProgress
            - Done
            - Pending
            - Cancel
          type: string
      required:
        - status
      type: object
    SetWatch:
      additionalProperties: false
      properties:
        "on":
          description: あなたがウォッチ中にするか
          type: boolean
      required:
        - "on"
      type: object
    SetWorkspacePropertyHidden:
      additionalProperties: false
      properties:
        hidden:
          type: boolean
      required:
        - hidden
      type: object
    SetWorkspacePropertyKinds:
      additionalProperties: false
      properties:
        kinds:
          items:
            type: string
          type: array
      required:
        - kinds
      type: object
    SetWorkspaceStatusCategory:
      additionalProperties: false
      properties:
        category:
          enum:
            - todo
            - doing
            - done
            - canceled
          type: string
      required:
        - category
      type: object
    SetWorkspaceTemplateDefault:
      additionalProperties: false
      properties:
        template:
          description: テンプレートの ID。空なら「なし」
          type: string
      required:
        - template
      type: object
    SetWorkspaceTransition:
      additionalProperties: false
      properties:
        allowed:
          type: boolean
      required:
        - allowed
      type: object
    SetWorkspaceValueColor:
      additionalProperties: false
      properties:
        color:
          enum:
            - gray
            - slate
            - brown
            - red
            - rose
            - pink
            - magenta
            - purple
            - indigo
            - blue
            - sky
            - cyan
            - teal
            - green
            - olive
            - amber
            - yellow
            - orange
          type: string
      required:
        - color
      type: object
    SetWorkspaceValueRef:
      additionalProperties: false
      properties:
        value:
          type: string
      required:
        - value
      type: object
    SignInCode:
      additionalProperties: false
      properties:
        expires_in:
          description: 秒
          format: int64
          type: integer
        id:
          type: string
        interval:
          description: 秒
          format: int64
          type: integer
        user_code:
          type: string
        verification_uri:
          type: string
      required:
        - id
        - user_code
        - verification_uri
        - expires_in
        - interval
      type: object
    SignInInputBody:
      additionalProperties: false
      properties:
        account:
          description: 編集・再認証するアカウントの ID。登録では空
          type: string
        login:
          type: string
        name:
          type: string
      required:
        - name
        - login
      type: object
    SignInResult:
      additionalProperties: false
      properties:
        account:
          $ref: "#/components/schemas/AccountBody"
        interval:
          description: 次に問い合わせるまでの秒
          format: int64
          type: integer
        message:
          type: string
        state:
          enum:
            - waiting
            - expired
            - denied
            - mismatch
            - failed
            - done
          type: string
      required:
        - state
        - message
        - interval
      type: object
    StoreInfo:
      additionalProperties: false
      properties:
        color:
          description: 画面のトークン --t-<色> の名前
          type: string
        id:
          type: string
        name:
          type: string
        readOnly:
          type: boolean
      required:
        - id
        - name
        - color
        - readOnly
      type: object
    SyncAllResult:
      additionalProperties: false
      properties:
        lines:
          items:
            type: string
          type: array
        result:
          enum:
            - synced
            - failed
            - nothing
          type: string
      required:
        - result
        - lines
      type: object
    SyncHold:
      additionalProperties: false
      properties:
        hold:
          type: boolean
        tab:
          maxLength: 64
          minLength: 1
          type: string
      required:
        - tab
        - hold
      type: object
    SyncNetwork:
      additionalProperties: false
      properties:
        online:
          type: boolean
        tab:
          maxLength: 64
          minLength: 1
          type: string
      required:
        - tab
        - online
      type: object
    SyncStatusList:
      additionalProperties: false
      properties:
        auto:
          description: 「裏で自動的に同期する」がオンか(オフラインの帯の文を選ぶ)
          type: boolean
        stores:
          items:
            $ref: "#/components/schemas/SyncStoreStatus"
          type: array
      required:
        - auto
        - stores
      type: object
    SyncStoreResult:
      additionalProperties: false
      properties:
        message:
          type: string
        mirrorWarning:
          description: ミラーに送れなかったときの警告のトースト。なければ空
          type: string
        result:
          description: synced はトースト、skipped は案内、failed はエラーのトースト
          enum:
            - synced
            - skipped
            - failed
          type: string
      required:
        - result
        - message
        - mirrorWarning
      type: object
    SyncStoreStatus:
      additionalProperties: false
      properties:
        error:
          description: 同期エラーなら短い理由(06 の表の文言)。なければ空
          type: string
        hidden:
          type: boolean
        lastSuccess:
          description: 最後に成功した同期の時刻(RFC 3339、UTC)。なければ空
          type: string
        name:
          type: string
        readOnly:
          type: boolean
        store:
          type: string
        unsent:
          description: 未送信の保存の数
          format: int64
          type: integer
      required:
        - store
        - name
        - hidden
        - readOnly
        - error
        - unsent
        - lastSuccess
      type: object
    SystemInfo:
      additionalProperties: false
      properties:
        version:
          description: hedgehug の版
          type: string
      required:
        - version
      type: object
    ValuesBody:
      additionalProperties: false
      properties:
        login:
          type: string
        method:
          description: デバイスフローはサインインの API で登録・保存する
          enum:
            - gh
            - env
            - keychain
          type: string
        name:
          type: string
      required:
        - name
        - login
        - method
      type: object
    Worklog:
      additionalProperties: false
      properties:
        by:
          description: 記録した人のログイン名
          type: string
        byName:
          description: 記録した人の表示名。メンバーにいなければ「不明なユーザー」
          type: string
        date:
          description: 記録した日(YYYY-MM-DD)
          type: string
        hours:
          description: 1.25 のような表記
          type: string
        id:
          type: string
        memo:
          type: string
      required:
        - id
        - by
        - byName
        - date
        - hours
        - memo
      type: object
    WorklogInput:
      additionalProperties: false
      properties:
        hours:
          description: 時間。小数第 2 位まで
          type: string
        memo:
          type: string
      required:
        - hours
      type: object
    WorkspaceAutomation:
      additionalProperties: false
      properties:
        recent:
          items:
            $ref: "#/components/schemas/AutomationRun"
          nullable: true
          type: array
        rules:
          items:
            $ref: "#/components/schemas/AutomationRule"
          nullable: true
          type: array
      required:
        - rules
        - recent
      type: object
    WorkspaceDetail:
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        oldPrefixes:
          items:
            type: string
          type: array
        prefix:
          type: string
        settings:
          $ref: "#/components/schemas/WorkspaceSettings"
      required:
        - oldPrefixes
        - settings
        - id
        - name
        - prefix
      type: object
    WorkspaceProperty:
      additionalProperties: false
      properties:
        builtin:
          type: boolean
        choices:
          description: 選択肢(単一選択・複数選択だけ。ほかは空)
          items:
            $ref: "#/components/schemas/WorkspaceValue"
          type: array
        hidden:
          type: boolean
        id:
          type: string
        key:
          type: string
        kinds:
          items:
            type: string
          type: array
        name:
          type: string
        type:
          type: string
      required:
        - id
        - key
        - name
        - type
        - builtin
        - kinds
        - hidden
        - choices
      type: object
    WorkspaceSettings:
      additionalProperties: false
      properties:
        categoryDefaults:
          additionalProperties:
            type: string
          type: object
        initialPriority:
          type: string
        initialStatus:
          type: string
        priorities:
          items:
            $ref: "#/components/schemas/WorkspaceValue"
          type: array
        properties:
          items:
            $ref: "#/components/schemas/WorkspaceProperty"
          type: array
        statuses:
          items:
            $ref: "#/components/schemas/WorkspaceValue"
          type: array
        systems:
          items:
            $ref: "#/components/schemas/WorkspaceValue"
          type: array
        templateDefaults:
          additionalProperties:
            type: string
          description: 種類 → 既定のテンプレート ID。なしの種類は入れない
          type: object
        templates:
          items:
            $ref: "#/components/schemas/WorkspaceTemplate"
          type: array
        workflow:
          additionalProperties:
            items:
              type: string
            nullable: true
            type: array
          description: From のステータス ID → 許可する To(ステータスの並び)。制限のない From は入れない
          type: object
      required:
        - properties
        - statuses
        - priorities
        - systems
        - initialStatus
        - initialPriority
        - categoryDefaults
        - workflow
        - templates
        - templateDefaults
      type: object
    WorkspaceSummary:
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        prefix:
          type: string
      required:
        - id
        - name
        - prefix
      type: object
    WorkspaceTemplate:
      additionalProperties: false
      properties:
        children:
          items:
            $ref: "#/components/schemas/WorkspaceTemplateChild"
          type: array
        description:
          type: string
        id:
          type: string
        kind:
          enum:
            - Epic
            - Story
            - Task
            - Bug
            - Step
          type: string
        name:
          type: string
        steps:
          items:
            $ref: "#/components/schemas/WorkspaceTemplateStep"
          type: array
        title:
          type: string
        values:
          additionalProperties: {}
          description: プロパティの ID → 値。null は指定しない
          type: object
      required:
        - id
        - name
        - kind
        - title
        - description
        - values
        - children
        - steps
      type: object
    WorkspaceTemplateChild:
      additionalProperties: false
      properties:
        description:
          type: string
        id:
          description: 新しく足すときは空
          type: string
        kind:
          enum:
            - Story
            - Task
            - Bug
          type: string
        steps:
          items:
            $ref: "#/components/schemas/WorkspaceTemplateStep"
          type: array
        title:
          type: string
        values:
          additionalProperties: {}
          description: プロパティの ID → 値。null は指定しない
          type: object
      required:
        - id
        - kind
        - title
        - description
        - values
        - steps
      type: object
    WorkspaceTemplateInput:
      additionalProperties: false
      properties:
        children:
          items:
            $ref: "#/components/schemas/WorkspaceTemplateChild"
          type: array
        description:
          type: string
        kind:
          enum:
            - Epic
            - Story
            - Task
            - Bug
            - Step
          type: string
        name:
          type: string
        steps:
          items:
            $ref: "#/components/schemas/WorkspaceTemplateStep"
          type: array
        title:
          type: string
        values:
          additionalProperties: {}
          description: プロパティの ID → 値。null は指定しない
          type: object
      required:
        - name
        - kind
        - title
        - description
        - values
        - children
        - steps
      type: object
    WorkspaceTemplateStep:
      additionalProperties: false
      properties:
        assignee:
          description: "@parent(親と同じ)・@none(未割り当て)・メンバーのログイン名"
          type: string
        id:
          description: 新しく足すときは空
          type: string
        title:
          type: string
      required:
        - id
        - title
        - assignee
      type: object
    WorkspaceUsage:
      additionalProperties: false
      properties:
        firstNumbers:
          description: 番号の小さい方から 3 つ
          items:
            format: int64
            type: integer
          type: array
        items:
          format: int64
          type: integer
        properties:
          additionalProperties:
            format: int64
            type: integer
          description: 追加プロパティの ID ごとの、値の入っているアイテムの数
          type: object
        values:
          additionalProperties:
            format: int64
            type: integer
          description: 値の ID ごとの、その値を持つアイテムの数
          type: object
      required:
        - items
        - firstNumbers
        - values
        - properties
      type: object
    WorkspaceValue:
      additionalProperties: false
      properties:
        category:
          description: ステータスの分類(todo・doing・done・canceled)
          enum:
            - todo
            - doing
            - done
            - canceled
          type: string
        color:
          enum:
            - gray
            - slate
            - brown
            - red
            - rose
            - pink
            - magenta
            - purple
            - indigo
            - blue
            - sky
            - cyan
            - teal
            - green
            - olive
            - amber
            - yellow
            - orange
          type: string
        id:
          type: string
        name:
          type: string
      required:
        - id
        - name
        - color
      type: object
info:
  title: hedgehug
  version: dev
openapi: 3.0.3
paths:
  /api/accounts:
    get:
      operationId: list-accounts
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: 登録したアカウントを、状態を付けて返す
    post:
      operationId: add-account
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValuesBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountBody"
          description: Created
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: GitHub で確かめてからアカウントを登録する
  /api/accounts/{id}:
    delete:
      operationId: delete-account
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: アカウントを削除し、割り当てた Store を「なし」にする
    put:
      operationId: edit-account
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValuesBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountBody"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: 新しい値を GitHub で確かめてから、アカウントの値を入れ替える
  /api/accounts/{id}/delete-impact:
    get:
      operationId: account-delete-impact
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImpactOutputBody"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: 「アカウントを削除」の確認の本文の行
  /api/accounts/{id}/edit-impact:
    get:
      operationId: account-edit-impact
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - explode: false
          in: query
          name: login
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImpactOutputBody"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: ログイン名を変えるときの「アカウントを変更」の確認の本文の行(空なら確認を出さない)
  /api/accounts/{id}/reauth:
    post:
      operationId: reauth-account
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountBody"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: gh CLI・環境変数・OS のキーチェーンのアカウントの認証の確認をやり直す
  /api/events:
    get:
      description: "出来事ごとに `event: store` または `event: sync` の行と、`data: {\"store\":\"<Store ID>\"}` の行を、空行で区切って送る。"
      operationId: watch-events
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                type: string
          description: Server-Sent Events の流れ
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Store の変化と同期の状態の変化を、Server-Sent Events で送り続ける
  /api/sign-ins:
    post:
      operationId: start-sign-in
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInCode"
          description: Created
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: デバイスフローのサインインを始め、GitHub で入力するコードを返す
  /api/sign-ins/{id}:
    delete:
      operationId: cancel-sign-in
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: サインインをやめる(何も登録しない)
    get:
      operationId: poll-sign-in
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInResult"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: サインインが許可されたかを GitHub に 1 回聞く
  /api/stores:
    get:
      operationId: list-stores
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/StoreInfo"
                nullable: true
                type: array
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: 表示中の Store をサイドバーの並びで返す
  /api/stores/{store}/items:
    post:
      operationId: create-item
      parameters:
        - in: path
          name: store
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateItem"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: アイテムを作成
  /api/stores/{store}/items/{item}:
    get:
      operationId: get-item
      parameters:
        - in: path
          name: store
          required: true
          schema:
            type: string
        - in: path
          name: item
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: アイテムを返す
  /api/stores/{store}/items/{item}/automation/{rule}/apply:
    post:
      operationId: apply-automation-ignoring-workflow
      parameters:
        - in: path
          name: store
          required: true
          schema:
            type: string
        - in: path
          name: item
          required: true
          schema:
            type: string
        - in: path
          name: rule
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyAutomationIgnoringWorkflow"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: 止まった自動化の変更を、制約を無視して適用
  /api/stores/{store}/items/{item}/check:
    post:
      operationId: check-step
      parameters:
        - in: path
          name: store
          required: true
          schema:
            type: string
        - in: path
          name: item
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckStep"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Step のチェックを入り切りする
  /api/stores/{store}/items/{item}/comments:
    get:
      operationId: list-item-comments
      parameters:
        - in: path
          name: store
          required: true
          schema:
            type: string
        - in: path
          name: item
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Comment"
                nullable: true
                type: array
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: アイテムのコメントを古い順に返す
    post:
      operationId: post-item-comment
      parameters:
        - in: path
          name: store
          required: true
          schema:
            type: string
        - in: path
          name: item
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentText"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: アイテムにコメントを投稿する
  /api/stores/{store}/items/{item}/comments/{comment}:
    delete:
      operationId: delete-item-comment
      parameters:
        - in: path
          name: store
          required: true
          schema:
            type: string
        - in: path
          name: item
          required: true
          schema:
            type: string
        - in: path
          name: comment
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: アイテムのコメントを削除する
    put:
      operationId: edit-item-comment
      parameters:
        - in: path
          name: store
          required: true
          schema:
            type: string
        - in: path
          name: item
          required: true
          schema:
            type: string
        - in: path
          name: comment
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentText"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: アイテムのコメントを編集する
  /api/stores/{store}/items/{item}/description:
    get:
      operationId: get-item-description
      parameters:
        - in: path
          name: store
          required: true
          schema:
            type: string
        - in: path
          name: item
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DescriptionText"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: アイテムの説明を返す
    put:
      operationId: describe-item
      parameters:
        - in: path
          name: store
          required: true
          schema:
            type: string
        - in: path
          name: item
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DescribeBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DescribeResult"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: アイテムの説明を保存する
  /api/stores/{store}/items/{item}/history:
    get:
      operationId: get-item-history
      parameters:
        - in: path
          name: store
          required: true
          schema:
            type: string
        - in: path
          name: item
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
