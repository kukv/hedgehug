components:
  schemas:
    ChangeWorkspacePrefix:
      additionalProperties: false
      properties:
        prefix:
          type: string
      required:
        - prefix
      type: object
    CreateItem:
      additionalProperties: false
      properties:
        kind:
          enum:
            - Epic
            - Story
            - Task
            - Bug
            - Step
          type: string
        parent:
          description: 空は親を選んでいない
          type: string
        project:
          description: 空はプロジェクトを選んでいない
          type: string
        title:
          type: string
      required:
        - project
        - kind
        - title
      type: object
    CreateProject:
      additionalProperties: false
      properties:
        end:
          pattern: ^(\d{4}-\d{2}-\d{2})?$
          type: string
        owner:
          type: string
        start:
          pattern: ^(\d{4}-\d{2}-\d{2})?$
          type: string
        status:
          enum:
            - Todo
            - InProgress
            - Done
            - Pending
            - Cancel
            - ""
          type: string
        title:
          description: 1 行。改行は入れられない
          pattern: ^[^\r\n]*$
          type: string
      required:
        - title
      type: object
    CreateWorkspace:
      additionalProperties: false
      properties:
        name:
          type: string
        prefix:
          type: string
      required:
        - name
        - prefix
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          example: Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          nullable: true
          type: array
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          example: https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          example: 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          example: Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          example: https://example.com/errors/example
          format: uri
          type: string
      type: object
    Item:
      additionalProperties: false
      properties:
        createdAt:
          type: string
        createdBy:
          type: string
        id:
          type: string
        kind:
          enum:
            - Epic
            - Story
            - Task
            - Bug
            - Step
          type: string
        number:
          format: int64
          type: integer
        parent:
          description: 親の内部 ID。Epic は null
          nullable: true
          type: string
        project:
          type: string
        rank:
          type: string
        title:
          type: string
        watchers:
          items:
            type: string
          nullable: true
          type: array
        workspace:
          type: string
      required:
        - id
        - workspace
        - project
        - parent
        - number
        - kind
        - rank
        - title
        - watchers
        - createdAt
        - createdBy
      type: object
    Project:
      additionalProperties: false
      properties:
        end:
          type: string
        id:
          type: string
        number:
          format: int64
          type: integer
        owner:
          description: ログイン名。空は「なし」
          type: string
        rank:
          type: string
        start:
          description: YYYY-MM-DD。空は「なし」
          type: string
        status:
          enum:
            - Todo
            - InProgress
            - Done
            - Pending
            - Cancel
          type: string
        title:
          type: string
        workspace:
          type: string
      required:
        - id
        - workspace
        - number
        - rank
        - title
        - owner
        - status
        - start
        - end
      type: object
    RenameWorkspace:
      additionalProperties: false
      properties:
        name:
          type: string
      required:
        - name
      type: object
    SystemInfo:
      additionalProperties: false
      properties:
        version:
          description: hedgehug の版
          type: string
      required:
        - version
      type: object
    WorkspaceDetail:
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        oldPrefixes:
          items:
            type: string
          type: array
        prefix:
          type: string
        settings:
          $ref: "#/components/schemas/WorkspaceSettings"
      required:
        - oldPrefixes
        - settings
        - id
        - name
        - prefix
      type: object
    WorkspaceProperty:
      additionalProperties: false
      properties:
        builtin:
          type: boolean
        hidden:
          type: boolean
        id:
          type: string
        key:
          type: string
        kinds:
          items:
            type: string
          type: array
        name:
          type: string
        type:
          type: string
      required:
        - id
        - key
        - name
        - type
        - builtin
        - kinds
        - hidden
      type: object
    WorkspaceSettings:
      additionalProperties: false
      properties:
        categoryDefaults:
          additionalProperties:
            type: string
          type: object
        initialPriority:
          type: string
        initialStatus:
          type: string
        priorities:
          items:
            $ref: "#/components/schemas/WorkspaceValue"
          type: array
        properties:
          items:
            $ref: "#/components/schemas/WorkspaceProperty"
          type: array
        statuses:
          items:
            $ref: "#/components/schemas/WorkspaceValue"
          type: array
        systems:
          items:
            $ref: "#/components/schemas/WorkspaceValue"
          type: array
      required:
        - properties
        - statuses
        - priorities
        - systems
        - initialStatus
        - initialPriority
        - categoryDefaults
      type: object
    WorkspaceSummary:
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        prefix:
          type: string
      required:
        - id
        - name
        - prefix
      type: object
    WorkspaceValue:
      additionalProperties: false
      properties:
        category:
          description: ステータスの分類(todo・doing・done・canceled)
          type: string
        color:
          type: string
        id:
          type: string
        name:
          type: string
      required:
        - id
        - name
        - color
      type: object
info:
  title: hedgehug
  version: dev
openapi: 3.0.3
paths:
  /api/stores/{store}/items:
    post:
      operationId: create-item
      parameters:
        - in: path
          name: store
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateItem"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: アイテムを作成
  /api/stores/{store}/items/{item}:
    get:
      operationId: get-item
      parameters:
        - in: path
          name: store
          required: true
          schema:
            type: string
        - in: path
          name: item
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: アイテムを返す
  /api/stores/{store}/projects/{project}:
    get:
      operationId: get-project
      parameters:
        - in: path
          name: store
          required: true
          schema:
            type: string
        - in: path
          name: project
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: プロジェクトを返す
  /api/stores/{store}/projects/{project}/items:
    get:
      operationId: list-project-items
      parameters:
        - in: path
          name: store
          required: true
          schema:
            type: string
        - in: path
          name: project
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Item"
                nullable: true
                type: array
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: プロジェクトのすべてのアイテムを番号の順で返す
  /api/stores/{store}/workspaces:
    get:
      operationId: list-workspaces
      parameters:
        - in: path
          name: store
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/WorkspaceSummary"
                nullable: true
                type: array
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Store のワークスペースの一覧
    post:
      operationId: create-workspace
      parameters:
        - in: path
          name: store
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkspace"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceSummary"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: ワークスペースを作成
  /api/stores/{store}/workspaces/{workspace}:
    get:
      operationId: get-workspace
      parameters:
        - in: path
          name: store
          required: true
          schema:
            type: string
        - in: path
          name: workspace
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceDetail"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: ワークスペースと設定
  /api/stores/{store}/workspaces/{workspace}/name:
    put:
      operationId: rename-workspace
      parameters:
        - in: path
          name: store
          required: true
          schema:
            type: string
        - in: path
          name: workspace
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameWorkspace"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: ワークスペースの名前を変更
  /api/stores/{store}/workspaces/{workspace}/prefix:
    put:
      operationId: change-workspace-prefix
      parameters:
        - in: path
          name: store
          required: true
          schema:
            type: string
        - in: path
          name: workspace
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeWorkspacePrefix"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: 接頭辞を変更
  /api/stores/{store}/workspaces/{workspace}/projects:
    get:
      operationId: list-projects
      parameters:
        - in: path
          name: store
          required: true
          schema:
            type: string
        - in: path
          name: workspace
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Project"
                nullable: true
                type: array
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: ワークスペースのプロジェクトを並び順で返す
    post:
      operationId: create-project
      parameters:
        - in: path
          name: store
          required: true
          schema:
            type: string
        - in: path
          name: workspace
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProject"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: プロジェクトを作成
  /api/system:
    get:
      operationId: get-system
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemInfo"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: サーバーの版を返す
