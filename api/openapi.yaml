components:
  schemas:
    AccountAddInputBody:
      additionalProperties: false
      properties:
        host:
          description: github.com without it
          type: string
        login:
          description: The GitHub login of the account
          type: string
        name:
          description: The name of the account in config.yaml
          type: string
        token:
          description: "Where the token comes from: gh or env:<VAR>; with none the account has no token. keychain and device are answered with 400 auth.token_source: a pasted token goes through PUT /api/accounts/{name}/token, and the device flow through POST /api/auth/device"
          type: string
      required:
        - name
        - login
      type: object
    AccountSourceInputBody:
      additionalProperties: false
      properties:
        token:
          description: "Where the token comes from now: gh or env:<VAR>"
          type: string
      required:
        - token
      type: object
    AccountTokenInputBody:
      additionalProperties: false
      properties:
        host:
          description: The host of a new account (github.com without it); for an account that exists it must be its host
          type: string
        token:
          description: The token to keep in the keychain, as hh auth login --with-token reads it. It is in no response, no event and no line of the log
          type: string
      required:
        - token
      type: object
    AffectedWrite:
      additionalProperties: false
      properties:
        commit:
          type:
            - string
            - "null"
        tasks:
          description: The task and the tasks under it, as they are now
          items:
            $ref: "#/components/schemas/TaskView"
          type:
            - array
            - "null"
      required:
        - commit
      type: object
    AuthAddResult:
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        token:
          type: string
      required:
        - name
        - id
      type: object
    AuthDeviceEvent:
      additionalProperties: false
      properties:
        account:
          description: "For done: the name of the account that got the token"
          type: string
        code:
          description: "For error: the Code of the error, such as auth.canceled"
          type: string
        id:
          description: The id POST /api/auth/device answered
          type: string
        message:
          description: "For error: the message in English"
          type: string
        state:
          enum:
            - done
            - error
          type: string
      required:
        - id
        - state
      type: object
    AuthLoginResult:
      additionalProperties: false
      properties:
        account:
          type: string
        added:
          description: "The account was added to config.yaml: the name was no account's"
          type: boolean
        id:
          type: string
        uses:
          description: "gh or env:VAR: the account takes its token from there, so Hedgehug has nothing to log in and kept nothing"
          type: string
      required:
        - account
        - id
        - added
      type: object
    AuthLogoutResult:
      additionalProperties: false
      properties:
        account:
          type: string
        id:
          type: string
        removed:
          type: boolean
        token:
          type: string
      required:
        - account
        - id
        - removed
      type: object
    AuthSourceResult:
      additionalProperties: false
      properties:
        name:
          type: string
        token:
          description: Where the token comes from now
          type: string
      required:
        - name
        - token
      type: object
    AuthStatus:
      additionalProperties: false
      properties:
        error:
          type: string
        expires:
          format: date-time
          type: string
        id:
          type: string
        login:
          type: string
        name:
          type: string
        state:
          type: string
        token:
          type: string
      required:
        - name
        - id
        - state
      type: object
    AutomationAddInputBody:
      additionalProperties: false
      properties:
        category:
          description: The category whose default to set; not with status
          type: string
        id:
          minLength: 1
          type: string
        "on":
          description: The event, such as pr.merged
          minLength: 1
          type: string
        project:
          description: The project the rule is of; without it, the store's
          type: string
        status:
          description: The status to set; not with category
          type: string
        when:
          description: The condition, such as all_linked_prs_merged
          type: string
      required:
        - id
        - "on"
      type: object
    AutomationEnabledInputBody:
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        project:
          description: Turn it on or off in this project only (scoped disable)
          type: string
      required:
        - enabled
      type: object
    AutomationFieldsInputBody:
      additionalProperties: false
      properties:
        default_sync:
          description: The mode of a new issue link
          type: string
        mirror:
          description: Replaces the fields mirror mode syncs
          items:
            type: string
          type: array
        props:
          additionalProperties:
            type: string
          description: Field to property; an empty value takes it off
          type: object
        push:
          description: Replaces the fields push mode syncs
          items:
            type: string
          type: array
      type: object
    AutomationsChanged:
      additionalProperties: false
      properties:
        store:
          type: string
      required:
        - store
      type: object
    Candidate:
      additionalProperties: false
      properties:
        account:
          type: string
        name:
          type: string
        permission:
          type: string
        url:
          type: string
      required:
        - name
        - url
        - permission
      type: object
    CheckResult:
      additionalProperties: false
      properties:
        findings:
          items:
            $ref: "#/components/schemas/Finding"
          type:
            - array
            - "null"
      required:
        - findings
      type: object
    CommentEditInputBody:
      additionalProperties: false
      properties:
        body:
          description: The comment in Markdown
          minLength: 1
          type: string
      required:
        - body
      type: object
    CommentInputBody:
      additionalProperties: false
      properties:
        body:
          description: The comment in Markdown
          minLength: 1
          type: string
      required:
        - body
      type: object
    CommentView:
      additionalProperties: false
      properties:
        author:
          type: string
        body:
          type: string
        created:
          format: date-time
          type: string
        deleted_at:
          description: When the comment was removed
          format: date-time
          type: string
        task:
          description: The ULID of the task the comment is on
          type: string
        ulid:
          type: string
        updated:
          format: date-time
          type: string
      required:
        - ulid
        - author
        - created
        - body
      type: object
    CommentWrite:
      additionalProperties: false
      properties:
        comment:
          $ref: "#/components/schemas/CommentView"
          description: The comment as written; for a removal, as it was
        commit:
          description: The commit made; null when nothing changed
          type:
            - string
            - "null"
      required:
        - comment
        - commit
      type: object
    Count:
      additionalProperties: false
      properties:
        done:
          format: int64
          type: integer
        total:
          format: int64
          type: integer
      required:
        - done
        - total
      type: object
    CreateInputBody:
      additionalProperties: false
      properties:
        after:
          description: Put it after this sibling; without a parent, it goes under the sibling's parent and in its workspace
          type: string
        assignees:
          items:
            type: string
          type:
            - array
            - "null"
        before:
          description: Put it before this sibling; without a parent, it goes under the sibling's parent and in its workspace
          type: string
        body:
          description: The body in Markdown
          type: string
        kind:
          description: project for hh add --kind project
          type: string
        labels:
          items:
            type: string
          type:
            - array
            - "null"
        parent:
          description: "The parent: an ID or a ULID"
          type: string
        props:
          additionalProperties: {}
          description: Property name to value
          type: object
        repos:
          description: The repo IDs to put on the task
          items:
            type: string
          type:
            - array
            - "null"
        status:
          type: string
        title:
          minLength: 1
          type: string
        workspace:
          description: The workspace, by name or prefix
          type: string
      required:
        - title
      type: object
    CreateIssueInputBody:
      additionalProperties: false
      properties:
        repo:
          description: The repository, as [<host>/]owner/repo; without it, the one the task names. A task with none or several needs it
          type: string
      type: object
    DefaultView:
      additionalProperties: false
      properties:
        name:
          description: The default store; null when there is none
          type:
            - string
            - "null"
      required:
        - name
      type: object
    Detached:
      additionalProperties: false
      properties:
        id:
          description: The id of the task after the move
          type: string
        releases:
          description: The names of the releases taken off
          items:
            type: string
          type:
            - array
            - "null"
        sprint:
          description: The name of the sprint taken off
          type: string
        task:
          type: string
      required:
        - task
        - id
      type: object
    DeviceStartBody:
      additionalProperties: false
      properties:
        expires_at:
          description: When the code ends; the flow ends with an error event then
          format: date-time
          type: string
        id:
          description: For DELETE /api/auth/device/{id} and the event auth.device
          type: string
        user_code:
          description: The code to enter at verification_uri
          type: string
        verification_uri:
          type: string
      required:
        - id
        - user_code
        - verification_uri
        - expires_at
      type: object
    DeviceStartInputBody:
      additionalProperties: false
      properties:
        host:
          description: "As hh auth login --host: the host of a new account (github.com without it); for an account that exists it must be its host"
          type: string
        name:
          description: The account to log in (again), as hh auth login <name>; without it the account of the login that approves the code is added
          type: string
      type: object
    DoctorReport:
      additionalProperties: false
      properties:
        findings:
          items:
            $ref: "#/components/schemas/Finding"
          type:
            - array
            - "null"
        rebuilt:
          $ref: "#/components/schemas/Rebuilt"
        repaired:
          items:
            $ref: "#/components/schemas/Fixed"
          type:
            - array
            - "null"
        store:
          type: string
      required:
        - store
        - repaired
        - findings
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    FieldsView:
      additionalProperties: false
      properties:
        default_sync:
          type: string
        mirror:
          items:
            type: string
          type: array
        props:
          additionalProperties:
            type: string
          type: object
        push:
          items:
            type: string
          type: array
      required:
        - default_sync
        - push
        - mirror
        - props
      type: object
    Finding:
      additionalProperties: false
      properties:
        check:
          type: string
        hint:
          type: string
        msg:
          type: string
        severity:
          type: string
        task:
          type: string
        where:
          type: string
      required:
        - check
        - where
        - msg
        - severity
      type: object
    Fixed:
      additionalProperties: false
      properties:
        author:
          type: string
        id:
          type: string
        kind:
          type: string
        title:
          type: string
        ulid:
          type: string
        value: {}
      required:
        - ulid
        - title
        - kind
        - value
      type: object
    GitHubRepoView:
      additionalProperties: false
      properties:
        account:
          description: The name of the account that reads it; absent when none can
          type: string
        app_missing:
          description: GitHub said the GitHub App is not installed where the repository is
          type: boolean
        last_fetch:
          description: When it was last read, absent before the first read
          format: date-time
          type: string
        limit:
          description: The rate limit, 0 before the first read
          format: int64
          type: integer
        next_fetch:
          description: The first time it may be read again; absent or past means at the next sync
          format: date-time
          type: string
        remaining:
          format: int64
          type: integer
        repo:
          description: <host>/<owner>/<repo>
          type: string
        reset_at:
          format: date-time
          type: string
        slowed_until:
          description: "While the reads are held back by the rate limit: when it recovers"
          format: date-time
          type: string
        store:
          type: string
        warnings:
          items:
            type: string
          type: array
      required:
        - store
        - repo
        - warnings
        - limit
        - remaining
        - app_missing
      type: object
    GitHubSummary:
      additionalProperties: false
      properties:
        app_missing:
          description: The repositories the GitHub App is not installed for
          format: int64
          type: integer
        last_fetch:
          description: The latest read of its repositories
          format: date-time
          type: string
        limit:
          description: The rate limit of the repository with the least left
          format: int64
          type: integer
        next_fetch:
          description: The first read to come
          format: date-time
          type: string
        remaining:
          format: int64
          type: integer
        slowed_until:
          description: "While a read is held back by the rate limit: the last time it recovers"
          format: date-time
          type: string
        warnings:
          description: The repositories with a warning
          format: int64
          type: integer
      required:
        - limit
        - remaining
        - warnings
        - app_missing
      type: object
    GithubImportInputBody:
      additionalProperties: false
      properties:
        dry_run:
          description: Only count them
          type: boolean
        label:
          description: The label of the issues to take in
          minLength: 1
          type: string
        parent:
          description: The task to put them under
          type: string
        repo:
          description: The repository, as [<host>/]owner/repo
          minLength: 1
          type: string
        workspace:
          description: The workspace; needed without parent when the store has several
          type: string
      required:
        - repo
        - label
      type: object
    GroupView:
      additionalProperties: false
      properties:
        key:
          description: The value of the group; empty for the tasks with none
          type: string
        ulids:
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - key
        - ulids
      type: object
    HealthOutputBody:
      additionalProperties: false
      properties:
        pid:
          description: The process of the server
          format: int64
          type: integer
        version:
          description: The version of hedgehug
          type: string
      required:
        - version
        - pid
      type: object
    HelloEvent:
      additionalProperties: false
      properties:
        client:
          description: This connection, for PUT /api/presence
          type: string
        stores:
          description: The HEAD and the sync state of each store now
          items:
            $ref: "#/components/schemas/StoreState"
          type:
            - array
            - "null"
        unread:
          format: int64
          type: integer
      required:
        - client
        - stores
        - unread
      type: object
    IDChange:
      additionalProperties: false
      properties:
        new:
          type: string
        old:
          type: string
      required:
        - old
        - new
      type: object
    ImportResult:
      additionalProperties: false
      properties:
        count:
          format: int64
          type: integer
        created:
          description: The ids of the tasks made
          items:
            type: string
          type: array
        dry_run:
          type: boolean
        repo:
          type: string
        skipped:
          description: The issues that are linked already
          format: int64
          type: integer
        warnings:
          items:
            type: string
          type: array
      required:
        - repo
        - count
        - skipped
        - created
        - dry_run
        - warnings
      type: object
    IndexProblem:
      additionalProperties: false
      properties:
        code:
          type: string
        field:
          type: string
        message:
          type: string
      required:
        - code
        - field
        - message
      type: object
    IssueWrite:
      additionalProperties: false
      properties:
        commit:
          description: The commit made; null when nothing changed
          type:
            - string
            - "null"
        detached:
          description: "What a move to another workspace took off the tasks: the sprint and the releases that are not of the new workspace, as hh mv tells it"
          items:
            $ref: "#/components/schemas/Detached"
          type:
            - array
            - "null"
        note:
          description: What restore at a commit has to say, as hh restore --at prints it
          type: string
        ref:
          type: string
        task:
          $ref: "#/components/schemas/TaskView"
        warnings:
          items:
            type: string
          type: array
      required:
        - ref
        - warnings
        - task
        - commit
      type: object
    Item:
      additionalProperties: false
      properties:
        author:
          type: string
        commit:
          type: string
        detail: {}
        id:
          type: string
        kind:
          type: string
        path:
          type: string
        task:
          type: string
        time:
          format: date-time
          type: string
        to:
          type: string
        ulid:
          type: string
      required:
        - ulid
        - kind
        - commit
        - author
        - to
        - time
      type: object
    KindDef:
      additionalProperties: false
      properties:
        default:
          type: boolean
        icon:
          type: string
        label:
          type: string
        name:
          type: string
        parents:
          items:
            type: string
          type:
            - array
            - "null"
        role:
          type: string
        template:
          type: string
      required:
        - name
        - role
        - parents
      type: object
    LinkInputBody:
      additionalProperties: false
      properties:
        issue:
          description: The issue, as [<host>/]owner/repo#n; not with pr
          type: string
        pr:
          description: The pull request, as [<host>/]owner/repo#n; not with issue
          type: string
        sync:
          description: How an issue syncs; on an issue linked already it changes the mode. Without it, issue_fields.default_sync
          enum:
            - mirror
            - push
            - link
          type: string
      type: object
    LinkView:
      additionalProperties: false
      properties:
        branch:
          description: The branch of the pull request
          type: string
        checks:
          type: string
        fields:
          items:
            type: string
          type: array
        label:
          description: "The ref as people write it: org-a/web#123"
          type: string
        merged_at:
          format: date-time
          type: string
        ref:
          type: string
        review:
          type: string
        state:
          description: Empty until GitHub is read
          type: string
        state_reason:
          type: string
        sync:
          enum:
            - mirror
            - push
            - link
          type: string
        title:
          description: The title on GitHub; empty until GitHub is read
          type: string
        type:
          enum:
            - github_pr
            - github_issue
          type: string
        via:
          description: What linked it automatically; absent for a link made by a person
          enum:
            - branch
            - mark
            - id
            - comment
          type: string
      required:
        - type
        - ref
        - label
        - sync
      type: object
    LogTrailer:
      additionalProperties: false
      properties:
        key:
          type: string
        value:
          type: string
      required:
        - key
        - value
      type: object
    LogView:
      additionalProperties: false
      properties:
        author:
          $ref: "#/components/schemas/LogViewAuthorStruct"
        date:
          format: date-time
          type: string
        hash:
          type: string
        id:
          type:
            - string
            - "null"
        op:
          type:
            - string
            - "null"
        store:
          type: string
        subject:
          type: string
        task:
          type:
            - string
            - "null"
        trailers:
          items:
            $ref: "#/components/schemas/LogTrailer"
          type: array
        workspace:
          $ref: "#/components/schemas/WorkspaceRef"
      required:
        - hash
        - date
        - author
        - store
        - op
        - task
        - id
        - subject
        - trailers
      type: object
    LogViewAuthorStruct:
      additionalProperties: false
      properties:
        email:
          type: string
        name:
          type: string
      required:
        - name
        - email
      type: object
    MigrateInputBody:
      additionalProperties: false
      properties:
        dry_run:
          type: boolean
        new:
          minLength: 1
          type: string
        old:
          minLength: 1
          type: string
        prop:
          description: "With value: the property whose value it is"
          type: string
        target:
          enum:
            - status
            - kind
            - prop
            - value
          type: string
      required:
        - target
        - old
        - new
      type: object
    MigrateWrite:
      additionalProperties: false
      properties:
        changed:
          items:
            $ref: "#/components/schemas/TaskView"
          type:
            - array
            - "null"
        commit:
          type:
            - string
            - "null"
        skipped:
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - changed
        - skipped
        - commit
      type: object
    MountCandidate:
      additionalProperties: false
      properties:
        account:
          type: string
        name:
          description: The name to mount the store under
          minLength: 1
          type: string
        url:
          minLength: 1
          type: string
      required:
        - name
        - url
      type: object
    MountFailed:
      additionalProperties: false
      properties:
        code:
          description: What went wrong, as the type of a problem
          type: string
        message:
          description: The message in English, as the CLI prints it
          type: string
        name:
          type: string
      required:
        - name
        - code
        - message
      type: object
    MountView:
      additionalProperties: false
      properties:
        failed:
          description: The candidates that could not be added; the others were
          items:
            $ref: "#/components/schemas/MountFailed"
          type:
            - array
            - "null"
        mounted:
          description: The names of the stores that were added
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - mounted
        - failed
      type: object
    MoveInputBody:
      additionalProperties: false
      properties:
        after:
          description: Put it after this sibling
          type: string
        before:
          description: Put it before this sibling
          type: string
        parent:
          description: "The new parent: an ID or a ULID"
          type: string
        root:
          description: Move to the top, with no parent
          type: boolean
        workspace:
          description: Move to another workspace
          type: string
      type: object
    MovePlanView:
      additionalProperties: false
      properties:
        from:
          type: string
        hidden:
          description: Accounts that can read the source and not the destination; empty when either list is unknown
          items:
            type: string
          type: array
        parent:
          $ref: "#/components/schemas/MoveTaskView"
          description: The parent in the destination, when one was given; id is as the destination shows it
        scoped:
          $ref: "#/components/schemas/MoveScopedView"
          description: Present when a project moved has a scoped schema or automations of its own
        tasks:
          description: The root first, every parent before its children; id is as the source shows it
          items:
            $ref: "#/components/schemas/MoveTaskView"
          type: array
        to:
          type: string
        unlinked:
          description: The references the move cuts
          items:
            $ref: "#/components/schemas/MoveUnlinkView"
          type: array
        workspace:
          $ref: "#/components/schemas/MoveWorkspaceView"
          description: The workspace of the destination that the root task goes into
      required:
        - from
        - to
        - workspace
        - tasks
        - unlinked
        - hidden
      type: object
    MoveRefView:
      additionalProperties: false
      properties:
        id:
          type: string
        ulid:
          type: string
      required:
        - ulid
        - id
      type: object
    MoveScopedResult:
      additionalProperties: false
      properties:
        carried:
          type: boolean
        dropped:
          items:
            type: string
          type: array
      required:
        - carried
      type: object
    MoveScopedView:
      additionalProperties: false
      properties:
        choice:
