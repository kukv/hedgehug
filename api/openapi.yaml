components:
  schemas:
    AccountBody:
      additionalProperties: false
      properties:
        id:
          type: string
        login:
          type: string
        method:
          enum:
            - device
            - gh
            - env
            - keychain
          type: string
        name:
          type: string
      required:
        - id
        - name
        - login
        - method
      type: object
    AccountRow:
      additionalProperties: false
      properties:
        id:
          type: string
        login:
          type: string
        method:
          enum:
            - device
            - gh
            - env
            - keychain
          type: string
        name:
          type: string
        orgs:
          description: GitHub App が入っていない組織(認証エラーのときは空)
          items:
            type: string
          nullable: true
          type: array
        reason:
          type: string
        status:
          enum:
            - ok
            - auth_error
            - app_missing
          type: string
      required:
        - id
        - name
        - login
        - method
        - status
        - reason
        - orgs
      type: object
    ActiveSprint:
      additionalProperties: false
      nullable: true
      properties:
        confirmed:
          $ref: "#/components/schemas/SprintConfirmed"
          description: 完了で確定した値。完了していなければ null
        end:
          type: string
        goal:
          type: string
        id:
          type: string
        name:
          type: string
        start:
          description: YYYY-MM-DD。空は値なし
          type: string
        state:
          enum:
            - planned
            - active
            - closed
          type: string
      required:
        - id
        - name
        - state
        - start
        - end
        - goal
        - confirmed
      type: object
    AddStep:
      additionalProperties: false
      properties:
        title:
          type: string
      required:
        - title
      type: object
    AddWorkspaceProperty:
      additionalProperties: false
      properties:
        key:
          type: string
        kinds:
          description: 使う種類。空ならすべて
          items:
            type: string
          type: array
        name:
          description: 1 行。改行は入れられない
          pattern: ^[^\r\n]*$
          type: string
        type:
          enum:
            - text
            - number
            - date
            - single
            - multi
            - user
            - check
            - url
          type: string
      required:
        - name
        - key
        - type
        - kinds
      type: object
    AddWorkspaceValue:
      additionalProperties: false
      properties:
        name:
          description: 1 行。改行は入れられない
          pattern: ^[^\r\n]*$
          type: string
      required:
        - name
      type: object
    ApplyAutomationIgnoringWorkflow:
      additionalProperties: false
      properties:
        status:
          description: 変えるステータスの ID(通知の Status)
          type: string
      required:
        - status
      type: object
    AutomationRule:
      additionalProperties: false
      properties:
        action:
          enum:
            - status
            - assignee
          type: string
        allMerged:
          description: きっかけが pr_merged のときの条件
          type: boolean
        enabled:
          type: boolean
        id:
          type: string
        name:
          type: string
        scope:
          description: このプロジェクトだけのルールなら、プロジェクトの内部 ID。空ならワークスペース全体。作成のときだけ読み、編集では変えない
          type: string
        scopeDeleted:
          description: 専用ルールの持ち主のプロジェクトが削除済みか。一覧でだけ埋める
          type: boolean
        scopeLabel:
          description: 専用ルールの持ち主のプロジェクトの表示 ID(HH-P1)。一覧でだけ埋める
          type: string
        trigger:
          enum:
            - pr_open
            - review_requested
            - pr_merged
            - issue_closed
            - status
            - steps_done
          type: string
        triggerStatus:
          description: きっかけが status のときのステータスの ID。ほかは空
          type: string
        value:
          description: ステータスの ID、ログイン名、または @none(未割り当て)
          type: string
      required:
        - id
        - enabled
        - name
        - trigger
        - triggerStatus
        - allMerged
        - action
        - value
      type: object
    AutomationRuleInput:
      additionalProperties: false
      properties:
        action:
          enum:
            - status
            - assignee
          type: string
        allMerged:
          description: きっかけが pr_merged のときの条件
          type: boolean
        name:
          type: string
        scope:
          description: このプロジェクトだけのルールなら、プロジェクトの内部 ID。空ならワークスペース全体。作成のときだけ読み、編集では変えない
          type: string
        trigger:
          enum:
            - pr_open
            - review_requested
            - pr_merged
            - issue_closed
            - status
            - steps_done
          type: string
        triggerStatus:
          description: きっかけが status のときのステータスの ID。ほかは空
          type: string
        value:
          description: ステータスの ID、ログイン名、または @none(未割り当て)
          type: string
      required:
        - name
        - trigger
        - triggerStatus
        - allMerged
        - action
        - value
      type: object
    AutomationRun:
      additionalProperties: false
      properties:
        at:
          format: date-time
          type: string
        display:
          type: string
        item:
          type: string
        text:
          type: string
      required:
        - at
        - item
        - display
        - text
      type: object
    ChangeKind:
      additionalProperties: false
      properties:
        kind:
          enum:
            - Story
            - Task
            - Bug
          type: string
      required:
        - kind
      type: object
    ChangeWorkspacePrefix:
      additionalProperties: false
      properties:
        prefix:
          type: string
      required:
        - prefix
      type: object
    CheckStep:
      additionalProperties: false
      properties:
        done:
          type: boolean
      required:
        - done
      type: object
    CloseSprint:
      additionalProperties: false
      properties:
        destination:
          description: 未完了のアイテムの移動先(計画中のスプリントの内部 ID)。null はバックログ
          nullable: true
          type: string
      required:
        - destination
      type: object
    Comment:
      additionalProperties: false
      properties:
        at:
          description: 投稿した時刻(RFC 3339)
          type: string
        body:
          type: string
        by:
          description: 投稿者のログイン名
          type: string
        byName:
          description: 投稿者の表示名。メンバーにいなければ「不明なユーザー」
          type: string
        edited:
          type: boolean
        id:
          type: string
      required:
        - id
        - by
        - byName
        - at
        - body
        - edited
      type: object
    CommentText:
      additionalProperties: false
      properties:
        body:
          type: string
      required:
        - body
      type: object
    CreateItem:
      additionalProperties: false
      properties:
        description:
          description: もとになるアイテムの説明(Markdown)。空は説明なし。子の説明はテンプレートのものを使う
          type: string
        kind:
          enum:
            - Epic
            - Story
            - Task
            - Bug
            - Step
          type: string
        parent:
          description: 空は親を選んでいない
          type: string
        project:
          description: 空はプロジェクトを選んでいない
          type: string
        sprint:
          description: 入れるスプリントの内部 ID。null と空はバックログ
          nullable: true
          type: string
        template:
          description: 一緒に作るテンプレートの内部 ID。空は「なし」
          type: string
        title:
          type: string
        values:
          additionalProperties: {}
          description: プロパティの値(キーはプロパティの内部 ID。組み込みはキー)
          type: object
      required:
        - project
        - kind
        - title
      type: object
    CreateProject:
      additionalProperties: false
      properties:
        end:
          pattern: ^(\d{4}-\d{2}-\d{2})?$
          type: string
        owner:
          type: string
        start:
          pattern: ^(\d{4}-\d{2}-\d{2})?$
          type: string
        status:
          enum:
            - Todo
            - InProgress
            - Done
            - Pending
            - Cancel
            - ""
          type: string
        title:
          description: 1 行。改行は入れられない
          pattern: ^[^\r\n]*$
          type: string
      required:
        - title
      type: object
    CreateWorkspace:
      additionalProperties: false
      properties:
        name:
          description: 1 行。改行は入れられない
          pattern: ^[^\r\n]*$
          type: string
        prefix:
          type: string
      required:
        - name
        - prefix
      type: object
    DeleteItemPreview:
      additionalProperties: false
      properties:
        count:
          description: 下にある、削除されていないアイテムの数
          format: int64
          type: integer
        kinds:
          description: 下にあるものの種類。Epic・Story・Task・Bug・Step の順で重ねない
          items:
            type: string
          type: array
        retentionDays:
          description: その Store の削除済みの保持日数
          format: int64
          type: integer
      required:
        - count
        - kinds
        - retentionDays
      type: object
    DeleteProjectPreview:
      additionalProperties: false
      properties:
        items:
          description: 下にある、削除されていないアイテムの数(Epic から Step まで全部)
          format: int64
          type: integer
        retentionDays:
          description: その Store の削除済みの保持日数
          format: int64
          type: integer
      required:
        - items
        - retentionDays
      type: object
    DescribeBody:
      additionalProperties: false
      properties:
        base:
          description: 編集を始めたときの説明。保存するときの共通の祖先になる
          type: string
        text:
          description: 入力した説明。空白だけは空として保存する(説明を消す)
          type: string
      required:
        - base
        - text
      type: object
    DescribeResult:
      additionalProperties: false
      properties:
        conflict:
          description: 同じ箇所が同時に編集されて、両方の版を残したとき true
          type: boolean
        text:
          description: 保存したあとの説明
          type: string
      required:
        - text
        - conflict
      type: object
    DescriptionText:
      additionalProperties: false
      properties:
        text:
          description: 説明の本文(Markdown)。説明がなければ空
          type: string
      required:
        - text
      type: object
    Duplicated:
      additionalProperties: false
      properties:
        id:
          description: 新しいアイテムの内部 ID
          type: string
      required:
        - id
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          example: Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          nullable: true
          type: array
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          example: https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          example: 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          example: Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          example: https://example.com/errors/example
          format: uri
          type: string
      type: object
    HistoryRow:
      additionalProperties: false
      properties:
        at:
          description: 時刻(ミリ秒までの RFC 3339)
          type: string
        text:
          description: 変更の文(作成・タイトルを「…」に変更 など)
          type: string
        who:
          description: 操作した人の表示(メンバーの名前・自動化・GitHub・同期・不明なユーザー)
          type: string
      required:
        - who
        - text
        - at
      type: object
    ImpactOutputBody:
      additionalProperties: false
      properties:
        lines:
          items:
            type: string
          nullable: true
          type: array
      required:
        - lines
      type: object
    Item:
      additionalProperties: false
      properties:
        assignee:
          description: ログイン名。空は未割り当て
          type: string
        blocked:
          description: ブロック中か。ブロックしている相手に、完了・中止でないものがある
          type: boolean
        choices:
          additionalProperties:
            items:
              type: string
            nullable: true
            type: array
          description: 選択式の追加プロパティの値(プロパティの内部 ID → 値の内部 ID)
          type: object
        createdAt:
          type: string
        createdBy:
          type: string
        end:
          type: string
        estimate:
          description: 時間
          format: double
          nullable: true
          type: number
        fields:
          additionalProperties: {}
          description: 追加プロパティの値(プロパティの内部 ID → 値)。型は設定で読む
          type: object
        id:
          type: string
        kind:
          enum:
            - Epic
            - Story
            - Task
            - Bug
            - Step
          type: string
        number:
          format: int64
          type: integer
        parent:
          description: 親の内部 ID。Epic は null
          nullable: true
          type: string
        points:
          format: double
          nullable: true
          type: number
        priority:
          type: string
        project:
          type: string
        rank:
          type: string
        release:
          description: リリースの内部 ID。空は「なし」
          type: string
        sprint:
          description: スプリントの内部 ID。空はバックログ
          type: string
        start:
          description: YYYY-MM-DD。空は値なし
          type: string
        status:
          description: ステータスの内部 ID。空は値なし
          type: string
        systems:
          items:
            type: string
          type: array
        title:
          type: string
        watchers:
          items:
            type: string
          nullable: true
          type: array
        workspace:
          type: string
      required:
        - id
        - workspace
        - project
        - parent
        - number
        - kind
        - rank
        - title
        - watchers
        - blocked
        - createdAt
        - createdBy
        - status
        - priority
        - assignee
        - start
        - end
        - sprint
        - release
        - points
        - estimate
        - systems
        - choices
        - fields
      type: object
    LinkInput:
      additionalProperties: false
      properties:
        addToProject:
          description: プロジェクトのリポジトリにも追加する
          type: boolean
        kind:
          enum:
            - pr
            - issue
          type: string
        number:
          description: 入力のまま。正の整数でなければ断る
          type: string
        repo:
          type: string
      required:
        - kind
        - repo
        - number
        - addToProject
      type: object
    LinkRef:
      additionalProperties: false
      properties:
        kind:
          enum:
            - pr
            - issue
          type: string
        number:
          format: int64
          type: integer
        repo:
          type: string
      required:
        - kind
        - repo
        - number
      type: object
    LinkRow:
      additionalProperties: false
      properties:
        checks:
          description: このマシンが読んだ PR のチェックの結果。なければ空
          enum:
            - ""
            - success
            - failure
            - pending
          type: string
        error:
          description: "取り直しの失敗(「状態を更新できませんでした: …」)。なければ空"
          type: string
        kind:
          enum:
            - pr
            - issue
          type: string
        number:
          format: int64
          type: integer
        repo:
          description: owner/name
          type: string
        review:
          description: Issue は none
          enum:
            - none
            - pending
            - approved
            - changes_requested
          type: string
        state:
          enum:
            - open
            - draft
            - merged
            - closed
          type: string
        title:
          type: string
      required:
        - kind
        - repo
        - number
        - title
        - state
        - review
        - checks
        - error
      type: object
    ListOutputBody:
      additionalProperties: false
      properties:
        accounts:
          items:
            $ref: "#/components/schemas/AccountRow"
          nullable: true
          type: array
      required:
        - accounts
      type: object
    Located:
      additionalProperties: false
      properties:
        at:
          description: gone のとき。旧 ID が一致した記録の日時
          type: string
        itemId:
          description: found のとき
          type: string
        kind:
          enum:
            - found
            - gone
          type: string
        movedFrom:
          $ref: "#/components/schemas/LocatedMovedFrom"
          description: found で、転送記録から見つけたとき
        newDisplay:
          description: gone のとき。旧 ID が一致した記録の新 ID
          type: string
        old:
          description: gone のとき。旧 ID
          type: string
        projectId:
          description: found のとき
          type: string
        reason:
          description: gone のとき。deleted は移した先で削除済み、purged は完全に削除、hidden は移動先の Store が表示中でない、elsewhere はそのあと表示中でない Store へ移した
          enum:
            - deleted
            - purged
            - hidden
            - elsewhere
          type: string
        storeId:
          description: found のとき。開くアイテムの Store
          type: string
        storeName:
          description: gone の hidden・elsewhere のとき。表示中でない Store の名前
          type: string
      required:
        - kind
      type: object
    LocatedMovedFrom:
      additionalProperties: false
      properties:
        at:
          description: 旧 ID が一致した記録の日時
          type: string
        current:
          description: 開くアイテムのいまの ID
          type: string
        display:
          description: 旧 ID が一致した記録の新 ID
          type: string
        old:
          description: 旧 ID(HH-2)
          type: string
      required:
        - old
        - at
        - display
        - current
      type: object
    LocatedProject:
      additionalProperties: false
      properties:
        at:
          description: gone のとき。旧 ID が一致した記録の日時
          type: string
        kind:
          enum:
            - found
            - gone
          type: string
        movedFrom:
          $ref: "#/components/schemas/LocatedMovedFrom"
          description: found で、転送記録から見つけたとき
        newDisplay:
          description: gone のとき。旧 ID が一致した記録の新 ID
          type: string
        old:
          description: gone のとき。旧 ID
          type: string
        projectId:
          description: found のとき
          type: string
        reason:
          description: gone のとき
          enum:
            - deleted
            - purged
            - hidden
            - elsewhere
          type: string
        storeId:
          description: found のとき。開くプロジェクトの Store
          type: string
        storeName:
          description: gone の hidden・elsewhere のとき。表示中でない Store の名前
          type: string
      required:
        - kind
      type: object
    Me:
      additionalProperties: false
      properties:
        login:
          type: string
      required:
        - login
      type: object
    Member:
      additionalProperties: false
      properties:
        login:
          type: string
        name:
          type: string
      required:
        - login
        - name
      type: object
    MoveCandidate:
      additionalProperties: false
      properties:
        display:
          description: 画面の ID(HH-12・HH-P2)
          type: string
        id:
          description: アイテムかプロジェクトの内部 ID
          type: string
        kind:
          description: item はアイテム(親になる Epic・Story・Task・Bug)、project はプロジェクト(Epic の移し先)
          enum:
            - item
            - project
          type: string
        projectId:
          description: 移したあとのプロジェクトの内部 ID。アイテムの候補なら属するプロジェクト、プロジェクトの候補なら自分
          type: string
        projectTitle:
          description: アイテムの候補が属するプロジェクトの名前。プロジェクトの候補では空
          type: string
        title:
          type: string
      required:
        - kind
        - id
        - display
        - title
        - projectId
        - projectTitle
      type: object
    MoveItem:
      additionalProperties: false
      properties:
        parent:
          description: 新しい親の内部 ID(Epic 以外)
          type: string
        project:
          description: 移し先のプロジェクトの内部 ID(Epic)
          type: string
        statuses:
          additionalProperties:
            type: string
          description: プロジェクトが変わるときの、移動先が使わないステータスの ID → 置き換え先のステータスの ID。指定のないものは同じ分類の移動先の既定になる
          type: object
      type: object
    MovePreview:
      additionalProperties: false
      properties:
        below:
          description: 下のもの(削除済みを除く)の件数
          format: int64
          type: integer
        statuses:
          description: 移動先が使わないステータス。ワークスペースのステータスの順。なければ空
          items:
            $ref: "#/components/schemas/MovePreviewStatus"
          type: array
      required:
        - below
        - statuses
      type: object
    MovePreviewStatus:
      additionalProperties: false
      properties:
        count:
          description: そのステータスを持つ移すアイテム(削除済みと自分自身を含む)の件数
          format: int64
          type: integer
        default:
          description: 置き換えの初めの値。同じ分類の、移動先の既定のステータスの ID
          type: string
        status:
          description: ステータスの ID
          type: string
      required:
        - status
        - count
        - default
      type: object
    MoveWorkspaceItem:
      additionalProperties: false
      properties:
        direction:
          enum:
            - up
            - down
          type: string
      required:
        - direction
      type: object
    NextNumber:
      additionalProperties: false
      properties:
        number:
          format: int64
          type: integer
      required:
        - number
      type: object
    PlanningOverview:
      additionalProperties: false
      properties:
        active:
          $ref: "#/components/schemas/ActiveSprint"
        defaults:
          $ref: "#/components/schemas/SprintDefaults"
        releases:
          items:
            $ref: "#/components/schemas/Release"
          type: array
        retentionDays:
          description: その Store の削除済みの保持日数
          format: int64
          type: integer
        sprints:
          items:
            $ref: "#/components/schemas/Sprint"
          type: array
      required:
        - sprints
        - releases
        - active
        - defaults
        - retentionDays
      type: object
    PlanningRow:
      additionalProperties: false
      properties:
        assignee:
          description: ログイン名。空は未割り当て
          type: string
