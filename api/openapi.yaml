components:
  schemas:
    AccountBody:
      additionalProperties: false
      properties:
        id:
          type: string
        login:
          type: string
        method:
          enum:
            - device
            - gh
            - env
            - keychain
          type: string
        name:
          type: string
      required:
        - id
        - name
        - login
        - method
      type: object
    AddInputBody:
      additionalProperties: false
      properties:
        login:
          type: string
        method:
          description: デバイスフローはサインインの API で登録する
          enum:
            - gh
            - env
            - keychain
          type: string
        name:
          type: string
      required:
        - name
        - login
        - method
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          example: Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          nullable: true
          type: array
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          example: https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          example: 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          example: Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          example: https://example.com/errors/example
          format: uri
          type: string
      type: object
    ListOutputBody:
      additionalProperties: false
      properties:
        accounts:
          items:
            $ref: "#/components/schemas/AccountBody"
          nullable: true
          type: array
      required:
        - accounts
      type: object
    SystemInfo:
      additionalProperties: false
      properties:
        version:
          description: hedgehug の版
          type: string
      required:
        - version
      type: object
info:
  title: hedgehug
  version: dev
openapi: 3.0.3
paths:
  /api/accounts:
    get:
      operationId: list-accounts
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: 登録したアカウントを返す
    post:
      operationId: add-account
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountBody"
          description: Created
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: GitHub で確かめてからアカウントを登録する
  /api/system:
    get:
      operationId: get-system
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemInfo"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: サーバーの版を返す
