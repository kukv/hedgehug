components:
  schemas:
    AccountBody:
      additionalProperties: false
      properties:
        id:
          type: string
        login:
          type: string
        method:
          enum:
            - device
            - gh
            - env
            - keychain
          type: string
        name:
          type: string
      required:
        - id
        - name
        - login
        - method
      type: object
    AccountRow:
      additionalProperties: false
      properties:
        id:
          type: string
        login:
          type: string
        method:
          enum:
            - device
            - gh
            - env
            - keychain
          type: string
        name:
          type: string
        reason:
          type: string
        status:
          enum:
            - ok
            - auth_error
          type: string
      required:
        - id
        - name
        - login
        - method
        - status
        - reason
      type: object
    AddStep:
      additionalProperties: false
      properties:
        title:
          type: string
      required:
        - title
      type: object
    ChangeWorkspacePrefix:
      additionalProperties: false
      properties:
        prefix:
          type: string
      required:
        - prefix
      type: object
    CreateItem:
      additionalProperties: false
      properties:
        kind:
          enum:
            - Epic
            - Story
            - Task
            - Bug
            - Step
          type: string
        parent:
          description: 空は親を選んでいない
          type: string
        project:
          description: 空はプロジェクトを選んでいない
          type: string
        title:
          type: string
      required:
        - project
        - kind
        - title
      type: object
    CreateProject:
      additionalProperties: false
      properties:
        end:
          pattern: ^(\d{4}-\d{2}-\d{2})?$
          type: string
        owner:
          type: string
        start:
          pattern: ^(\d{4}-\d{2}-\d{2})?$
          type: string
        status:
          enum:
            - Todo
            - InProgress
            - Done
            - Pending
            - Cancel
            - ""
          type: string
        title:
          description: 1 行。改行は入れられない
          pattern: ^[^\r\n]*$
          type: string
      required:
        - title
      type: object
    CreateWorkspace:
      additionalProperties: false
      properties:
        name:
          description: 1 行。改行は入れられない
          pattern: ^[^\r\n]*$
          type: string
        prefix:
          type: string
      required:
        - name
        - prefix
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          example: Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          nullable: true
          type: array
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          example: https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          example: 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          example: Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          example: https://example.com/errors/example
          format: uri
          type: string
      type: object
    ImpactOutputBody:
      additionalProperties: false
      properties:
        lines:
          items:
            type: string
          nullable: true
          type: array
      required:
        - lines
      type: object
    Item:
      additionalProperties: false
      properties:
        createdAt:
          type: string
        createdBy:
          type: string
        id:
          type: string
        kind:
          enum:
            - Epic
            - Story
            - Task
            - Bug
            - Step
          type: string
        number:
          format: int64
          type: integer
        parent:
          description: 親の内部 ID。Epic は null
          nullable: true
          type: string
        project:
          type: string
        rank:
          type: string
        title:
          type: string
        watchers:
          items:
            type: string
          nullable: true
          type: array
        workspace:
          type: string
      required:
        - id
        - workspace
        - project
        - parent
        - number
        - kind
        - rank
        - title
        - watchers
        - createdAt
        - createdBy
      type: object
    ListOutputBody:
      additionalProperties: false
      properties:
        accounts:
          items:
            $ref: "#/components/schemas/AccountRow"
          nullable: true
          type: array
      required:
        - accounts
      type: object
    Me:
      additionalProperties: false
      properties:
        login:
          type: string
      required:
        - login
      type: object
    Member:
      additionalProperties: false
      properties:
        login:
          type: string
        name:
          type: string
      required:
        - login
        - name
      type: object
    NextNumber:
      additionalProperties: false
      properties:
        number:
          format: int64
          type: integer
      required:
        - number
      type: object
    Project:
      additionalProperties: false
      properties:
        end:
          type: string
        id:
          type: string
        number:
          format: int64
          type: integer
        owner:
          description: ログイン名。空は「なし」
          type: string
        rank:
          type: string
        start:
          description: YYYY-MM-DD。空は「なし」
          type: string
        status:
          enum:
            - Todo
            - InProgress
            - Done
            - Pending
            - Cancel
          type: string
        title:
          type: string
        workspace:
          type: string
      required:
        - id
        - workspace
        - number
        - rank
        - title
        - owner
        - status
        - start
        - end
      type: object
    RenameItem:
      additionalProperties: false
      properties:
        title:
          type: string
      required:
        - title
      type: object
    RenameWorkspace:
      additionalProperties: false
      properties:
        name:
          description: 1 行。改行は入れられない
          pattern: ^[^\r\n]*$
          type: string
      required:
        - name
      type: object
    SignInCode:
      additionalProperties: false
      properties:
        expires_in:
          description: 秒
          format: int64
          type: integer
        id:
          type: string
        interval:
          description: 秒
          format: int64
          type: integer
        user_code:
          type: string
        verification_uri:
          type: string
      required:
        - id
        - user_code
        - verification_uri
        - expires_in
        - interval
      type: object
    SignInInputBody:
      additionalProperties: false
      properties:
        account:
          description: 編集・再認証するアカウントの ID。登録では空
          type: string
        login:
          type: string
        name:
          type: string
      required:
        - name
        - login
      type: object
    SignInResult:
      additionalProperties: false
      properties:
        account:
          $ref: "#/components/schemas/AccountBody"
        interval:
          description: 次に問い合わせるまでの秒
          format: int64
          type: integer
        message:
          type: string
        state:
          enum:
            - waiting
            - expired
            - denied
            - mismatch
            - failed
            - done
          type: string
      required:
        - state
        - message
        - interval
      type: object
    StoreInfo:
      additionalProperties: false
      properties:
        color:
          description: 画面のトークン --t-<色> の名前
          type: string
        id:
          type: string
        name:
          type: string
        readOnly:
          type: boolean
      required:
        - id
        - name
        - color
        - readOnly
      type: object
    SystemInfo:
      additionalProperties: false
      properties:
        version:
          description: hedgehug の版
          type: string
      required:
        - version
      type: object
    ValuesBody:
      additionalProperties: false
      properties:
        login:
          type: string
        method:
          description: デバイスフローはサインインの API で登録・保存する
          enum:
            - gh
            - env
            - keychain
          type: string
        name:
          type: string
      required:
        - name
        - login
        - method
      type: object
    WorkspaceDetail:
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        oldPrefixes:
          items:
            type: string
          type: array
        prefix:
          type: string
        settings:
          $ref: "#/components/schemas/WorkspaceSettings"
      required:
        - oldPrefixes
        - settings
        - id
        - name
        - prefix
      type: object
    WorkspaceProperty:
      additionalProperties: false
      properties:
        builtin:
          type: boolean
        hidden:
          type: boolean
        id:
          type: string
        key:
          type: string
        kinds:
          items:
            type: string
          type: array
        name:
          type: string
        type:
          type: string
      required:
        - id
        - key
        - name
        - type
        - builtin
        - kinds
        - hidden
      type: object
    WorkspaceSettings:
      additionalProperties: false
      properties:
        categoryDefaults:
          additionalProperties:
            type: string
          type: object
        initialPriority:
          type: string
        initialStatus:
          type: string
        priorities:
          items:
            $ref: "#/components/schemas/WorkspaceValue"
          type: array
        properties:
          items:
            $ref: "#/components/schemas/WorkspaceProperty"
          type: array
        statuses:
          items:
            $ref: "#/components/schemas/WorkspaceValue"
          type: array
        systems:
          items:
            $ref: "#/components/schemas/WorkspaceValue"
          type: array
      required:
        - properties
        - statuses
        - priorities
        - systems
        - initialStatus
        - initialPriority
        - categoryDefaults
      type: object
    WorkspaceSummary:
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        prefix:
          type: string
      required:
        - id
        - name
        - prefix
      type: object
    WorkspaceValue:
      additionalProperties: false
      properties:
        category:
          description: ステータスの分類(todo・doing・done・canceled)
          enum:
            - todo
            - doing
            - done
            - canceled
          type: string
        color:
          enum:
            - gray
            - slate
            - brown
            - red
            - rose
            - pink
            - magenta
            - purple
            - indigo
            - blue
            - sky
            - cyan
            - teal
            - green
            - olive
            - amber
            - yellow
            - orange
          type: string
        id:
          type: string
        name:
          type: string
      required:
        - id
        - name
        - color
      type: object
info:
  title: hedgehug
  version: dev
openapi: 3.0.3
paths:
  /api/accounts:
    get:
      operationId: list-accounts
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: 登録したアカウントを、状態を付けて返す
    post:
      operationId: add-account
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValuesBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountBody"
          description: Created
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: GitHub で確かめてからアカウントを登録する
  /api/accounts/{id}:
    delete:
      operationId: delete-account
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: アカウントを削除し、割り当てた Store を「なし」にする
    put:
      operationId: edit-account
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValuesBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountBody"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: 新しい値を GitHub で確かめてから、アカウントの値を入れ替える
  /api/accounts/{id}/delete-impact:
    get:
      operationId: account-delete-impact
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImpactOutputBody"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: 「アカウントを削除」の確認の本文の行
  /api/accounts/{id}/edit-impact:
    get:
      operationId: account-edit-impact
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - explode: false
          in: query
          name: login
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImpactOutputBody"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: ログイン名を変えるときの「アカウントを変更」の確認の本文の行(空なら確認を出さない)
  /api/accounts/{id}/reauth:
    post:
      operationId: reauth-account
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountBody"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: gh CLI・環境変数・OS のキーチェーンのアカウントの認証の確認をやり直す
  /api/sign-ins:
    post:
      operationId: start-sign-in
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInCode"
          description: Created
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: デバイスフローのサインインを始め、GitHub で入力するコードを返す
  /api/sign-ins/{id}:
    delete:
      operationId: cancel-sign-in
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: サインインをやめる(何も登録しない)
    get:
      operationId: poll-sign-in
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInResult"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: サインインが許可されたかを GitHub に 1 回聞く
  /api/stores:
    get:
      operationId: list-stores
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/StoreInfo"
                nullable: true
                type: array
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: 表示中の Store をサイドバーの並びで返す
  /api/stores/{store}/items:
    post:
      operationId: create-item
      parameters:
        - in: path
          name: store
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateItem"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: アイテムを作成
  /api/stores/{store}/items/{item}:
    get:
      operationId: get-item
      parameters:
        - in: path
          name: store
          required: true
          schema:
            type: string
        - in: path
          name: item
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: アイテムを返す
  /api/stores/{store}/items/{item}/move-up:
    post:
      operationId: move-item-up
      parameters:
        - in: path
          name: store
          required: true
          schema:
            type: string
        - in: path
          name: item
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: アイテムを直前の兄弟と入れ替える
  /api/stores/{store}/items/{item}/steps:
    post:
      operationId: add-step
      parameters:
        - in: path
          name: store
          required: true
          schema:
            type: string
        - in: path
          name: item
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddStep"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: アイテムの子の末尾に Step を作る
  /api/stores/{store}/items/{item}/title:
    put:
      operationId: rename-item
      parameters:
        - in: path
          name: store
          required: true
          schema:
            type: string
        - in: path
          name: item
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameItem"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: アイテムのタイトルを変える
  /api/stores/{store}/me:
    get:
      operationId: get-me
      parameters:
        - in: path
          name: store
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Store での「あなた」のログイン名を返す
  /api/stores/{store}/members:
    get:
      operationId: list-members
      parameters:
        - in: path
          name: store
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Member"
                nullable: true
                type: array
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Store のメンバーを返す
  /api/stores/{store}/projects/{project}:
    get:
      operationId: get-project
      parameters:
        - in: path
          name: store
