          format: date-time
          type: string
        last_error:
          type: string
        last_success:
          format: date-time
          type: string
        next_fetch:
          description: When the loop fetches next; absent before its first sync; absent when no server runs the loop
          format: date-time
          type: string
        pending_since:
          format: date-time
          type: string
        push_at:
          description: "When the background sync pushes the writes not pushed yet: sync.push_interval after pending_since, but not before sync.push_interval after the last sync and not after next_fetch, which syncs too; absent when nothing waits, before the first sync and while a sync runs; absent when no server runs the loop"
          format: date-time
          type: string
        push_interval:
          description: sync.push_interval of config.yaml, in seconds (fractions allowed)
          format: double
          type: number
        read_only:
          type: string
        remotes:
          items:
            type: string
          type:
            - array
            - "null"
        store:
          type: string
        unpushed:
          format: int64
          type: integer
      required:
        - interval
        - push_interval
        - store
        - remotes
      type: object
    TaskList:
      additionalProperties: false
      properties:
        cycle:
          description: The tasks in a parent cycle, with tree
          items:
            $ref: "#/components/schemas/TaskView"
          type:
            - array
            - "null"
        groups:
          description: "The groups, when the query has group:"
          items:
            $ref: "#/components/schemas/GroupView"
          type:
            - array
            - "null"
        roots:
          description: The roots of the tree, with tree
          items:
            $ref: "#/components/schemas/TaskView"
          type: array
        tasks:
          description: The tasks found, without tree
          items:
            $ref: "#/components/schemas/TaskView"
          type: array
      type: object
    TaskView:
      additionalProperties: false
      properties:
        assignees:
          items:
            type: string
          type:
            - array
            - "null"
        blocked_by:
          items:
            $ref: "#/components/schemas/Ref"
          type:
            - array
            - "null"
        broken:
          type: string
        checklist:
          $ref: "#/components/schemas/Count"
        children:
          items:
            $ref: "#/components/schemas/TaskView"
          type:
            - array
            - "null"
        context:
          type: boolean
        created:
          format: date-time
          type: string
        deleted_at:
          format: date-time
          type:
            - string
            - "null"
        former_ids:
          items:
            type: string
          type:
            - array
            - "null"
        id:
          type: string
        in_cycle:
          type: boolean
        kind:
          type: string
        labels:
          items:
            type: string
          type:
            - array
            - "null"
        links:
          description: The pull requests and issues linked, with what GitHub says of them
          items:
            $ref: "#/components/schemas/LinkView"
          type: array
        parent:
          type:
            - string
            - "null"
        problems:
          items:
            $ref: "#/components/schemas/IndexProblem"
          type:
            - array
            - "null"
        progress:
          $ref: "#/components/schemas/Count"
        project:
          $ref: "#/components/schemas/Ref"
        props:
          additionalProperties: {}
          type: object
        rank:
          type: string
        releases:
          items:
            $ref: "#/components/schemas/PlanRef"
          type: array
        scope:
          type: string
        sprint:
          $ref: "#/components/schemas/PlanRef"
        status:
          type: string
        store:
          type: string
        title:
          type: string
        ulid:
          type: string
        updated:
          format: date-time
          type: string
        workspace:
          $ref: "#/components/schemas/WorkspaceRef"
      required:
        - ulid
        - id
        - store
        - workspace
        - kind
        - title
        - parent
        - rank
        - status
        - assignees
        - labels
        - blocked_by
        - props
        - created
        - updated
        - deleted_at
        - problems
      type: object
    TaskWrite:
      additionalProperties: false
      properties:
        commit:
          description: The commit made; null when nothing changed
          type:
            - string
            - "null"
        detached:
          description: "What a move to another workspace took off the tasks: the sprint and the releases that are not of the new workspace, as hh mv tells it"
          items:
            $ref: "#/components/schemas/Detached"
          type:
            - array
            - "null"
        note:
          description: What restore at a commit has to say, as hh restore --at prints it
          type: string
        task:
          $ref: "#/components/schemas/TaskView"
      required:
        - task
        - commit
      type: object
    TasksChanged:
      additionalProperties: false
      properties:
        author:
          description: The Hedgehug-Author of the commit; empty when unknown
          type: string
        automated:
          description: GitHub or a rule wrote it, not a person
          type: boolean
        commit:
          description: "The commit of the change: HEAD, or one of the commits since the last look"
          type: string
        op:
          description: The Hedgehug-Op of the commit; empty for a commit made by hand
          type: string
        removed:
          description: The tasks whose file is gone (purged)
          items:
            type: string
          type:
            - array
            - "null"
        store:
          type: string
        ulids:
          description: The tasks whose file or comments changed
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - store
        - ulids
        - removed
        - commit
        - op
        - author
        - automated
      type: object
    TemplatesDef:
      additionalProperties: false
      properties:
        default:
          additionalProperties:
            type: string
          type: object
        only:
          items:
            type: string
          type:
            - array
            - "null"
      type: object
    UndoKept:
      additionalProperties: false
      properties:
        author:
          type: string
        field:
          type: string
        path:
          type: string
        task:
          description: The ID of the task; empty for other files
          type: string
      required:
        - path
        - field
        - author
      type: object
    UndoWrite:
      additionalProperties: false
      properties:
        changed:
          description: false when every field was changed later by others, so nothing was written
          type: boolean
        commit:
          type:
            - string
            - "null"
        kept:
          description: What others changed after it, which undo kept
          items:
            $ref: "#/components/schemas/UndoKept"
          type:
            - array
            - "null"
        subject:
          description: "The subject of the commit taken back, without the hedgehug: prefix"
          type: string
        undone:
          $ref: "#/components/schemas/LogView"
          description: The commit taken back; null only in the CLI when there was nothing to undo (the server answers an undo.nothing problem)
      required:
        - undone
        - subject
        - changed
        - commit
        - kept
      type: object
    UnreadEvent:
      additionalProperties: false
      properties:
        count:
          description: The items not read, in every store
          format: int64
          type: integer
      required:
        - count
      type: object
    ViewPatchInputBody:
      additionalProperties: false
      properties:
        columns:
          description: The columns of the table
          items:
            type: string
          type: array
        group_by:
          type: string
        kanban_columns:
          type: string
        layout:
          enum:
            - tree
            - table
            - kanban
          type: string
        name:
          description: The new name; a rename cannot come with settings
          type: string
        query:
          type: string
        swimlane:
          type: string
      type: object
    ViewSaveInputBody:
      additionalProperties: false
      properties:
        columns:
          description: The columns of the table
          items:
            type: string
          type: array
        group_by:
          type: string
        kanban_columns:
          type: string
        layout:
          enum:
            - tree
            - table
            - kanban
          type: string
        query:
          type: string
        swimlane:
          type: string
      type: object
    ViewWrite:
      additionalProperties: false
      properties:
        commit:
          type:
            - string
            - "null"
        view:
          $ref: "#/components/schemas/SavedView"
      required:
        - view
        - commit
      type: object
    ViewsChanged:
      additionalProperties: false
      properties:
        store:
          type: string
      required:
        - store
      type: object
    WorkflowDef:
      additionalProperties: false
      properties:
        required:
          additionalProperties:
            items:
              type: string
            type:
              - array
              - "null"
          type: object
        transitions:
          additionalProperties:
            items:
              type: string
            type:
              - array
              - "null"
          type: object
      required:
        - transitions
        - required
      type: object
    WorklogTotal:
      additionalProperties: false
      properties:
        count:
          format: int64
          type: integer
        total:
          description: The time spent, such as 1h30m
          type: string
      required:
        - total
        - count
      type: object
    WorkspaceAddInputBody:
      additionalProperties: false
      properties:
        name:
          type: string
        prefix:
          type: string
      required:
        - name
        - prefix
      type: object
    WorkspacePatchInputBody:
      additionalProperties: false
      properties:
        name:
          description: A new name; give it or prefix, not both
          type: string
        prefix:
          description: A new prefix, which renumbers the tasks
          type: string
      type: object
    WorkspaceRef:
      additionalProperties: false
      properties:
        id_prefix:
          type: string
        name:
          type: string
        ulid:
          type: string
      required:
        - ulid
        - name
        - id_prefix
      type: object
    WorkspaceView:
      additionalProperties: false
      properties:
        deleted:
          format: int64
          type: integer
        id_prefix:
          type: string
        name:
          type: string
        prefix_set:
          format: date-time
          type: string
        tasks:
          format: int64
          type: integer
        ulid:
          type: string
      required:
        - ulid
        - name
        - id_prefix
        - prefix_set
        - tasks
        - deleted
      type: object
    WorkspaceWrite:
      additionalProperties: false
      properties:
        commit:
          type:
            - string
            - "null"
        ids:
          description: "With a new prefix: the IDs the tasks had and have now"
          items:
            $ref: "#/components/schemas/IDChange"
          type:
            - array
            - "null"
        workspace:
          $ref: "#/components/schemas/WorkspaceView"
      required:
        - workspace
        - commit
      type: object
  securitySchemes:
    bearer:
      scheme: bearer
      type: http
info:
  title: Hedgehug
  version: "1"
openapi: 3.1.0
paths:
  /api/accounts:
    get:
      operationId: list-accounts
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/AuthStatus"
                type:
                  - array
                  - "null"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Check the token of each account against GitHub, as hh auth status --json; an account in error is in the array with its state
      tags:
        - accounts
    post:
      operationId: add-account
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountAddInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthAddResult"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Add an account to config.yaml, as hh auth add
      tags:
        - accounts
  /api/accounts/{name}/token:
    delete:
      operationId: remove-account-token
      parameters:
        - description: The name of the account in config.yaml
          in: path
          name: name
          required: true
          schema:
            description: The name of the account in config.yaml
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLogoutResult"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Remove the token of an account from the keychain, as hh auth logout; the account stays in config.yaml
      tags:
        - accounts
    put:
      operationId: set-account-token
      parameters:
        - description: The name of the account; a name that is no account's adds the account of the login the token is of
          in: path
          name: name
          required: true
          schema:
            description: The name of the account; a name that is no account's adds the account of the login the token is of
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountTokenInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLoginResult"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Keep a token in the keychain after GitHub says it is of the account's login, as hh auth login <name> --with-token
      tags:
        - accounts
  /api/accounts/{name}/token-source:
    put:
      operationId: set-account-token-source
      parameters:
        - description: The name of the account in config.yaml
          in: path
          name: name
          required: true
          schema:
            description: The name of the account in config.yaml
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountSourceInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSourceResult"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Change where the token of an account comes from, to gh or env:<VAR>
      tags:
        - accounts
  /api/activity:
    get:
      operationId: list-activity
      parameters:
        - description: The store; without it, the commits of every store
          explode: false
          in: query
          name: store
          schema:
            description: The store; without it, the commits of every store
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            default: 100
            format: int64
            maximum: 1000
            minimum: 1
            type: integer
        - description: Only the commits of this account (its ID)
          explode: false
          in: query
          name: author
          schema:
            description: Only the commits of this account (its ID)
            type: string
        - description: "only: the merges and repairs of syncs; exclude: all but them"
          explode: false
          in: query
          name: sync
          schema:
            description: "only: the merges and repairs of syncs; exclude: all but them"
            enum:
              - only
              - exclude
            type: string
        - description: "only: what GitHub and the rules wrote, and the fetches that note a refused rule; exclude: all but them"
          explode: false
          in: query
          name: automation
          schema:
            description: "only: what GitHub and the rules wrote, and the fetches that note a refused rule; exclude: all but them"
            enum:
              - only
              - exclude
            type: string
        - description: Only the commits of these workspaces (ULID, name or id prefix), comma-separated, as hh log --workspace
          explode: false
          in: query
          name: workspace
          schema:
            description: Only the commits of these workspaces (ULID, name or id prefix), comma-separated, as hh log --workspace
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/LogView"
                type:
                  - array
                  - "null"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: List the commits of the store, newest first, as hh log
      tags:
        - activity
  /api/auth/device:
    post:
      operationId: start-device-login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceStartInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceStartBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Start the device flow, as hh auth login [<name>] [--host]; the server polls, and the event auth.device says how it ended
      tags:
        - accounts
  /api/auth/device/{id}:
    delete:
      operationId: cancel-device-login
      parameters:
        - description: The id POST /api/auth/device answered
          in: path
          name: id
          required: true
          schema:
            description: The id POST /api/auth/device answered
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Stop the device flow; it ends with the event auth.device (error, auth.canceled)
      tags:
        - accounts
  /api/automations:
    get:
      operationId: list-automations
      parameters:
        - description: The store; without it, the one hedgehug picks as the CLI does
          explode: false
          in: query
          name: store
          schema:
            description: The store; without it, the one hedgehug picks as the CLI does
            type: string
        - description: Only what applies in this project, with its scoped disable in enabled
          explode: false
          in: query
          name: project
          schema:
            description: Only what applies in this project, with its scoped disable in enabled
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/RuleView"
                type:
                  - array
                  - "null"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: List the rules in the order they apply, as hh automation list
      tags:
        - automations
    post:
      description: The answer lists the rules of the store.
      operationId: add-automation
      parameters:
        - description: The store; without it, the one hedgehug picks as the CLI does
          explode: false
          in: query
          name: store
          schema:
            description: The store; without it, the one hedgehug picks as the CLI does
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutomationAddInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/RuleView"
                type:
                  - array
                  - "null"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Add a rule, as hh automation add
      tags:
        - automations
  /api/automations/fields:
    get:
      operationId: get-automation-fields
      parameters:
        - description: The store; without it, the one hedgehug picks as the CLI does
          explode: false
          in: query
          name: store
          schema:
            description: The store; without it, the one hedgehug picks as the CLI does
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FieldsView"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Read issue_fields, as hh automation fields
      tags:
        - automations
    patch:
      operationId: update-automation-fields
      parameters:
        - description: The store; without it, the one hedgehug picks as the CLI does
          explode: false
          in: query
          name: store
          schema:
            description: The store; without it, the one hedgehug picks as the CLI does
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutomationFieldsInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FieldsView"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Change issue_fields, as hh automation fields with flags
      tags:
        - automations
  /api/automations/stats:
    get:
      operationId: get-automation-stats
      parameters:
        - description: The store; without it, the one hedgehug picks as the CLI does
          explode: false
          in: query
          name: store
          schema:
            description: The store; without it, the one hedgehug picks as the CLI does
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/RuleStat"
                type:
                  - array
                  - "null"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Count what each rule did in the last 7 days; a rule that did nothing is not listed
      tags:
        - automations
  /api/automations/{id}:
    delete:
      description: The answer lists the rules of the store.
      operationId: delete-automation
      parameters:
        - description: The store; without it, the one hedgehug picks as the CLI does
          explode: false
          in: query
          name: store
          schema:
            description: The store; without it, the one hedgehug picks as the CLI does
            type: string
        - description: The id of the rule
          in: path
          name: id
          required: true
          schema:
            description: The id of the rule
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/RuleView"
                type:
                  - array
                  - "null"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Remove a rule, and its id from every scoped disable, as hh automation rm
      tags:
        - automations
  /api/automations/{id}/enabled:
    put:
      description: The answer lists the rules of the store, or those of the project given.
      operationId: set-automation-enabled
      parameters:
        - description: The store; without it, the one hedgehug picks as the CLI does
          explode: false
          in: query
          name: store
          schema:
            description: The store; without it, the one hedgehug picks as the CLI does
            type: string
        - description: The id of the rule
          in: path
          name: id
          required: true
          schema:
            description: The id of the rule
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutomationEnabledInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/RuleView"
                type:
                  - array
                  - "null"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Turn a rule on or off, as hh automation enable and disable
      tags:
        - automations
  /api/doctor:
    get:
      operationId: doctor
      parameters:
        - description: The store; without it, the one hedgehug picks as the CLI does
          explode: false
          in: query
          name: store
          schema:
            description: The store; without it, the one hedgehug picks as the CLI does
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/DoctorReport"
                type:
                  - array
                  - "null"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Check the store, as hh doctor
      tags:
        - maintenance
  /api/doctor/fix:
    post:
      operationId: doctor-fix
      parameters:
        - description: The store; without it, the one hedgehug picks as the CLI does
          explode: false
          in: query
          name: store
          schema:
