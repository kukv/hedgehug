components:
  schemas:
    AffectedWrite:
      additionalProperties: false
      properties:
        commit:
          type:
            - string
            - "null"
        tasks:
          description: The task and the tasks under it, as they are now
          items:
            $ref: "#/components/schemas/TaskView"
          type:
            - array
            - "null"
        ulids:
          description: The tasks purged
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - commit
      type: object
    CommentEditInputBody:
      additionalProperties: false
      properties:
        body:
          description: The comment in Markdown
          minLength: 1
          type: string
      required:
        - body
      type: object
    CommentInputBody:
      additionalProperties: false
      properties:
        body:
          description: The comment in Markdown
          minLength: 1
          type: string
      required:
        - body
      type: object
    CommentView:
      additionalProperties: false
      properties:
        author:
          type: string
        body:
          type: string
        created:
          format: date-time
          type: string
        ulid:
          type: string
      required:
        - ulid
        - author
        - created
        - body
      type: object
    CommentWrite:
      additionalProperties: false
      properties:
        comment:
          $ref: "#/components/schemas/CommentView"
          description: The comment as written; for a removal, as it was
        commit:
          description: The commit made; null when nothing changed
          type:
            - string
            - "null"
      required:
        - comment
        - commit
      type: object
    Count:
      additionalProperties: false
      properties:
        done:
          format: int64
          type: integer
        total:
          format: int64
          type: integer
      required:
        - done
        - total
      type: object
    CreateInputBody:
      additionalProperties: false
      properties:
        assignees:
          items:
            type: string
          type:
            - array
            - "null"
        kind:
          description: project for hh add --kind project
          type: string
        labels:
          items:
            type: string
          type:
            - array
            - "null"
        parent:
          description: "The parent: an ID or a ULID"
          type: string
        props:
          additionalProperties: {}
          description: Property name to value
          type: object
        status:
          type: string
        title:
          minLength: 1
          type: string
        workspace:
          description: The workspace, by name or prefix
          type: string
      required:
        - title
      type: object
    DoctorReport:
      additionalProperties: false
      properties:
        findings:
          items:
            $ref: "#/components/schemas/Finding"
          type:
            - array
            - "null"
        repaired:
          items:
            $ref: "#/components/schemas/Fixed"
          type:
            - array
            - "null"
        store:
          type: string
      required:
        - store
        - repaired
        - findings
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    Finding:
      additionalProperties: false
      properties:
        check:
          type: string
        hint:
          type: string
        msg:
          type: string
        severity:
          type: string
        where:
          type: string
      required:
        - check
        - where
        - msg
        - severity
      type: object
    FindingsOutputBody:
      additionalProperties: false
      properties:
        findings:
          items:
            $ref: "#/components/schemas/Finding"
          type:
            - array
            - "null"
      required:
        - findings
      type: object
    Fixed:
      additionalProperties: false
      properties:
        author:
          type: string
        id:
          type: string
        kind:
          type: string
        title:
          type: string
        ulid:
          type: string
        value: {}
      required:
        - ulid
        - title
        - kind
        - value
      type: object
    GroupView:
      additionalProperties: false
      properties:
        key:
          description: The value of the group; empty for the tasks with none
          type: string
        ulids:
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - key
        - ulids
      type: object
    HealthOutputBody:
      additionalProperties: false
      properties:
        pid:
          description: The process of the server
          format: int64
          type: integer
        version:
          description: The version of hedgehug
          type: string
      required:
        - version
        - pid
      type: object
    HelloEvent:
      additionalProperties: false
      properties:
        client:
          description: This connection, for PUT /api/presence
          type: string
        stores:
          description: The HEAD and the sync state of each store now
          items:
            $ref: "#/components/schemas/StoreState"
          type:
            - array
            - "null"
        unread:
          format: int64
          type: integer
      required:
        - client
        - stores
        - unread
      type: object
    IdChange:
      additionalProperties: false
      properties:
        new:
          type: string
        old:
          type: string
      required:
        - old
        - new
      type: object
    IndexProblem:
      additionalProperties: false
      properties:
        code:
          type: string
        field:
          type: string
        message:
          type: string
      required:
        - code
        - field
        - message
      type: object
    Item:
      additionalProperties: false
      properties:
        author:
          type: string
        commit:
          type: string
        detail: {}
        id:
          type: string
        kind:
          type: string
        path:
          type: string
        task:
          type: string
        time:
          format: date-time
          type: string
        to:
          type: string
        ulid:
          type: string
      required:
        - ulid
        - kind
        - commit
        - author
        - to
        - time
      type: object
    KindDef:
      additionalProperties: false
      properties:
        default:
          type: boolean
        icon:
          type: string
        label:
          type: string
        name:
          type: string
        parents:
          items:
            type: string
          type:
            - array
            - "null"
        role:
          type: string
        template:
          type: string
      required:
        - name
        - role
        - parents
      type: object
    ListOutputBody:
      additionalProperties: false
      properties:
        cycle:
          description: The tasks in a parent cycle, with tree
          items:
            $ref: "#/components/schemas/TaskView"
          type:
            - array
            - "null"
        groups:
          description: "The groups, when the query has group:"
          items:
            $ref: "#/components/schemas/GroupView"
          type:
            - array
            - "null"
        roots:
          description: The roots of the tree, with tree
          items:
            $ref: "#/components/schemas/TaskView"
          type: array
        tasks:
          description: The tasks found, without tree
          items:
            $ref: "#/components/schemas/TaskView"
          type: array
      type: object
    LogView:
      additionalProperties: false
      properties:
        author:
          $ref: "#/components/schemas/LogViewAuthorStruct"
        date:
          format: date-time
          type: string
        hash:
          type: string
        id:
          type:
            - string
            - "null"
        op:
          type:
            - string
            - "null"
        store:
          type: string
        subject:
          type: string
        task:
          type:
            - string
            - "null"
      required:
        - hash
        - date
        - author
        - store
        - op
        - task
        - id
        - subject
      type: object
    LogViewAuthorStruct:
      additionalProperties: false
      properties:
        email:
          type: string
        name:
          type: string
      required:
        - name
        - email
      type: object
    MigrateInputBody:
      additionalProperties: false
      properties:
        dry_run:
          type: boolean
        new:
          minLength: 1
          type: string
        old:
          minLength: 1
          type: string
        prop:
          description: "With value: the property whose value it is"
          type: string
        target:
          enum:
            - status
            - kind
            - prop
            - value
          type: string
      required:
        - target
        - old
        - new
      type: object
    MigrateOutputBody:
      additionalProperties: false
      properties:
        changed:
          items:
            $ref: "#/components/schemas/TaskView"
          type:
            - array
            - "null"
        commit:
          type:
            - string
            - "null"
        skipped:
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - changed
        - skipped
        - commit
      type: object
    MoveInputBody:
      additionalProperties: false
      properties:
        after:
          description: Put it after this sibling
          type: string
        before:
          description: Put it before this sibling
          type: string
        parent:
          description: "The new parent: an ID or a ULID"
          type: string
        root:
          description: Move to the top, with no parent
          type: boolean
        workspace:
          description: Move to another workspace
          type: string
      type: object
    Notification:
      additionalProperties: false
      properties:
        author:
          type: string
        commit:
          type: string
        detail: {}
        id:
          type: string
        kind:
          type: string
        path:
          type: string
        read:
          type: boolean
        store:
          type: string
        task:
          $ref: "#/components/schemas/Ref"
        time:
          format: date-time
          type: string
        to:
          type: string
        ulid:
          type: string
      required:
        - read
        - store
        - task
        - ulid
        - kind
        - commit
        - author
        - to
        - time
      type: object
    NotificationPatchInputBody:
      additionalProperties: false
      properties:
        read:
          description: true marks it read; items cannot be marked unread
          type: boolean
      required:
        - read
      type: object
    Overwritten:
      additionalProperties: false
      properties:
        author:
          type: string
        field:
          type: string
        id:
          type: string
        notice:
          type: string
        path:
          type: string
        task:
          type: string
        value: {}
      required:
        - path
        - field
        - value
      type: object
    PatchInputBody:
      additionalProperties: false
      properties:
        assignees:
          description: Replaces the assignees
          items:
            type: string
          type: array
        blocked_by:
          description: "Replaces the blockers: IDs or ULIDs"
          items:
            type: string
          type: array
        body:
          description: The body in Markdown
          type: string
        kind:
          type: string
        labels:
          description: Replaces the labels
          items:
            type: string
          type: array
        props:
          additionalProperties: {}
          description: Property name to value; null clears it, a list replaces a multiple value
          type: object
        repos:
          description: Replaces the repos
          items:
            type: string
          type: array
        status:
          type: string
        title:
          type: string
        watchers:
          description: Replaces the watchers
          items:
            type: string
          type: array
      type: object
    PresenceInputBody:
      additionalProperties: false
      properties:
        client:
          description: The client that hello gave
          minLength: 1
          type: string
        visible:
          type: boolean
      required:
        - client
        - visible
      type: object
    Problem:
      additionalProperties: false
      properties:
        args:
          additionalProperties: {}
          description: The arguments of the error, by name
          type: object
        detail:
          description: The message in English, as the CLI prints it
          type: string
        errors:
          description: What was wrong in the request, for request.invalid
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        status:
          format: int64
          type: integer
        title:
          description: The text of the HTTP status
          type: string
        type:
          description: What went wrong, such as task.not_found
          type: string
      required:
        - type
        - title
        - status
      type: object
    PropDef:
      additionalProperties: false
      properties:
        inverse:
          type: string
        label:
          type: string
        multi:
          type: boolean
        symmetric:
          type: boolean
        type:
          type: string
        values:
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - type
      type: object
    Ref:
      additionalProperties: false
      properties:
        id:
          type: string
        title:
          type: string
        ulid:
          type: string
      required:
        - ulid
        - id
        - title
      type: object
    Repaired:
      additionalProperties: false
      properties:
        author:
          type: string
        id:
          type: string
        kind:
          type: string
        ulid:
          type: string
        value: {}
      required:
        - ulid
        - kind
        - value
      type: object
    SavedKanban:
      additionalProperties: false
      properties:
        columns:
          type: string
        swimlane:
          type: string
      required:
        - columns
        - swimlane
      type: object
    SavedTable:
      additionalProperties: false
      properties:
        columns:
          items:
            type: string
          type:
            - array
            - "null"
        group_by:
          type: string
      required:
        - columns
        - group_by
      type: object
    SavedView:
      additionalProperties: false
      properties:
        kanban:
          $ref: "#/components/schemas/SavedKanban"
        layout:
          type: string
        name:
          type: string
        query:
          type: string
        table:
          $ref: "#/components/schemas/SavedTable"
      required:
        - name
        - layout
        - query
        - table
        - kanban
      type: object
    SchemaChanged:
      additionalProperties: false
      properties:
        store:
          type: string
      required:
        - store
      type: object
    SchemaView:
      additionalProperties: false
      properties:
        kinds:
          items:
            $ref: "#/components/schemas/KindDef"
          type:
            - array
            - "null"
        props:
          additionalProperties:
            $ref: "#/components/schemas/PropDef"
          type: object
        scoped:
          items:
            $ref: "#/components/schemas/ScopedDef"
          type:
            - array
            - "null"
        statuses:
          items:
            $ref: "#/components/schemas/StatusDef"
          type:
            - array
            - "null"
        workflow:
          $ref: "#/components/schemas/WorkflowDef"
      required:
        - statuses
        - kinds
        - props
        - workflow
        - scoped
      type: object
    ScopedDef:
      additionalProperties: false
      properties:
        statuses:
          items:
            type: string
          type:
            - array
            - "null"
        templates:
          $ref: "#/components/schemas/TemplatesDef"
        where:
          type: string
        workflow:
          $ref: "#/components/schemas/WorkflowDef"
      required:
        - where
      type: object
    ShowView:
      additionalProperties: false
      properties:
        assignees:
          items:
            type: string
          type:
            - array
            - "null"
        blocked_by:
          items:
            $ref: "#/components/schemas/Ref"
          type:
            - array
            - "null"
        body:
          type: string
        broken:
          type: string
        checklist:
          $ref: "#/components/schemas/Count"
        children:
          items:
            $ref: "#/components/schemas/TaskView"
          type:
            - array
            - "null"
        comments:
          items:
            $ref: "#/components/schemas/CommentView"
          type:
            - array
            - "null"
        context:
          type: boolean
        created:
          format: date-time
          type: string
        deleted_at:
          format: date-time
          type:
            - string
            - "null"
        former_ids:
          items:
            type: string
          type:
            - array
            - "null"
        history:
          items:
            $ref: "#/components/schemas/LogView"
          type:
            - array
            - "null"
        id:
          type: string
        in_cycle:
          type: boolean
        kind:
          type: string
        labels:
          items:
            type: string
          type:
            - array
            - "null"
        parent:
          type:
            - string
            - "null"
        problems:
          items:
            $ref: "#/components/schemas/IndexProblem"
          type:
            - array
            - "null"
        progress:
          $ref: "#/components/schemas/Count"
        props:
          additionalProperties: {}
          type: object
        rank:
          type: string
        referenced_by:
          items:
            $ref: "#/components/schemas/Ref"
          type:
            - array
            - "null"
        repos:
          items:
            type: string
          type:
            - array
            - "null"
        reverse:
          additionalProperties:
            items:
              $ref: "#/components/schemas/Ref"
            type:
              - array
              - "null"
          type: object
        status:
          type: string
        store:
          type: string
        title:
          type: string
        ulid:
          type: string
        updated:
          format: date-time
          type: string
        watchers:
          items:
            type: string
          type:
            - array
            - "null"
        workspace:
          $ref: "#/components/schemas/WorkspaceRef"
      required:
        - body
        - watchers
        - repos
        - comments
        - reverse
        - referenced_by
        - history
        - ulid
        - id
        - store
        - workspace
        - kind
        - title
        - parent
        - rank
        - status
        - assignees
        - labels
        - blocked_by
        - props
        - created
        - updated
        - deleted_at
        - problems
      type: object
    StatusDef:
      additionalProperties: false
      properties:
        category:
          type: string
        color:
          type: string
        default:
          type: boolean
        label:
          type: string
        name:
          type: string
      required:
        - name
        - category
      type: object
    StoreInitInputBody:
      additionalProperties: false
      properties:
        account:
          type: string
        name:
          type: string
        prefix:
          type: string
        remotes:
          items:
            type: string
          type:
            - array
            - "null"
        workspace:
          description: The name of the first workspace; the name of the store without it
          type: string
      required:
        - name
        - prefix
      type: object
    StoreInitOutputBody:
      additionalProperties: false
      properties:
        name:
          type: string
        path:
          type: string
        pushed:
          items:
            type: string
          type:
            - array
            - "null"
        remotes:
          items:
            type: string
          type:
            - array
            - "null"
        workspace:
          $ref: "#/components/schemas/WorkspaceView"
      required:
        - name
        - path
        - workspace
        - remotes
        - pushed
      type: object
    StoreItem:
      additionalProperties: false
      properties:
        account:
          type: string
        default:
          description: The store hedgehug picks without --store
          type: boolean
        last_success:
          format: date-time
          type: string
        name:
          type: string
        path:
          type: string
        remotes:
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - default
        - name
        - path
        - remotes
      type: object
    StoreState:
      additionalProperties: false
      properties:
        head:
          type: string
        store:
          type: string
        sync:
          $ref: "#/components/schemas/SyncStatus"
      required:
        - store
        - head
        - sync
      type: object
    SyncReport:
      additionalProperties: false
      properties:
        error:
          type: string
        invalid:
          items:
            type: string
          type:
            - array
            - "null"
        merges:
          format: int64
          type: integer
        no_remote:
          type: boolean
        notices:
          items:
            $ref: "#/components/schemas/Item"
          type:
            - array
            - "null"
        overwritten:
          items:
            $ref: "#/components/schemas/Overwritten"
          type:
            - array
            - "null"
        pushed:
          items:
            type: string
          type:
            - array
            - "null"
        repaired:
          items:
            $ref: "#/components/schemas/Repaired"
          type:
            - array
            - "null"
        store:
          type: string
        unpushable:
          format: int64
          type: integer
        warnings:
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - store
        - merges
        - pushed
        - overwritten
        - repaired
        - invalid
        - notices
        - warnings
      type: object
    SyncStatus:
      additionalProperties: false
      properties:
        error:
          type: string
        last_attempt:
          format: date-time
          type: string
        last_error:
          type: string
        last_success:
          format: date-time
          type: string
        next_fetch:
          description: When the loop fetches next; absent before its first sync
          format: date-time
          type: string
        pending_since:
          format: date-time
          type: string
        read_only:
          type: string
        remotes:
          items:
            type: string
          type:
            - array
            - "null"
        store:
          type: string
        unpushed:
          format: int64
          type: integer
      required:
        - store
        - remotes
      type: object
    TaskView:
      additionalProperties: false
      properties:
        assignees:
          items:
            type: string
          type:
            - array
            - "null"
        blocked_by:
          items:
            $ref: "#/components/schemas/Ref"
          type:
            - array
            - "null"
        broken:
          type: string
        checklist:
          $ref: "#/components/schemas/Count"
        children:
          items:
            $ref: "#/components/schemas/TaskView"
          type:
            - array
            - "null"
        context:
          type: boolean
        created:
          format: date-time
          type: string
        deleted_at:
          format: date-time
          type:
            - string
            - "null"
        former_ids:
          items:
            type: string
          type:
            - array
            - "null"
        id:
          type: string
        in_cycle:
          type: boolean
        kind:
          type: string
        labels:
          items:
            type: string
          type:
            - array
            - "null"
        parent:
          type:
            - string
            - "null"
        problems:
          items:
            $ref: "#/components/schemas/IndexProblem"
          type:
            - array
            - "null"
        progress:
          $ref: "#/components/schemas/Count"
        props:
          additionalProperties: {}
          type: object
        rank:
          type: string
        status:
          type: string
        store:
          type: string
        title:
          type: string
        ulid:
          type: string
        updated:
          format: date-time
          type: string
        workspace:
          $ref: "#/components/schemas/WorkspaceRef"
      required:
        - ulid
        - id
        - store
        - workspace
        - kind
        - title
        - parent
        - rank
        - status
        - assignees
        - labels
        - blocked_by
        - props
        - created
        - updated
        - deleted_at
        - problems
      type: object
    TaskWrite:
      additionalProperties: false
      properties:
        commit:
          description: The commit made; null when nothing changed
          type:
            - string
            - "null"
        note:
          description: What restore at a commit has to say, as hh restore --at prints it
          type: string
        task:
          $ref: "#/components/schemas/TaskView"
      required:
        - task
        - commit
      type: object
    TasksChanged:
      additionalProperties: false
      properties:
        author:
          description: The Hedgehug-Author of HEAD; empty when unknown
          type: string
        commit:
          description: HEAD now
          type: string
        op:
          description: The Hedgehug-Op of HEAD; empty for a commit made by hand
          type: string
        removed:
          description: The tasks whose file is gone (purged)
          items:
            type: string
          type:
            - array
            - "null"
        store:
          type: string
        ulids:
          description: The tasks whose file or comments changed
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - store
        - ulids
        - removed
        - commit
        - op
        - author
      type: object
    TemplatesDef:
      additionalProperties: false
      properties:
        default:
          additionalProperties:
            type: string
          type: object
        only:
          items:
            type: string
          type:
            - array
            - "null"
      type: object
    UndoKept:
      additionalProperties: false
      properties:
        author:
          type: string
        field:
          type: string
        path:
          type: string
        task:
          description: The ID of the task; empty for other files
          type: string
      required:
        - path
        - field
        - author
      type: object
    UndoWrite:
      additionalProperties: false
      properties:
        commit:
          type:
            - string
            - "null"
        kept:
          description: What others changed after it, which undo kept
          items:
            $ref: "#/components/schemas/UndoKept"
          type:
            - array
            - "null"
        undone:
          $ref: "#/components/schemas/LogView"
          description: The commit taken back
      required:
        - undone
        - commit
        - kept
      type: object
    UnreadEvent:
      additionalProperties: false
      properties:
        count:
          description: The items not read, in every store
          format: int64
          type: integer
      required:
        - count
      type: object
    ViewRenameInputBody:
      additionalProperties: false
      properties:
        name:
          description: The new name
          type: string
      required:
        - name
      type: object
    ViewSaveInputBody:
      additionalProperties: false
      properties:
        columns:
          description: The columns of the table
          items:
            type: string
          type: array
        group_by:
          type: string
        kanban_columns:
          type: string
        layout:
          enum:
            - tree
            - table
            - kanban
          type: string
        query:
          type: string
        swimlane:
          type: string
      type: object
    ViewWrite:
      additionalProperties: false
      properties:
        commit:
          type:
            - string
            - "null"
        view:
          $ref: "#/components/schemas/SavedView"
      required:
        - view
        - commit
      type: object
    ViewsChanged:
      additionalProperties: false
      properties:
        store:
          type: string
      required:
        - store
      type: object
    WorkflowDef:
      additionalProperties: false
      properties:
        required:
          additionalProperties:
            items:
              type: string
            type:
              - array
              - "null"
          type: object
        transitions:
          additionalProperties:
            items:
              type: string
            type:
              - array
              - "null"
          type: object
      required:
        - transitions
        - required
      type: object
    WorkspaceAddInputBody:
      additionalProperties: false
      properties:
        name:
          type: string
        prefix:
          type: string
      required:
        - name
        - prefix
      type: object
    WorkspacePatchInputBody:
      additionalProperties: false
      properties:
        name:
          description: A new name; give it or prefix, not both
          type: string
        prefix:
          description: A new prefix, which renumbers the tasks
          type: string
      type: object
    WorkspaceRef:
      additionalProperties: false
      properties:
        id_prefix:
          type: string
        name:
          type: string
        ulid:
          type: string
      required:
        - ulid
        - name
        - id_prefix
      type: object
    WorkspaceView:
      additionalProperties: false
      properties:
        id_prefix:
          type: string
        name:
          type: string
        prefix_set:
          format: date-time
          type: string
        tasks:
          format: int64
          type: integer
        ulid:
          type: string
      required:
        - ulid
        - name
        - id_prefix
        - prefix_set
        - tasks
      type: object
    WorkspaceWrite:
      additionalProperties: false
      properties:
        commit:
          type:
            - string
            - "null"
        ids:
          description: "With a new prefix: the IDs the tasks had and have now"
          items:
            $ref: "#/components/schemas/IdChange"
          type:
            - array
            - "null"
        workspace:
          $ref: "#/components/schemas/WorkspaceView"
      required:
        - workspace
        - commit
      type: object
  securitySchemes:
    bearer:
      scheme: bearer
      type: http
info:
  title: Hedgehug
  version: "1"
openapi: 3.1.0
paths:
  /api/activity:
    get:
      operationId: list-activity
      parameters:
        - description: The store; without it, the one hedgehug picks as the CLI does
          explode: false
          in: query
          name: store
          schema:
            description: The store; without it, the one hedgehug picks as the CLI does
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            default: 100
            format: int64
            maximum: 1000
            minimum: 1
            type: integer
        - description: Only the commits of this account (its ID)
          explode: false
          in: query
          name: author
          schema:
            description: Only the commits of this account (its ID)
            type: string
        - description: "only: the merges and repairs of syncs; exclude: all but them"
          explode: false
          in: query
          name: sync
          schema:
            description: "only: the merges and repairs of syncs; exclude: all but them"
            enum:
              - only
              - exclude
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/LogView"
                type:
                  - array
                  - "null"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: List the commits of the store, newest first, as hh log
      tags:
        - activity
  /api/doctor:
    get:
      operationId: doctor
      parameters:
        - description: The store; without it, the one hedgehug picks as the CLI does
          explode: false
          in: query
          name: store
          schema:
            description: The store; without it, the one hedgehug picks as the CLI does
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/DoctorReport"
                type:
                  - array
                  - "null"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Check the store, as hh doctor
      tags:
        - maintenance
  /api/doctor/fix:
    post:
      operationId: doctor-fix
      parameters:
        - description: The store; without it, the one hedgehug picks as the CLI does
          explode: false
          in: query
          name: store
          schema:
            description: The store; without it, the one hedgehug picks as the CLI does
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/DoctorReport"
                type:
                  - array
                  - "null"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Check the store and repair what can be, as hh doctor --fix
      tags:
        - maintenance
  /api/events:
    get:
      operationId: events
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                description: Each oneOf object in the array represents one possible Server Sent Events (SSE) message, serialized as UTF-8 text according to the SSE specification.
                items:
                  oneOf:
                    - properties:
                        data:
                          $ref: "#/components/schemas/HelloEvent"
                        event:
                          const: hello
                          description: The event name.
                          type: string
                        id:
                          description: The event ID.
                          oneOf:
                            - type: integer
                            - type: string
                        retry:
                          description: The retry time in milliseconds.
                          type: integer
                      required:
                        - data
                        - event
                      title: Event hello
                      type: object
                    - properties:
                        data:
                          $ref: "#/components/schemas/UnreadEvent"
                        event:
                          const: notifications.unread
                          description: The event name.
                          type: string
                        id:
                          description: The event ID.
                          oneOf:
                            - type: integer
                            - type: string
                        retry:
                          description: The retry time in milliseconds.
                          type: integer
                      required:
                        - data
                        - event
                      title: Event notifications.unread
                      type: object
                    - properties:
                        data:
                          $ref: "#/components/schemas/SchemaChanged"
                        event:
                          const: schema.changed
                          description: The event name.
                          type: string
                        id:
                          description: The event ID.
                          oneOf:
                            - type: integer
                            - type: string
                        retry:
                          description: The retry time in milliseconds.
                          type: integer
                      required:
                        - data
                        - event
                      title: Event schema.changed
                      type: object
                    - properties:
                        data:
                          $ref: "#/components/schemas/SyncStatus"
                        event:
                          const: sync.state
                          description: The event name.
                          type: string
                        id:
                          description: The event ID.
                          oneOf:
                            - type: integer
                            - type: string
                        retry:
                          description: The retry time in milliseconds.
                          type: integer
                      required:
                        - data
                        - event
                      title: Event sync.state
                      type: object
                    - properties:
                        data:
                          $ref: "#/components/schemas/TasksChanged"
                        event:
                          const: tasks.changed
                          description: The event name.
                          type: string
                        id:
                          description: The event ID.
                          oneOf:
                            - type: integer
                            - type: string
                        retry:
                          description: The retry time in milliseconds.
                          type: integer
                      required:
                        - data
                        - event
                      title: Event tasks.changed
                      type: object
                    - properties:
                        data:
                          $ref: "#/components/schemas/ViewsChanged"
                        event:
                          const: views.changed
                          description: The event name.
                          type: string
                        id:
                          description: The event ID.
                          oneOf:
                            - type: integer
                            - type: string
                        retry:
                          description: The retry time in milliseconds.
                          type: integer
                      required:
                        - data
                        - event
                      title: Event views.changed
                      type: object
                title: Server Sent Events
                type: array
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: The changes, as server-sent events; hello comes first
      tags:
        - events
  /api/health:
    get:
      operationId: get-health
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Check that the server is up
      tags:
        - server
  /api/notifications:
    get:
      operationId: list-notifications
      parameters:
        - description: Include the items read
          explode: false
          in: query
          name: all
          schema:
            description: Include the items read
            type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Notification"
                type:
                  - array
                  - "null"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: List the inbox of every store, newest first, as hh inbox
      tags:
        - notifications
  /api/notifications/{id}:
    patch:
      operationId: update-notification
      parameters:
        - description: The ULID of the item
          in: path
          name: id
          required: true
          schema:
            description: The ULID of the item
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationPatchInputBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Mark an item read, as hh inbox read
      tags:
        - notifications
  /api/notifications/{id}/revert:
    post:
      operationId: revert-notification
      parameters:
        - description: The ULID of the item
          in: path
          name: id
          required: true
          schema:
            description: The ULID of the item
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskWrite"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Write my overwritten value back, as hh inbox revert
      tags:
        - notifications
  /api/presence:
    put:
      operationId: set-presence
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresenceInputBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Tell whether a tab shows the GUI
      tags:
        - sync
  /api/schema:
    get:
      operationId: get-schema
      parameters:
        - description: The store; without it, the one hedgehug picks as the CLI does
          explode: false
          in: query
          name: store
          schema:
            description: The store; without it, the one hedgehug picks as the CLI does
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchemaView"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Show schema.yaml
      tags:
        - schema
  /api/schema/check:
    get:
      operationId: check-schema
      parameters:
        - description: The store; without it, the one hedgehug picks as the CLI does
          explode: false
          in: query
          name: store
          schema:
            description: The store; without it, the one hedgehug picks as the CLI does
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindingsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Check the schema and the tasks, as hh schema check
      tags:
        - schema
  /api/schema/migrate:
    post:
      operationId: migrate-schema
      parameters:
        - description: The store; without it, the one hedgehug picks as the CLI does
          explode: false
          in: query
          name: store
          schema:
            description: The store; without it, the one hedgehug picks as the CLI does
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MigrateInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigrateOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Rename or merge a status, kind, property or value, as hh migrate
      tags:
        - schema
  /api/stores:
    get:
      operationId: list-stores
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/StoreItem"
                type:
                  - array
                  - "null"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: List the stores, as hh store list
      tags:
        - stores
    post:
      operationId: init-store
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreInitInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreInitOutputBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Make a store, as hh store init
      tags:
        - stores
  /api/sync:
    get:
      operationId: get-sync
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/SyncStatus"
                type:
                  - array
                  - "null"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: How the syncs went, as hh sync --status
      tags:
        - sync
    post:
      operationId: sync
      parameters:
        - description: The store; without it, the one hedgehug picks as the CLI does
          explode: false
          in: query
          name: store
          schema:
            description: The store; without it, the one hedgehug picks as the CLI does
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/SyncReport"
                type:
                  - array
                  - "null"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: "Sync now: the store given, or every store with a remote, as hh sync"
      tags:
        - sync
  /api/tasks:
    get:
      operationId: list-tasks
      parameters:
        - description: The store; without it, the one hedgehug picks as the CLI does
          explode: false
          in: query
          name: store
          schema:
            description: The store; without it, the one hedgehug picks as the CLI does
            type: string
        - description: The query, as hh ls takes it; empty for every task
          explode: false
          in: query
          name: q
          schema:
            description: The query, as hh ls takes it; empty for every task
            type: string
        - description: Return the tasks as a tree, as hh ls --tree
          explode: false
          in: query
          name: tree
          schema:
            description: Return the tasks as a tree, as hh ls --tree
            type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: List the tasks a query finds
      tags:
        - tasks
    post:
      operationId: create-task
      parameters:
        - description: The store; without it, the one hedgehug picks as the CLI does
          explode: false
          in: query
          name: store
          schema:
            description: The store; without it, the one hedgehug picks as the CLI does
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskWrite"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Add a task, as hh add
      tags:
        - tasks
  /api/tasks/{id}:
    delete:
      operationId: delete-task
      parameters:
        - description: The store; without it, the one hedgehug picks as the CLI does
          explode: false
          in: query
          name: store
          schema:
            description: The store; without it, the one hedgehug picks as the CLI does
            type: string
        - description: The ID, a former ID, or the ULID of the task
          in: path
          name: id
          required: true
          schema:
            description: The ID, a former ID, or the ULID of the task
            type: string
        - description: Remove the files for good; the task must be deleted already
          explode: false
          in: query
          name: purge
          schema:
            description: Remove the files for good; the task must be deleted already
            type: boolean
        - description: "With purge: the ULIDs the user agreed to purge, comma-separated, as purge.unconfirmed listed them"
          explode: false
          in: query
          name: confirm
          schema:
            description: "With purge: the ULIDs the user agreed to purge, comma-separated, as purge.unconfirmed listed them"
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AffectedWrite"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Delete a task and the tasks under it (hh rm), or purge them (hh purge)
      tags:
        - tasks
    get:
      operationId: get-task
      parameters:
        - description: The store; without it, the one hedgehug picks as the CLI does
          explode: false
          in: query
          name: store
          schema:
            description: The store; without it, the one hedgehug picks as the CLI does
            type: string
        - description: The ID, a former ID, or the ULID of the task
          in: path
          name: id
          required: true
          schema:
            description: The ID, a former ID, or the ULID of the task
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShowView"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Show a task, as hh show
      tags:
        - tasks
    patch:
      operationId: update-task
      parameters:
        - description: The store; without it, the one hedgehug picks as the CLI does
          explode: false
          in: query
          name: store
          schema:
            description: The store; without it, the one hedgehug picks as the CLI does
            type: string
        - description: The ID, a former ID, or the ULID of the task
          in: path
          name: id
          required: true
          schema:
            description: The ID, a former ID, or the ULID of the task
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskWrite"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Change the fields sent, in one commit, as hh set and hh edit
      tags:
        - tasks
  /api/tasks/{id}/comments:
    post:
      operationId: add-comment
      parameters:
        - description: The store; without it, the one hedgehug picks as the CLI does
          explode: false
          in: query
          name: store
          schema:
            description: The store; without it, the one hedgehug picks as the CLI does
            type: string
        - description: The ID, a former ID, or the ULID of the task
          in: path
          name: id
          required: true
          schema:
            description: The ID, a former ID, or the ULID of the task
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentWrite"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Add a comment, as hh comment add
      tags:
        - comments
  /api/tasks/{id}/comments/{cid}:
    delete:
      operationId: remove-comment
      parameters:
        - description: The store; without it, the one hedgehug picks as the CLI does
          explode: false
          in: query
          name: store
          schema:
            description: The store; without it, the one hedgehug picks as the CLI does
            type: string
        - description: The ID, a former ID, or the ULID of the task
          in: path
          name: id
          required: true
          schema:
            description: The ID, a former ID, or the ULID of the task
            type: string
        - description: The ULID of the comment
          in: path
          name: cid
