name: github-live

# 実際の GitHub に対して、Hedgehug の GraphQL のクエリが通ることを確かめる。
# 検証用 Org の固定のリポジトリ hh-live を読む。ほかに、開いている issue にコメントを 1 件作って消す。
# そのため、トークンには issue の書き込み権限が要る。
# 変数 HEDGEHUG_LIVE_ORG と secret の HEDGEHUG_LIVE_TOKEN が未設定なら、手順を実行せずに成功する。
# トークンは job の env に置かず、テストの step にだけ渡す。

on:
  schedule:
    - cron: "0 3 * * 1" # 週次
  workflow_dispatch:

permissions: {}

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      HEDGEHUG_LIVE_ON: ${{ vars.HEDGEHUG_LIVE_ORG != '' && secrets.HEDGEHUG_LIVE_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HEDGEHUG_LIVE_ON == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: env.HEDGEHUG_LIVE_ON == 'true'
        with:
          go-version-file: go.mod

      - name: Run the live tests against GitHub
        if: env.HEDGEHUG_LIVE_ON == 'true'
        env:
          HEDGEHUG_LIVE_ORG: ${{ vars.HEDGEHUG_LIVE_ORG }}
          HEDGEHUG_LIVE_TOKEN: ${{ secrets.HEDGEHUG_LIVE_TOKEN }}
        run: go test -tags live -count=1 -run 'TestLiveQueries|TestLiveIssueComments' ./internal/lib/github
