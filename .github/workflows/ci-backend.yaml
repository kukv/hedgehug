name: CI (backend)

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The same build everywhere as on a developer's machine (mise.toml): without
# -trimpath the build cache keys the packages by their directory.
env:
  GOFLAGS: -trimpath

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # golangci-lint の時間の大半は、パッケージを読み込むためのビルド（依存を含む）。
      # テストと同じく Go のビルドキャッシュとモジュールキャッシュを使い、保存は main への push だけで行う。
      - name: Locate Go caches
        id: go-env
        run: |
          echo "gocache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "gomodcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: go-cache
        with:
          path: |
            ${{ steps.go-env.outputs.gocache }}
            ${{ steps.go-env.outputs.gomodcache }}
          key: go-${{ runner.os }}-${{ runner.arch }}-lint-${{ hashFiles('go.mod', 'go.sum') }}

      - name: Verify the module cache
        run: go mod verify

      - name: Verify go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      # The lint cache is saved on a push to main only, as the Go caches are,
      # so that a pull request cannot poison what main reads.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          skip-save-cache: ${{ github.event_name != 'push' }}

      - name: Format check
        run: golangci-lint fmt --diff ./...

      # タグ e2e のときだけビルドされるファイルは、上の lint と test ジョブでは検査されないので、ここで検査する。
      - name: Vet the e2e build
        run: go vet -tags e2e ./cmd/hedgehug

      - name: Lint the e2e build
        run: golangci-lint run --build-tags e2e ./cmd/...

      - name: Test the e2e build
        run: go test -count=1 -tags e2e ./cmd/hedgehug

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && steps.go-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ${{ steps.go-env.outputs.gocache }}
            ${{ steps.go-env.outputs.gomodcache }}
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  # hedgehug は Linux と macOS 向けに配る（Windows では WSL で Linux 版を使う）。
  # データの置き場所やファイルシステムが OS ごとに違うので、テストは2つの OS で回す。
  # 1つのジョブでは CPU 律速になるので、1ジョブ3分を目安にテストを shard に分けて同時に回す。
  test-shard:
    name: test (${{ matrix.os }}, ${{ matrix.shard }})
    strategy:
      # 1つの shard の失敗で、ほかの結果を隠さない。
      fail-fast: false
      matrix:
        # -race はテストを数倍遅くする。検出するデータ競合は OS によらないので、
        # ubuntu だけで付ける。カバレッジとテストの結果も ubuntu の分をまとめる。
        # 時間が延びたら、下の Package times を見て shard に分ける。
        include:
          - os: ubuntu-latest
            shard: all
            race: -race
            report: true
          - os: macos-latest
            shard: all
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # mise.toml に固定したツールのうち gotestsum だけを入れる。Node と pnpm は GUI のジョブ用で、
      # ここで入れると shard のジョブがそれぞれ遅くなる。Renovate の mise manager がバージョンを追う。
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install_args: github:gotestyourself/gotestsum

      # Go のビルドキャッシュとモジュールキャッシュを復元する。キャッシュポイズニングを避けるため、
      # 保存は main への push だけで行い（PR は復元のみ）、復元したモジュールは go mod verify で確かめる。
      # shard ごとにビルドするパッケージが違うので、キーに shard を入れる。キャッシュは同じキーでは
      # 保存し直されないので、shard の分け方が変わったら作り直すようにワークフローのハッシュも入れる。
      - name: Locate Go caches
        id: go-env
        shell: bash
        run: |
          echo "gocache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "gomodcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: go-cache
        with:
          path: |
            ${{ steps.go-env.outputs.gocache }}
            ${{ steps.go-env.outputs.gomodcache }}
          key: go-${{ runner.os }}-${{ runner.arch }}-test${{ matrix.race }}-${{ matrix.shard }}-${{ hashFiles('go.mod', 'go.sum', '.github/workflows/ci-backend.yaml') }}

      - name: Verify the module cache
        run: go mod verify

      # 復元したキャッシュには main のテスト結果も入っているので、-count=1 で毎回テストを実行する。
      - name: Test
        shell: bash
        env:
          RACE: ${{ matrix.race }}
          REPORT: ${{ matrix.report }}
          SHARD: ${{ matrix.shard }}
        run: |
          args=("./...")
          cover=()
          if [ -n "$REPORT" ]; then cover=(-coverprofile="coverage-$SHARD.out" -covermode=atomic); fi
          gotestsum --format testdox --junitfile "test-report-$SHARD.xml" --jsonfile "test-$SHARD.json" -- \
            ${RACE:+"$RACE"} -count=1 "${cover[@]}" "${args[@]}"

      # パッケージごとの時間を手順の要約とログに出す。shard の分け方を均すときに使う。
      # Test がファイルを書く前に落ちたときは何も出さない（shard はすでに赤い）。
      - name: Package times
        if: ${{ !cancelled() }}
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          [ -f "test-$SHARD.json" ] || exit 0
          {
            echo "| seconds | package |"
            echo "| ---: | --- |"
            jq -r 'select(.Test == null and (.Action == "pass" or .Action == "fail")) | "\(.Elapsed)\t\(.Package)"' "test-$SHARD.json" |
              sort -rn | awk -F'\t' '{ printf "| %s | %s |\n", $1, $2 }'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && steps.go-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ${{ steps.go-env.outputs.gocache }}
            ${{ steps.go-env.outputs.gomodcache }}
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && matrix.report }}
        with:
          name: test-results-${{ matrix.shard }}
          path: |
            test-report-${{ matrix.shard }}.xml
            coverage-${{ matrix.shard }}.out
          retention-days: 1
          if-no-files-found: ignore

  # 必須チェックにするのはこのジョブだけ。shard の数や分け方を変えても名前は変わらない。
  # ubuntu の shard の結果とカバレッジを1つにまとめて投稿し、どれかの shard が
  # 失敗・取り消しになっていれば失敗する。
  test:
    needs: test-shard
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ !cancelled() }}
        with:
          pattern: test-results-*
          merge-multiple: true

      # go test のカバレッジのファイルは、先頭の mode の行のあとに行を並べただけなので、
      # 2つ目以降の mode の行を除いてつなげば1つになる。
      - name: Merge the coverage
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          shopt -s nullglob
          files=(coverage-*.out)
          if [ ${#files[@]} -eq 0 ]; then exit 0; fi
          { echo "mode: atomic"; for f in "${files[@]}"; do tail -n +2 "$f"; done; } > coverage.out

      # 書き込めない GITHUB_TOKEN の PR（fork と Dependabot）では投稿が失敗して CI が赤くなるため、
      # 同じリポジトリの PR だけで投稿する。
      - name: Test Report
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
        with:
          name: Test Report
          path: test-report-*.xml
          reporter: java-junit

      - name: Report coverage
        uses: k1LoW/octocov-action@a167dc0dee441b7ffc45e1b862ab55ec0d87f278 # v1.5.2
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}

      - name: Every shard passed
        env:
          RESULT: ${{ needs.test-shard.result }}
        run: test "$RESULT" = success

  # Hedgehug は git なしで動く（親設計の「外部依存ゼロ」）。git を PATH から外して全テストを流し、
  # どこかが git の実行ファイルを呼ぶようになったらここで気付く。
  test-without-git:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # mise.toml に固定したツールのうち gotestsum だけを入れる。Node と pnpm は GUI のジョブ用で、
      # ここで入れると shard のジョブがそれぞれ遅くなる。Renovate の mise manager がバージョンを追う。
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install_args: github:gotestyourself/gotestsum

      # キャッシュの扱いは test ジョブと同じ。
      - name: Locate Go caches
        id: go-env
        run: |
          echo "gocache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "gomodcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: go-cache
        with:
          path: |
            ${{ steps.go-env.outputs.gocache }}
            ${{ steps.go-env.outputs.gomodcache }}
          key: go-${{ runner.os }}-${{ runner.arch }}-nogit-${{ hashFiles('go.mod', 'go.sum') }}

      - name: Verify the module cache
        run: go mod verify

      - name: Test with no git on PATH
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/nogit"
          ln -s "$(command -v go)" "$RUNNER_TEMP/nogit/go"
          ln -s "$(mise which gotestsum)" "$RUNNER_TEMP/nogit/gotestsum"
          if PATH="$RUNNER_TEMP/nogit" command -v git; then exit 1; fi
          CGO_ENABLED=0 PATH="$RUNNER_TEMP/nogit" gotestsum --format testdox -- -count=1 ./...

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && steps.go-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ${{ steps.go-env.outputs.gocache }}
            ${{ steps.go-env.outputs.gomodcache }}
          key: ${{ steps.go-cache.outputs.cache-primary-key }}
