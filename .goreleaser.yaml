version: 2

before:
  hooks:
    - go mod tidy
    # The binaries embed web/dist. It is not in git, so build it here, and
    # write THIRD_PARTY_LICENSES from what the binaries contain.
    - make licenses

builds:
  - id: hedgehug
    main: ./cmd/hedgehug
    binary: hedgehug
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Tag}}

  - id: hh
    main: ./cmd/hedgehug
    binary: hh
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Tag}}

archives:
  - formats: [tar.gz]
    files:
      - README.md
      - README.ja.md
      - LICENSE*
      - THIRD_PARTY_LICENSES

checksum:
  name_template: checksums.txt

release:
  prerelease: auto

changelog:
  use: github-native
