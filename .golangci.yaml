version: "2"

linters:
  default: standard
  enable:
    - revive
    - gosec
    - misspell
    - gocritic
    - bodyclose
    - unconvert
    - unparam
    - forbidigo
    - depguard
  settings:
    depguard:
      rules:
        # cli と server は usecase を通す（spec 4.2）。テストも同じ（決定 11）。
        # テスト用の部品（決定 12）は許す。
        entry:
          list-mode: lax
          files:
            - "**/internal/app/cli/**"
            - "**/internal/app/server/**"
          allow:
            - github.com/kukv/hedgehug/internal/lib/gitrepo/gitrepotest
            - github.com/kukv/hedgehug/internal/app/storage/history/historytest
            - github.com/kukv/hedgehug/internal/app/storage/mount/mounttest
          deny:
            - pkg: github.com/kukv/hedgehug/internal/app/storage
              desc: cli と server は usecase を通す（spec 4.2）
            - pkg: github.com/kukv/hedgehug/internal/app/remote
              desc: cli と server は usecase を通す（spec 4.2）
            - pkg: github.com/kukv/hedgehug/internal/lib/gitrepo
              desc: cli と server は usecase を通す（spec 4.2）
            - pkg: github.com/kukv/hedgehug/internal/lib/github
              desc: cli と server は usecase を通す（spec 4.2）
        # 層の向き（spec 決定 2）: lib → domain → storage → remote → usecase → cli・server。
        # 各層は自分・下の層・lib だけを import する。テストも同じ（spec 5 節）。
        # テスト用の部品（決定 12）は、どの層のテストからも import してよい。
        lib:
          list-mode: lax
          files:
            - "**/internal/lib/**"
          allow:
            - github.com/kukv/hedgehug/internal/app/storage/history/historytest
            - github.com/kukv/hedgehug/internal/app/storage/mount/mounttest
            - github.com/kukv/hedgehug/internal/app/usecase/usecasetest
          deny:
            - pkg: github.com/kukv/hedgehug/internal/app
              desc: lib は hedgehug を知らない（spec 決定 1）
        domain:
          list-mode: lax
          files:
            - "**/internal/app/domain/**"
          allow:
            - github.com/kukv/hedgehug/internal/app/storage/history/historytest
            - github.com/kukv/hedgehug/internal/app/storage/mount/mounttest
            - github.com/kukv/hedgehug/internal/app/usecase/usecasetest
          deny:
            - pkg: github.com/kukv/hedgehug/internal/app/storage
              desc: domain は storage より下の層（spec 決定 2）
            - pkg: github.com/kukv/hedgehug/internal/app/remote
              desc: domain は remote より下の層（spec 決定 2）
            - pkg: github.com/kukv/hedgehug/internal/app/usecase
              desc: domain は usecase より下の層（spec 決定 2）
            - pkg: github.com/kukv/hedgehug/internal/app/cli
              desc: domain は cli より下の層（spec 決定 2）
            - pkg: github.com/kukv/hedgehug/internal/app/server
              desc: domain は server より下の層（spec 決定 2）
        storage:
          list-mode: lax
          files:
            - "**/internal/app/storage/**"
          allow:
            - github.com/kukv/hedgehug/internal/app/usecase/usecasetest
          deny:
            - pkg: github.com/kukv/hedgehug/internal/app/remote
              desc: storage は remote より下の層（spec 決定 2）
            - pkg: github.com/kukv/hedgehug/internal/app/usecase
              desc: storage は usecase より下の層（spec 決定 2）
            - pkg: github.com/kukv/hedgehug/internal/app/cli
              desc: storage は cli より下の層（spec 決定 2）
            - pkg: github.com/kukv/hedgehug/internal/app/server
              desc: storage は server より下の層（spec 決定 2）
        remote:
          list-mode: lax
          files:
            - "**/internal/app/remote/**"
          allow:
            - github.com/kukv/hedgehug/internal/app/usecase/usecasetest
          deny:
            - pkg: github.com/kukv/hedgehug/internal/app/usecase
              desc: remote は usecase より下の層（spec 決定 2）
            - pkg: github.com/kukv/hedgehug/internal/app/cli
              desc: remote は cli より下の層（spec 決定 2）
            - pkg: github.com/kukv/hedgehug/internal/app/server
              desc: remote は server より下の層（spec 決定 2）
        usecase:
          list-mode: lax
          files:
            - "**/internal/app/usecase/**"
          deny:
            - pkg: github.com/kukv/hedgehug/internal/app/cli
              desc: usecase は cli より下の層（spec 決定 2）
            - pkg: github.com/kukv/hedgehug/internal/app/server
              desc: usecase は server より下の層（spec 決定 2）
        # usecase の領域どうしは import しない。共有するものは土台（usecase 直下）に置く（spec 2.3）。
        # テストは準備に別の領域の操作を使ってよいので、本番のファイルだけにかける（決定 17）。
        # usecasetest はテスト用の部品なので対象外。
        usecase-domains:
          list-mode: lax
          files:
            - "**/internal/app/usecase/*/**"
            - "!$test"
            - "!**/internal/app/usecase/usecasetest/**"
          deny:
            # 前方一致なので、領域を足しても一覧を直さずに止まる。土台（末尾の / がない）は止めない。
            - pkg: github.com/kukv/hedgehug/internal/app/usecase/
              desc: 領域どうしは土台を通す（spec 2.3）
    forbidigo:
      analyze-types: true
      forbid:
        # OS に触る呼び出しは internal/lib/osfs を通す（spec: OS の境界）。
        - pattern: ^os\.(Rename|Remove|RemoveAll|ReadFile|WriteFile|Open|OpenFile|CreateTemp|MkdirTemp|Mkdir|MkdirAll|Chmod|Stat|Lstat|ReadDir)$
          msg: use the function of the same name in internal/lib/osfs
        - pattern: ^exec\.Command$
          msg: use osfs.Command
        - pattern: ^(syscall|unix)\.
          msg: keep syscall and golang.org/x/sys/unix in internal/lib/osfs
  exclusions:
    rules:
      - linters:
          - revive
        text: "^(exported|unused-parameter):"
      - path: (_test\.go|internal/app/usecase/usecasetest/)
        linters:
          - gosec
      # osfs と、テストのファイルとテスト用のパッケージは OS を直接呼んでよい。
      - path: (_test\.go|internal/lib/(osfs|testenv|fakegh)/|internal/lib/gitrepo/gitrepotest/|internal/app/storage/history/historytest/|internal/app/usecase/usecasetest/)
        linters:
          - forbidigo

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofumpt
    - goimports
