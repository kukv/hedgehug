version: "2"

linters:
  default: standard
  enable:
    - revive
    - gosec
    - misspell
    - gocritic
    - bodyclose
    - unconvert
    - unparam
    - forbidigo
    - depguard
  settings:
    depguard:
      rules:
        # cli と server は usecase を通す（spec 4.2）。テストも同じ（決定 11）。
        # テスト用の部品（決定 12）は許す。
        entry:
          list-mode: lax
          files:
            - "**/internal/app/cli/**"
            - "**/internal/app/server/**"
          allow:
            - github.com/kukv/hedgehug/internal/lib/gitrepo/gitrepotest
            - github.com/kukv/hedgehug/internal/app/storage/history/historytest
            - github.com/kukv/hedgehug/internal/app/storage/mount/mounttest
          deny:
            - pkg: github.com/kukv/hedgehug/internal/app/storage
              desc: cli と server は usecase を通す（spec 4.2）
            - pkg: github.com/kukv/hedgehug/internal/app/remote
              desc: cli と server は usecase を通す（spec 4.2）
            - pkg: github.com/kukv/hedgehug/internal/lib/gitrepo
              desc: cli と server は usecase を通す（spec 4.2）
            - pkg: github.com/kukv/hedgehug/internal/lib/github
              desc: cli と server は usecase を通す（spec 4.2）
    forbidigo:
      analyze-types: true
      forbid:
        # OS に触る呼び出しは internal/lib/osfs を通す（spec: OS の境界）。
        - pattern: ^os\.(Rename|Remove|RemoveAll|ReadFile|WriteFile|OpenFile|MkdirAll)$
          msg: use the function of the same name in internal/lib/osfs
        - pattern: ^exec\.Command$
          msg: use osfs.Command
        - pattern: ^(syscall|unix)\.
          msg: keep syscall and golang.org/x/sys/unix in internal/lib/osfs
  exclusions:
    rules:
      - linters:
          - revive
        text: "^(exported|unused-parameter):"
      - path: (_test\.go|internal/app/usecase/usecasetest/)
        linters:
          - gosec
      # osfs と、テストのファイルとテスト用のパッケージは OS を直接呼んでよい。
      - path: (_test\.go|internal/lib/(osfs|testenv|fakegh)/|internal/lib/gitrepo/gitrepotest/|internal/app/storage/history/historytest/|internal/app/usecase/usecasetest/)
        linters:
          - forbidigo

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofumpt
    - goimports
