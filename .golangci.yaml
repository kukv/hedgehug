version: "2"

linters:
  default: standard
  enable:
    - revive
    - gosec
    - misspell
    - gocritic
    - bodyclose
    - unconvert
    - unparam
    - forbidigo
    # depguard は層を分けるパッケージができたときに、そのルールと一緒に有効にする。
    # ルール無しで有効にすると、標準ライブラリ以外の import をすべて拒否する。
  settings:
    forbidigo:
      analyze-types: true
      forbid:
        # OS に触る呼び出しは internal/lib/osfs を通す（spec: OS の境界）。
        - pattern: ^os\.(Rename|Remove|RemoveAll|ReadFile|WriteFile|OpenFile|MkdirAll)$
          msg: use the function of the same name in internal/lib/osfs
        - pattern: ^exec\.Command$
          msg: use osfs.Command
        - pattern: ^(syscall|unix)\.
          msg: keep syscall and golang.org/x/sys/unix in internal/lib/osfs
  exclusions:
    rules:
      - linters:
          - revive
        text: "^(exported|unused-parameter):"
      - path: (_test\.go|internal/app/usecase/usecasetest/)
        linters:
          - gosec
      # osfs と、テストのファイルとテスト用のパッケージは OS を直接呼んでよい。
      - path: (_test\.go|internal/lib/(osfs|testenv|fakegh)/|internal/lib/gitrepo/gitrepotest/|internal/app/storage/history/historytest/|internal/app/usecase/usecasetest/)
        linters:
          - forbidigo

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofumpt
    - goimports
