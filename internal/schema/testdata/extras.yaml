statuses:
- {name: backlog, category: todo, default: false, hint: 未知のキー}
# 既定の未着手
- name: todo
  label: 未着手 # ラベル
  category: todo
  default: true
  sla: 3d
- {name: in_progress, category: doing, default: true}
- {name: done, category: done, default: true}
- {name: canceled, category: canceled, default: true}
kinds:
- {name: project, role: container, default: false, color: blue}
- name: task
  role: work # 作業
  default: true
  wip_limit: 5
props:
  priority: {type: enum, values: [low, high], order: desc} # 未知のキー
  points:
    type: number # 数値
    min: 0
workflow:
  transitions:
    todo: [in_progress] # 開始
  note: 未知のキー
scoped:
- where: project:01JBZ8K3QW7M2X9V4T6R5N8P0B
  owner: github.com/yourname # 未知のキー
  templates:
    # 種類ごとの既定
    default:
      task: release-checklist
      project: kickoff
