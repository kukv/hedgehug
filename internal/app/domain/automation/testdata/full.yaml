# Automation rules of the store.
rules:
- id: pr-opened
  on: pr.opened
  set: {status: in_progress}
- id: pr-review
  on: pr.review_requested
  set: {status: review}
  enabled: false # off for now
- id: pr-merged
  on: pr.merged
  when: all_linked_prs_merged
  set: {category: done}
  owner: web # unknown key
- id: issue-closed
  on: issue.closed
  set: {category: done}
- id: release-review
  where: "project:01JBZ7XXH2M4Q8R1T5V9W3Y6ZA"
  on: pr.review_requested
  set: {status: waiting}
scoped:
- where: "project:01JBZ7XXH2M4Q8R1T5V9W3Y6ZA"
  disable: [pr-review]
issue_fields:
  default_sync: link
  push: [title, body, status, assignees, labels]
  mirror: [title, status, assignees]
  props: {milestone: target}
  note: unknown key
future: {a: 1} # unknown key
